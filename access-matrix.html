<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position Access Matrix — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20260925i">
<style>
  /* Ren's spec, 2026-09-22: HR-201-driven Position Access Matrix. Deliberately NOT a
     giant position×permission grid with rotated column headers (that's exactly what
     section 29 forbids -- "do not display position names vertically one letter at a
     time"). Instead: pick a position/role (as a wrapping row of plain, horizontally-
     readable pills -- never a narrow fixed column), then edit its permissions grouped
     by category below. This is the SAME component at every width (section 30 -- "do
     not create separate mobile permission logic"): the pills reflow via flex-wrap and
     the detail panel stacks full-width on narrow screens, but it's one DOM tree, one
     state, one set of event handlers throughout. */
  .am-pill-row { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .am-pill {
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:8px 14px; border-radius:10px; border:1px solid #e5e5e5; background:#fff;
    cursor:pointer; font-size:13px; min-height:44px; justify-content:center;
  }
  .am-pill:hover { border-color:var(--rose); }
  .am-pill.active { border-color:var(--rose); background:var(--rose); box-shadow:0 0 0 1px var(--rose); }
  .am-pill .am-pill-name { font-weight:700; white-space:nowrap; }
  .am-pill .am-pill-meta { font-size:10px; color:var(--muted); white-space:nowrap; }
  .am-pill.am-pill-inactive { opacity:.55; }
  .am-detail-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  .am-detail-title { font-size:18px; font-weight:700; margin:0; }
  .am-toggle-row { display:flex; align-items:center; gap:8px; font-size:12px; }
  .am-toggle-row label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  /* Category sections now use the shared details.exp.exp-cat pattern (css/styles.css,
     Ren's 2026-09-22 expand/collapse spec) instead of a bespoke ::before-swap arrow --
     same look, but the arrow is a real element (rotates, and isn't at risk of being
     read into the accessible name by assistive tech the way ::before content can be). */
  .am-perm-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid #f4f4f4; }
  .am-perm-row label { display:flex; align-items:center; gap:10px; cursor:pointer; flex:1; min-width:0; }
  .am-perm-row input[type=checkbox] { width:20px; height:20px; min-width:20px; cursor:pointer; }
  .am-perm-name { font-weight:600; font-size:13px; }
  .am-perm-key { font-size:10px; color:var(--muted); }
  .am-perm-row.am-perm-dim { opacity:.4; }
  .am-source-override-grant { color:var(--ok); }
  .am-source-override-revoke { color:var(--warn); }
  .am-log-item { padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }
  .am-log-item:last-child { border-bottom:none; }
  .am-log-item .when { color:var(--muted); font-size:11px; }
  @media (min-width: 900px) {
    .am-pill { min-width:150px; }
  }
</style>
</head>
<body>
<main>
  <div id="am-msg"></div>
  <div id="am-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js?v=20260925i';
import {
  getPermissionMatrix, setPositionPermission, getEmployeesForChecklist,
  listEmployeePermissionOverrides, setEmployeePermissionOverride, removeEmployeePermissionOverride,
  listAccessChangeLog, listHrPositions, createHrPosition, renameHrPosition,
  setHrPositionAutomaticAccess, setHrPositionActive, getRoleEmployeeCounts,
} from './js/api.js?v=20260925i';
import { sortControlHtml, wireSortControl, applySort, byText, byNumber } from './js/uiKit.js?v=20260925i';

// Roles are a fixed system enum (employees_role_check), not HR 201 data -- unlike
// positions, there's nothing to load dynamically here (spec section 1 is specifically
// about POSITIONS; a role can't be added/renamed from HR 201 the way a position can).
const ROLES = ['Admin', 'Manager', 'Branch Supervisor', 'Staff', 'None'];

const SORT_FIELDS = [
  { key: 'name', label: 'Name' }, { key: 'active_employee_count', label: 'Active Employees' },
];
const SORT_COMPARATORS = { name: byText('name'), active_employee_count: byNumber('active_employee_count') };

const employee = await initShell('access-matrix');
if (employee) {
  const root = document.getElementById('am-root');

  if (employee.role !== 'Admin') {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">The Position Access Matrix is Admin-only.</p></div></div>';
  } else {
    let keys = []; // [{key, label, category}]
    let grants = new Set(); // "permissionKey|positionKey"
    let positions = []; // from listHrPositions(): {id, name, is_active, automatic_access, active_employee_count, total_employee_count}
    let roleCounts = {}; // { role: active_employee_count }, from getRoleEmployeeCounts() -- Admin-inclusive, unlike getEmployeesForChecklist()
    let employees = [];
    let overrides = [];
    let log = [];
    let selectedColumnKey = null; // 'ROLE:Admin' or 'POSITION:<name>'
    // Descending default (Ren, 2026-09-24: "always show the direction in descending
    // way") -- matches every other sortable list in the app.
    const sort = { field: 'name', dir: 'desc' };
    const filters = { search: '', category: 'all', status: 'active' };

    function columnLabel(key) { return key.startsWith('ROLE:') ? key.slice(5) + ' (role)' : key.slice(9); }
    function positionByName(name) { return positions.find((p) => p.name === name); }

    async function load(keepSelection) {
      try {
        const [matrixRows, posRows, roleCountRows, emps, ov, lg] = await Promise.all([
          getPermissionMatrix(), listHrPositions(), getRoleEmployeeCounts(), getEmployeesForChecklist(), listEmployeePermissionOverrides(), listAccessChangeLog(80),
        ]);
        const byKey = {};
        grants = new Set();
        matrixRows.forEach((r) => {
          if (!byKey[r.permission_key]) byKey[r.permission_key] = { key: r.permission_key, label: r.permission_label, category: r.category };
          if (r.position_key) grants.add(r.permission_key + '|' + r.position_key);
        });
        keys = Object.values(byKey).sort((a, b) => a.category.localeCompare(b.category) || a.key.localeCompare(b.key));
        positions = posRows;
        roleCounts = roleCountRows;
        employees = emps;
        overrides = ov;
        log = lg;
        if (!keepSelection) selectedColumnKey = null;
      } catch (err) {
        toast('am-msg', String(err.message || err), true);
      }
      render();
    }

    // ---- position/role picker ----
    function pickerRows() {
      const q = filters.search.trim().toLowerCase();
      const roleRows = ROLES.map((r) => ({ key: 'ROLE:' + r, name: r, isRole: true, active_employee_count: null, automatic_access: null, is_active: true }));
      let posRows = positions.map((p) => ({ key: 'POSITION:' + p.name, name: p.name, isRole: false, ...p }));
      if (filters.status === 'active') posRows = posRows.filter((p) => p.is_active);
      else if (filters.status === 'inactive') posRows = posRows.filter((p) => !p.is_active);
      if (q) posRows = posRows.filter((p) => p.name.toLowerCase().includes(q));
      posRows = applySort(posRows, sort, SORT_COMPARATORS);
      return { roleRows: q ? roleRows.filter((r) => r.name.toLowerCase().includes(q)) : roleRows, posRows };
    }

    function pillHtml(row) {
      const meta = row.isRole ? 'Role' :
        (row.active_employee_count) + ' active' + (row.automatic_access ? '' : ' · Manual only') + (row.is_active ? '' : ' · Inactive');
      return '<div class="am-pill' + (selectedColumnKey === row.key ? ' active' : '') + (row.is_active === false ? ' am-pill-inactive' : '') + '" data-col="' + esc(row.key) + '">' +
        '<span class="am-pill-name">' + esc(row.name) + '</span>' +
        '<span class="am-pill-meta">' + esc(meta) + '</span>' +
      '</div>';
    }

    // ---- detail/edit panel for the selected position or role ----
    function detailHtml() {
      if (!selectedColumnKey) return '<p class="muted">Select a role or position above to view and edit its permissions.</p>';
      const isPosition = selectedColumnKey.startsWith('POSITION:');
      const name = columnLabel(selectedColumnKey).replace(' (role)', '');
      const posRow = isPosition ? positionByName(name) : null;
      const affected = isPosition ? (posRow ? posRow.active_employee_count : 0) : (roleCounts[name] || 0);

      const catFilter = filters.category;
      const permFilter = filters.permSearch ? filters.permSearch.trim().toLowerCase() : '';
      const byCategory = {};
      keys.forEach((k) => {
        if (catFilter !== 'all' && k.category !== catFilter) return;
        if (permFilter && !k.label.toLowerCase().includes(permFilter) && !k.key.toLowerCase().includes(permFilter)) return;
        (byCategory[k.category] = byCategory[k.category] || []).push(k);
      });

      const sectionsHtml = Object.keys(byCategory).length ? Object.keys(byCategory).sort().map((cat) => {
        const rows = byCategory[cat].map((k) => {
          const checked = grants.has(k.key + '|' + selectedColumnKey);
          return '<div class="am-perm-row">' +
            '<label><input type="checkbox" data-perm="' + esc(k.key) + '"' + (checked ? ' checked' : '') + '>' +
              '<span><span class="am-perm-name">' + esc(k.label) + '</span><br><span class="am-perm-key">' + esc(k.key) + '</span></span>' +
            '</label>' +
          '</div>';
        }).join('');
        return '<details class="exp exp-cat" open><summary><span class="exp-arrow" aria-hidden="true">▸</span>' + esc(cat) + ' <span class="exp-count">(' + byCategory[cat].length + ')</span></summary><div class="exp-body" style="padding:0;">' + rows + '</div></details>';
      }).join('') : '<p class="muted">No permissions match this filter.</p>';

      return '<div class="am-detail-header">' +
          '<div><h3 class="am-detail-title">' + esc(name) + (isPosition ? '' : ' <span class="muted" style="font-size:12px;font-weight:normal;">(role)</span>') + '</h3>' +
            '<p class="muted" style="margin:2px 0 0;">' + affected + ' active employee' + (affected === 1 ? '' : 's') + ' currently ' + (isPosition ? 'in this position' : 'holding this role') + '.</p>' +
          '</div>' +
          (isPosition ? '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">' +
            '<div class="am-toggle-row"><label><input type="checkbox" id="am-auto-access"' + (posRow.automatic_access ? ' checked' : '') + '> Automatic Access</label></div>' +
            '<div class="am-toggle-row"><label><input type="checkbox" id="am-pos-active"' + (posRow.is_active ? ' checked' : '') + '> Position Active</label></div>' +
            '<button type="button" class="btn small secondary" id="am-rename-pos">Rename Position</button>' +
          '</div>' : '') +
        '</div>' +
        (isPosition && !posRow.automatic_access
          ? '<p class="muted" style="background:#fff8e8;padding:8px 10px;border-radius:6px;">Automatic Access is OFF for this position -- these checkboxes define the template, but nobody currently in ' + esc(name) + ' inherits them passively. Grant access via an Individual Override below for anyone who needs it.</p>'
          : '') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:10px 0;">' +
          '<div class="field" style="min-width:180px;"><label>Permission Name</label><input type="text" id="am-perm-search" placeholder="Search permissions…" value="' + esc(filters.permSearch || '') + '"></div>' +
          '<div class="field"><label>Category</label><select id="am-cat-filter">' +
            '<option value="all">All Categories</option>' + [...new Set(keys.map((k) => k.category))].sort().map((c) => '<option' + (c === catFilter ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
          '</select></div>' +
        '</div>' +
        sectionsHtml;
    }

    function render() {
      const { roleRows, posRows } = pickerRows();
      const overridesHtml = !overrides.length ? '<p class="muted">No individual overrides set.</p>' :
        '<div class="table-scroll"><table><thead><tr><th>Employee</th><th>Permission</th><th>Grant/Revoke</th><th>Reason</th><th>Expires</th><th></th></tr></thead><tbody>' +
        overrides.map((o) => '<tr>' +
          '<td data-label="Employee">' + esc((o.employee && o.employee.full_name) || '—') + '</td>' +
          '<td data-label="Permission">' + esc(o.permission_key) + '</td>' +
          '<td data-label="Grant/Revoke"><span class="' + (o.granted ? 'am-source-override-grant' : 'am-source-override-revoke') + '">' + (o.granted ? 'Granted' : 'Revoked') + '</span></td>' +
          '<td data-label="Reason">' + esc(o.reason || '—') + '</td>' +
          '<td data-label="Expires">' + (o.expires_at ? esc(o.expires_at.slice(0, 10)) : 'Never') + '</td>' +
          '<td><button type="button" class="btn small secondary" data-remove-override="' + o.employee_id + '|' + esc(o.permission_key) + '">Remove</button></td>' +
        '</tr>').join('') + '</tbody></table></div>';

      const empOptions = employees.map((e) => '<option value="' + e.id + '">' + esc(e.name || e.full_name) + '</option>').join('');
      const permOptions = keys.map((k) => '<option value="' + esc(k.key) + '">' + esc(k.label) + '</option>').join('');

      const logHtml = !log.length ? '<p class="muted">No access changes logged yet.</p>' :
        log.map((l) => '<div class="am-log-item"><div>' + esc(l.action) + (l.employee ? ' — ' + esc(l.employee.full_name) : '') + '</div>' +
          '<div class="muted">' + esc(l.details || '') + '</div>' +
          '<div class="when">' + esc((l.changer && l.changer.full_name) || 'System') + ' · ' + new Date(l.changed_at).toLocaleString('en-PH') + '</div></div>').join('');

      root.innerHTML =
        '<h2>Position Access Matrix</h2>' +
        '<p class="muted">Positions load straight from HR 201 -- adding, renaming, or reassigning a position there updates this matrix automatically, nothing to maintain here by hand. Checking a permission grants it to every active employee currently in that role/position immediately (unless Automatic Access is off for that position); unchecking revokes it from all of them immediately. Use Individual Overrides below for one employee who needs something different from their default.</p>' +
        '<div class="card">' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
            '<div class="field" style="min-width:200px;"><label>Search Position/Role</label><input type="text" id="am-search" placeholder="Name…" value="' + esc(filters.search) + '"></div>' +
            '<div class="field"><label>Position Status</label><select id="am-status-filter"><option value="active"' + (filters.status === 'active' ? ' selected' : '') + '>Active Only</option><option value="all"' + (filters.status === 'all' ? ' selected' : '') + '>All</option><option value="inactive"' + (filters.status === 'inactive' ? ' selected' : '') + '>Inactive Only</option></select></div>' +
            sortControlHtml(SORT_FIELDS, sort, 'am-sort-field', 'am-sort-dir') +
            '<button type="button" class="btn small secondary" id="am-add-pos">+ Add Position</button>' +
          '</div>' +
          '<h4 style="margin:14px 0 2px;">Roles</h4><div class="am-pill-row">' + roleRows.map(pillHtml).join('') + '</div>' +
          '<h4 style="margin:10px 0 2px;">Positions <span class="muted" style="font-weight:normal;">— from HR 201</span></h4>' +
          '<div class="am-pill-row">' + (posRows.length ? posRows.map(pillHtml).join('') : '<p class="muted">No positions match this filter.</p>') + '</div>' +
        '</div>' +
        '<div class="card">' + detailHtml() + '</div>' +
        '<div class="card">' +
          '<h3 style="margin-top:0;">Individual Overrides</h3>' +
          '<p class="muted">Grants or revokes one permission for one specific employee, beating whatever their role/position would otherwise give them.</p>' +
          '<form id="am-override-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;">' +
            '<div class="field"><label>Employee</label><select id="am-ov-emp" required><option value="">Select…</option>' + empOptions + '</select></div>' +
            '<div class="field"><label>Permission</label><select id="am-ov-perm" required><option value="">Select…</option>' + permOptions + '</select></div>' +
            '<div class="field"><label>Action</label><select id="am-ov-grant"><option value="true">Grant</option><option value="false">Revoke</option></select></div>' +
            '<div class="field" style="flex:1 1 200px;"><label>Reason</label><input type="text" id="am-ov-reason" placeholder="Why this override"></div>' +
            '<button class="btn" type="submit">Set Override</button>' +
          '</form>' +
          overridesHtml +
        '</div>' +
        '<div class="card">' +
          '<h3 style="margin-top:0;">Recent Access Changes</h3>' +
          '<p class="muted">Every position-level grant/revoke, individual override, and HR role/position/branch/status change, most recent first. Also mirrored to the Global Activity feed (User Access / HR Changes / Audit categories).</p>' +
          logHtml +
        '</div>';

      wireEvents();
    }

    function wireEvents() {
      root.querySelectorAll('[data-col]').forEach((pill) => pill.addEventListener('click', () => {
        selectedColumnKey = pill.dataset.col;
        filters.permSearch = '';
        filters.category = 'all';
        render();
      }));

      document.getElementById('am-search').addEventListener('input', (ev) => { filters.search = ev.target.value; render(); });
      document.getElementById('am-status-filter').addEventListener('change', (ev) => { filters.status = ev.target.value; render(); });
      wireSortControl('am-sort-field', 'am-sort-dir', sort, render);

      document.getElementById('am-add-pos').addEventListener('click', async () => {
        const name = prompt('New position name (from HR 201 -- this also becomes selectable when assigning an employee\'s position):');
        if (!name || !name.trim()) return;
        try {
          const id = await createHrPosition(name.trim());
          toast('am-msg', 'Position added.', false);
          await load(true);
          selectedColumnKey = 'POSITION:' + name.trim();
          render();
        } catch (err) {
          toast('am-msg', String(err.message || err), true);
        }
      });

      const catFilterEl = document.getElementById('am-cat-filter');
      if (catFilterEl) catFilterEl.addEventListener('change', (ev) => { filters.category = ev.target.value; render(); });
      const permSearchEl = document.getElementById('am-perm-search');
      if (permSearchEl) permSearchEl.addEventListener('input', (ev) => { filters.permSearch = ev.target.value; render(); });

      const autoAccessEl = document.getElementById('am-auto-access');
      if (autoAccessEl) autoAccessEl.addEventListener('change', async () => {
        const name = columnLabel(selectedColumnKey);
        const posRow = positionByName(name);
        const enabling = autoAccessEl.checked;
        const msg = enabling
          ? 'Turn Automatic Access back ON for ' + name + '? All ' + posRow.active_employee_count + ' active employee(s) currently in this position will immediately receive its checked permissions again.'
          : 'Turn Automatic Access OFF for ' + name + '? All ' + posRow.active_employee_count + ' active employee(s) currently in this position will immediately LOSE its checked permissions (unless they have an Individual Override).';
        if (!confirm(msg)) { autoAccessEl.checked = !enabling; return; }
        autoAccessEl.disabled = true;
        try {
          await setHrPositionAutomaticAccess(posRow.id, enabling);
          toast('am-msg', 'Automatic Access ' + (enabling ? 'enabled' : 'disabled') + ' for ' + name + '.', false);
          await load(true);
        } catch (err) {
          toast('am-msg', String(err.message || err), true);
          autoAccessEl.checked = !enabling;
          autoAccessEl.disabled = false;
        }
      });

      const posActiveEl = document.getElementById('am-pos-active');
      if (posActiveEl) posActiveEl.addEventListener('change', async () => {
        const name = columnLabel(selectedColumnKey);
        const posRow = positionByName(name);
        const activating = posActiveEl.checked;
        posActiveEl.disabled = true;
        try {
          await setHrPositionActive(posRow.id, activating);
          toast('am-msg', 'Position ' + (activating ? 'reactivated' : 'deactivated') + '.', false);
          await load(true);
        } catch (err) {
          toast('am-msg', String(err.message || err), true);
          posActiveEl.checked = !activating;
          posActiveEl.disabled = false;
        }
      });

      const renameBtn = document.getElementById('am-rename-pos');
      if (renameBtn) renameBtn.addEventListener('click', async () => {
        const name = columnLabel(selectedColumnKey);
        const posRow = positionByName(name);
        const newName = prompt('Rename "' + name + '" to:', name);
        if (!newName || !newName.trim() || newName.trim() === name) return;
        if (!confirm('Rename "' + name + '" to "' + newName.trim() + '"? This updates the HR 201 record for all ' + posRow.total_employee_count + ' employee(s) ever assigned to it, plus its permission template.')) return;
        try {
          await renameHrPosition(posRow.id, newName.trim());
          toast('am-msg', 'Position renamed.', false);
          selectedColumnKey = 'POSITION:' + newName.trim();
          await load(true);
        } catch (err) {
          toast('am-msg', String(err.message || err), true);
        }
      });

      root.querySelectorAll('.am-perm-row input[type=checkbox]').forEach((cb) => cb.addEventListener('change', async () => {
        const permKey = cb.dataset.perm;
        const checked = cb.checked;
        // columnLabel() appends " (role)" for display -- strip it back off before
        // using the name as a lookup key (positionByName()/roleCounts), the same fix
        // detailHtml() already applies at its own call site above.
        const name = columnLabel(selectedColumnKey).replace(' (role)', '');
        const isPosition = selectedColumnKey.startsWith('POSITION:');
        const affected = isPosition ? (positionByName(name) || {}).active_employee_count || 0 : (roleCounts[name] || 0);
        const keyInfo = keys.find((k) => k.key === permKey);
        // Section 19: confirm before a change that actually reaches live employees;
        // skip the interruption for a pre-staged position nobody's in yet.
        if (affected > 0) {
          const msg = (checked ? 'Grant "' : 'Revoke "') + (keyInfo ? keyInfo.label : permKey) + '" ' + (checked ? 'to' : 'from') +
            ' all ' + affected + ' active employee' + (affected === 1 ? '' : 's') + ' currently ' + (isPosition ? 'in ' + name : 'holding ' + name) + '?\n\nThis takes effect immediately.';
          if (!confirm(msg)) { cb.checked = !checked; return; }
        }
        cb.disabled = true;
        try {
          await setPositionPermission(selectedColumnKey, permKey, checked);
          if (checked) grants.add(permKey + '|' + selectedColumnKey); else grants.delete(permKey + '|' + selectedColumnKey);
          toast('am-msg', (checked ? 'Granted ' : 'Revoked ') + (keyInfo ? keyInfo.label : permKey) + ' for ' + name + '.', false);
        } catch (err) {
          cb.checked = !checked;
          toast('am-msg', String(err.message || err), true);
        } finally {
          cb.disabled = false;
        }
      }));

      document.getElementById('am-override-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const employeeId = document.getElementById('am-ov-emp').value;
        const permissionKey = document.getElementById('am-ov-perm').value;
        const granted = document.getElementById('am-ov-grant').value === 'true';
        const reason = document.getElementById('am-ov-reason').value.trim();
        if (!employeeId || !permissionKey) return;
        try {
          await setEmployeePermissionOverride(employeeId, permissionKey, granted, reason);
          toast('am-msg', 'Override saved.', false);
          await load(true);
        } catch (err) {
          toast('am-msg', String(err.message || err), true);
        }
      });

      root.querySelectorAll('[data-remove-override]').forEach((btn) => btn.addEventListener('click', async () => {
        const [employeeId, permissionKey] = btn.dataset.removeOverride.split('|');
        if (!confirm('Remove this override? The employee will fall back to their role/position default.')) return;
        try {
          await removeEmployeePermissionOverride(employeeId, permissionKey);
          toast('am-msg', 'Override removed.', false);
          await load(true);
        } catch (err) {
          toast('am-msg', String(err.message || err), true);
        }
      }));
    }

    await load();
  }
}
</script>
</body>
</html>
