<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Checklist — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20260926a">
<style>
  .ac-item { padding:10px 0; border-bottom:1px solid #f0f0f0; }
  .ac-item:last-child { border-bottom:none; }
  .ac-item .lbl-text { display:block; margin-bottom:6px; }
  .ac-task-card h4 { margin:0 0 2px; }
  .lvl-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .lvl-pill { border:1px solid #e2e2e2; background:#fff; color:var(--muted); padding:4px 12px; border-radius:14px; font-size:12px; cursor:pointer; font:inherit; }
  .lvl-pill:hover { border-color:#ccc; }
  .lvl-pill.active.none { background:#fdecea; color:var(--warn); border-color:#fdecea; }
  .lvl-pill.active.view { background:#eef2f7; color:#46586b; border-color:#eef2f7; }
  .lvl-pill.active.encode { background:#eaf6ec; color:var(--ok); border-color:#eaf6ec; }
  .lvl-pill.active.edit { background:#fff4e0; color:#a15c00; border-color:#fff4e0; }
  .lvl-pill.active.approver { background:#f0e9fb; color:#6a3fa0; border-color:#f0e9fb; }
  /* Inventory Value by Branch's category filter -- own accent (not a level pill) so
     it doesn't read as one of the five access-level states above. */
  .cat-pill { border:1px solid #e2e2e2; background:#fff; color:var(--muted); padding:4px 12px; border-radius:14px; font-size:12px; cursor:pointer; font:inherit; }
  .cat-pill:hover { border-color:#ccc; }
  .cat-pill.active { background:var(--rose); color:var(--ink); border-color:var(--rose); }

  .ac-layout { display:flex; gap:16px; align-items:flex-start; }
  .ac-emp-list { flex:0 0 260px; max-height:calc(100vh - 220px); overflow-y:auto; padding:6px; }
  .ac-emp-main { flex:1 1 auto; min-width:0; }
  .ac-emp-row { display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:10px 12px; cursor:pointer; font:inherit; color:inherit; }
  .ac-emp-row:hover { background:#f7f5f0; }
  .ac-emp-row.active { background:var(--rose); }
  .ac-emp-row .name { font-weight:600; }
  .ac-emp-row .sub { font-size:12px; color:var(--muted); }
  .ac-emp-row .progress { font-size:11px; color:var(--muted); margin-top:2px; }
  @media (max-width:760px) {
    .ac-layout { flex-direction:column; }
    .ac-emp-list { flex:0 0 auto; max-height:300px; width:100%; }
  }
</style>
</head>
<body>
<main>
  <div id="ac-msg"></div>
  <div id="ac-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js?v=20260926a';
import {
  getEmployeesForChecklist, getAccessChecklist, setAccessChecklistItem, updateEmployeePosition, listScrapEntries,
  subscribeToChanges, getBranches, listProducts, listAllInventoryQty, listHrPositions, setEmployeePassword,
  listSales, listPackedOrders, listOnlineOrderCareAssignments,
} from './js/api.js?v=20260926a';
import { branchColor } from './js/branchColors.js?v=20260926a';
import { sortControlHtml, wireSortControl, applySort, byText, byNumber } from './js/uiKit.js?v=20260926a';

// Global Filter + Sort rules (Ren, 2026-09-21, section 36) -- replaces this leaderboard's
// old per-column header-click sort with the one shared control used everywhere else.
const SCRAP_LB_SORT_FIELDS = [
  { key: 'name', label: 'Employee' }, { key: 'count', label: 'Entries Encoded' },
  { key: 'total', label: 'Total' }, { key: 'grams', label: 'Grams Received' },
];
const SCRAP_LB_SORT_COMPARATORS = { name: byText('name'), count: byNumber('count'), total: byNumber('total'), grams: byNumber('grams') };

// POS Top Selling and Online Orders (Packed By) leaderboards -- Ren, 2026-09-25: "in
// the access checklist theres no pos top selling and online orders" -- same shape as
// the Scrap Encoding Activity leaderboard above (company-wide, ranked, own date range).
// POS Top Selling ranks STAFF here (Ren: "pos top selling if for all the staff not the
// product") -- the item/product ranking already exists on Dashboard's own "Top-Selling
// Items" table, so it isn't duplicated here.
const POS_LB_SORT_FIELDS = [
  { key: 'name', label: 'Employee' }, { key: 'sales', label: 'Sales' }, { key: 'qty', label: 'Qty Sold' }, { key: 'amount', label: 'Total Amount' },
];
const POS_LB_SORT_COMPARATORS = { name: byText('name'), sales: byNumber('sales'), qty: byNumber('qty'), amount: byNumber('amount') };

const PACKED_LB_SORT_FIELDS = [
  { key: 'name', label: 'Employee' }, { key: 'orders', label: 'Orders Packed' }, { key: 'qty', label: 'Qty Packed' },
];
const PACKED_LB_SORT_COMPARATORS = { name: byText('name'), orders: byNumber('orders'), qty: byNumber('qty') };

// Customer Care Staff -- Ren, 2026-09-25: "customer care staff is based in the
// pancake" -- ranks who's assigned as Pancake's own assigning_care for the order
// (who actually handled/converted the sale), not our packed_by tracking above.
const CARE_LB_SORT_FIELDS = [
  { key: 'name', label: 'Staff (Pancake account)' }, { key: 'orders', label: 'Orders' }, { key: 'qty', label: 'Qty' },
];
const CARE_LB_SORT_COMPARATORS = { name: byText('name'), orders: byNumber('orders'), qty: byNumber('qty') };

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const weight = (n) => n === null || n === undefined ? '—' : Number(n).toLocaleString('en-PH', { minimumFractionDigits: 3 }) + 'g';

// HR 201 is the position source of truth (Ren's spec, 2026-09-22) -- this dropdown's
// options load from hr_positions (via listHrPositions() below, fetched once before the
// first render) instead of a hardcoded list kept in sync by hand across three files.
// A strict <select> (not free text) is still right here specifically -- this is a
// "change this employee's actual position" control, so it should only ever offer
// positions that genuinely exist, not let a typo silently create an orphan one
// (creating a genuinely NEW position is a deliberate action on access-matrix.html).
let POSITIONS = [];
const positionOptions = (selected) => '<option value="">— None —</option>' + POSITIONS.map((p) =>
  '<option' + (p === selected ? ' selected' : '') + '>' + esc(p) + '</option>'
).join('');
// Mirrors is_position_manager() in 62_position_managers_refund_scrap_subasta.sql --
// full manage (approve/edit/delete) on Refunds/Scrap/Subasta, not just add.
const POSITION_MANAGERS = ['Operations Supervisor', 'Inventory Supervisor', 'Admin Assistant'];

// Fixed set of task categories, in the order they're shown -- one row per category
// per employee (not several sub-statements), each carrying a single access level.
const CATEGORY_ORDER = ['inventory', 'movement', 'orders', 'transfers', 'branches', 'capital', 'payments', 'assets', 'lbc', 'refund', 'bills'];
const CATEGORY_LABEL = {
  inventory: 'Inventory Visibility',
  movement: 'Stock Movements',
  orders: 'Order & Item Status',
  transfers: 'Transfers',
  branches: 'Branches (Subasta / Scrap)',
  capital: 'Branch Capital',
  payments: 'Transactions',
  assets: 'Asset & Supplies Custodian',
  lbc: 'LBC Monitoring',
  refund: 'Refund Approval',
  bills: 'Bills',
};
// extra_page_access grants (e.g. Jessica on Transactions/Assets) upgrade whichever
// category that page belongs to, rather than showing as a separate row.
const EXTRA_PAGE_CATEGORY = { transactions: 'payments', assets: 'assets', lbc: 'lbc' };
const NO_ACCESS_LABEL = {
  inventory: 'Cannot see any branch’s inventory', movement: 'Cannot record any stock movement',
  transfers: 'Cannot see or act on transfers', branches: 'Cannot add Subasta/Scrap entries',
  capital: 'Cannot access Branch Capital', payments: 'Cannot see Transactions',
  assets: 'Cannot access Asset & Supplies Custodian', lbc: 'Cannot access LBC Monitoring',
};
// Branch Capital, restricted (70_branch_capital_restricted_access.sql): add + view is
// Manager/Branch Supervisor/Personal Assistant only, approve/delete is Admin-only for
// everyone (no one else gets an 'approver' or 'edit' level on this task anymore).

/** Builds one row per task category from the employee's CURRENT role, position,
 * branch, and flags -- not a hardcoded name lookup -- so a role or task change shows
 * up here automatically instead of needing a code edit. Each row is { access: does
 * this person currently have access at all, levels: any combination of
 * 'view'|'encode'|'edit'|'approver' when they do }. 'encode' means they can add a new
 * entry but not edit/delete an existing one (e.g. Staff on Scrap, or anyone's own
 * pending-approval Branch Capital request) -- distinct from 'edit', which is full
 * read-write over existing records. This is the DEFAULT the level picker shows for
 * that row -- Ren can click different options (including combining several, or "No
 * access") to record what's actually observed on their real account, if it differs. */
function itemsForEmployee(emp) {
  const branch = (emp.branches && emp.branches.name) || 'their branch';
  const isPosMgr = POSITION_MANAGERS.includes(emp.position);
  const cat = {};
  CATEGORY_ORDER.forEach((c) => { cat[c] = { label: '', access: false, levels: [] }; });

  if (emp.role === 'Manager') {
    cat.inventory = { label: 'Sees inventory for every branch', access: true, levels: ['view'] };
    cat.movement  = { label: 'Can record stock movements at any branch', access: true, levels: ['encode'] };
    cat.transfers = { label: 'Can approve, ship, and receive transfers anywhere', access: true, levels: ['edit', 'approver'] };
    cat.branches  = { label: 'Can add, edit, and delete Subasta/Scrap for every branch', access: true, levels: ['edit'] };
    cat.capital   = { label: 'Can add (pending Ren’s approval) and view Branch Capital for every branch — cannot approve or delete', access: true, levels: ['view', 'encode'] };
    cat.payments  = { label: 'Can see, add, and import Transactions', access: true, levels: ['edit'] };
    cat.assets    = { label: 'Can add/edit/delete Asset & Supplies Custodian items', access: true, levels: ['edit'] };
    cat.lbc       = { label: 'Can see and manage LBC Monitoring', access: true, levels: ['edit'] };
  } else if (emp.role === 'Branch Supervisor') {
    cat.inventory = { label: 'Sees inventory for ' + branch + ' only', access: true, levels: ['view'] };
    cat.movement  = { label: 'Can record Stock In/Out, Damage, Missing at ' + branch + ' (not Adjustment/Correction)', access: true, levels: ['encode'] };
    cat.transfers = { label: 'Can request, ship, and receive transfers involving ' + branch, access: true, levels: ['edit'] };
    cat.branches  = { label: 'Can add, edit, and delete Subasta/Scrap for ' + branch, access: true, levels: ['edit'] };
    cat.capital   = { label: 'Can add (pending Ren’s approval) and view Branch Capital for ' + branch + ' — cannot approve or delete', access: true, levels: ['view', 'encode'] };
    cat.payments  = { label: 'Can see Transactions and fill in FB Name/Customer/Order ID (not add/import/delete)', access: true, levels: ['edit'] };
    cat.assets    = { label: 'Can add/edit/delete Asset & Supplies Custodian items', access: true, levels: ['edit'] };
    cat.lbc       = { label: 'Can see and manage LBC Monitoring', access: true, levels: ['edit'] };
  } else if (emp.role === 'Staff') {
    cat.inventory = { label: 'Sees inventory for ' + branch + ' only', access: true, levels: ['view'] };
    cat.movement  = { label: 'Can record Stock In/Out, Damage, Missing at ' + branch, access: true, levels: ['encode'] };
    cat.transfers = { label: 'Can view transfers involving ' + branch + ' (cannot request/approve)', access: true, levels: ['view'] };
    cat.branches  = { label: 'Can add Subasta/Scrap entries for ' + branch + ' (cannot edit/delete)', access: true, levels: ['encode'] };
  } else if (emp.role === 'None' && emp.position === 'Sales Admin Associate') {
    cat.inventory = { label: 'Sees inventory for every branch', access: true, levels: ['view'] };
    cat.transfers = { label: 'Can request transfers (cannot approve)', access: true, levels: ['encode'] };
    cat.branches  = { label: 'Can view and add Subasta/Scrap for any branch (cannot edit/delete)', access: true, levels: ['encode'] };
  } else if (emp.role === 'None' && isPosMgr) {
    // Admin Assistant, Operations Supervisor, Inventory Supervisor -- full manage
    // (add/edit/delete) on Subasta/Scrap anywhere, not just add. No Branch Capital
    // access at all now (70_branch_capital_restricted_access.sql).
    cat.branches = { label: 'Can add, edit, and delete Subasta/Scrap for any branch', access: true, levels: ['edit'] };
    if (emp.position === 'Admin Assistant') {
      cat.payments = { label: 'Can see Transactions and fill in FB Name/Customer/Order ID (not add/import/delete)', access: true, levels: ['edit'] };
      cat.lbc      = { label: 'Can see and manage LBC Monitoring', access: true, levels: ['edit'] };
      cat.assets   = { label: 'Can add/edit/delete Asset & Supplies Custodian items', access: true, levels: ['edit'] };
    }
  } else if (emp.role === 'None' && emp.position === 'Personal Assistant') {
    cat.branches = { label: 'Can view Subasta/Scrap for every branch (view only)', access: true, levels: ['view'] };
    cat.capital  = { label: 'Can add (pending Ren’s approval) and view Branch Capital for every branch', access: true, levels: ['view', 'encode'] };
    cat.assets   = { label: 'Can add/edit/delete Asset & Supplies Custodian items', access: true, levels: ['edit'] };
  } else if (emp.role === 'None') {
    cat.branches = emp.branches
      ? { label: 'Can add Subasta/Scrap entries for ' + branch + ' (cannot edit/delete)', access: true, levels: ['encode'] }
      : { label: 'No branch assigned — cannot add Subasta/Scrap entries', access: false, levels: [] };
  }

  const autoRefundApprover = ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role) || isPosMgr;
  cat.refund = (autoRefundApprover || emp.refund_approval_access)
    ? { label: 'Can approve and process refund requests', access: true, levels: ['approver'] }
    : { label: 'Can only submit refund requests (cannot approve)', access: false, levels: [] };

  cat.bills = emp.bills_access
    ? { label: 'Can see and add Bills', access: true, levels: ['edit'] }
    : { label: 'Cannot see the Bills tracker', access: false, levels: [] };

  // Order & Item Status (Record Movement) -- company-wide, any active employee can add
  // and update status; only Manager/Admin can delete (75_order_item_status_tracker.sql).
  // Unlike the rest of "movement" this isn't role/branch-scoped at all, so it's set
  // unconditionally here rather than inside the role branches above.
  cat.orders = emp.role === 'Manager'
    ? { label: 'Can add, update, and delete Order & Item Status entries', access: true, levels: ['edit'] }
    : { label: 'Can add and update Order & Item Status entries (cannot delete)', access: true, levels: ['encode'] };

  // Individually granted extra access upgrades whichever category it belongs to,
  // instead of showing as a separate "other" row.
  (emp.extra_page_access || []).forEach((page) => {
    const c = EXTRA_PAGE_CATEGORY[page];
    if (!c) return;
    cat[c] = { label: cat[c].access ? cat[c].label : 'Individually granted access to ' + page, access: true, levels: cat[c].levels.length ? cat[c].levels : ['edit'] };
  });

  CATEGORY_ORDER.forEach((c) => { if (!cat[c].label) cat[c].label = NO_ACCESS_LABEL[c] || 'No access'; });

  return CATEGORY_ORDER.map((c) => ({ id: c, category: c, label: cat[c].label, access: cat[c].access, levels: cat[c].levels }));
}

const employee = await initShell('access-checklist');
if (employee) {
  const root = document.getElementById('ac-root');

  // Admin-only -- Ren, 2026-09-21: "only me can access the access checklist this is
  // my personal monitoring" (Personal Assistant previously had read-only access;
  // removed here and at the RLS level -- access_checklist_pa_read policy dropped).
  const canView = employee.role === 'Admin';
  const canEdit = employee.role === 'Admin';
  if (!canView) {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">This checklist is limited to Admin.</p></div></div>';
  } else {
    let people = [];
    let selectedId = null;
    // Which employee's Set Password panel is currently open, or null -- reset
    // whenever the selected employee changes, so it never lingers open on the wrong
    // person after switching (Ren, 2026-09-22).
    let showPasswordFormFor = null;

    // overrides holds an EXPLICIT {checked, levels} only for (employee, task) pairs
    // Ren has actually set here -- absence means "not overridden," so the pill picker
    // falls back to the auto-computed item.access/item.levels. This is what lets the
    // picker directly mean "here's their access level(s)" while still defaulting
    // sensibly to what the system actually grants, with room to correct it if reality
    // differs from the computed default.
    let overrides = {};
    try { POSITIONS = (await listHrPositions()).filter((p) => p.is_active).map((p) => p.name); } catch (err) { /* falls back to an empty dropdown -- access-matrix.html is the real fix if this keeps failing */ }

    // Inventory Value by Branch -- total pcs and total retail value (system selling
    // price x pcs on hand) per branch, same numbers SKU Catalog's own tiles show, just
    // surfaced here too (Ren, 2026-09-17: "give me total pcs and total amount in sku
    // catalog per branch show it in access checklist"). Active SKUs only, matching SKU
    // Catalog's own default filter.
    let branches = [];
    let invByBranch = {}; // { branchId: { pcs, amount } }
    let invGrandTotal = { pcs: 0, amount: 0 };
    // Category filter (Ren, 2026-09-24: "add category make it multiple click") -- a
    // multi-select pill row, same click-to-toggle interaction as the level pills above,
    // just its own accent color so the two aren't confused. Empty set = every category
    // (the original, unfiltered behavior); populated fresh each load from whatever
    // categories actually exist on an Active SKU right now.
    let invCategories = [];
    let invCategoryFilter = new Set();
    // Sort for the branch tiles (Ren, 2026-09-24: "sort by branch") -- same shared
    // control as every other sortable list in the app, descending by default.
    const invSort = { field: 'branch', dir: 'desc' };
    const INV_SORT_FIELDS = [
      { key: 'branch', label: 'Branch' }, { key: 'pcs', label: 'Total Pcs' }, { key: 'amount', label: 'Total Value' },
    ];
    const INV_SORT_COMPARATORS = {
      branch: (a, b) => a.name.localeCompare(b.name),
      pcs: (a, b) => (invByBranch[a.id] || { pcs: 0 }).pcs - (invByBranch[b.id] || { pcs: 0 }).pcs,
      amount: (a, b) => (invByBranch[a.id] || { amount: 0 }).amount - (invByBranch[b.id] || { amount: 0 }).amount,
    };

    // Scrap Encoding Activity leaderboard -- who's actually encoding Scrap entries,
    // ranked, with a time range. Kept as JS state (not read from the DOM at render
    // time) because render() below rebuilds the whole page's innerHTML on every
    // action (selecting an employee, changing a position, clicking a level pill) --
    // without this, picking a date range here would reset the instant you clicked
    // anything else on the page.
    let scrapEntries = [];
    let scrapFrom = '', scrapTo = '';
    // Which column ranks the table, via the shared Sort control -- e.g. 'count'
    // (Entries Encoded) or 'total' (Total amount).
    const scrapLbSort = { field: 'count', dir: 'desc' };

    // Same pattern, POS Top Selling (company-wide, ranked by employee) and Online
    // Orders Packed By (company-wide, ranked by employee).
    let posEntries = [];
    let posFrom = '', posTo = '';
    const posLbSort = { field: 'qty', dir: 'desc' };
    let packedEntries = [];
    let packedFrom = '', packedTo = '';
    const packedLbSort = { field: 'orders', dir: 'desc' };
    let careEntries = [];
    let careFrom = '', careTo = '';
    const careLbSort = { field: 'orders', dir: 'desc' };

    // Raw fetch results cached so toggling a category pill (recomputeInventoryValue)
    // doesn't need a fresh network round-trip -- only loadInventoryValue() itself
    // (called on initial load and on a realtime products/inventory change) re-fetches.
    let invProductsCache = [];
    let invQtyRowsCache = [];

    async function loadInventoryValue() {
      const box = document.getElementById('ac-inventory-value-tiles');
      try {
        if (!branches.length) branches = await getBranches();
        const [products, qtyRows] = await Promise.all([listProducts({ status: 'Active' }), listAllInventoryQty()]);
        invProductsCache = products;
        invQtyRowsCache = qtyRows;
      } catch (err) {
        if (box) box.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
        return;
      }
      recomputeInventoryValue();
    }

    // Re-derives invByBranch/invGrandTotal from the already-fetched products/qty rows
    // -- called on load AND whenever the category filter changes, without re-fetching.
    function recomputeInventoryValue() {
      const skuInfo = {};
      invProductsCache.forEach((p) => { skuInfo[p.sku] = { price: p.system_selling_price, category: p.category || 'Uncategorized' }; });
      invCategories = [...new Set(invProductsCache.map((p) => p.category || 'Uncategorized'))].sort();
      // Drop a category from the filter set if it no longer exists (e.g. every SKU in
      // it got discontinued) -- an empty result set would otherwise look like a bug.
      invCategoryFilter.forEach((c) => { if (!invCategories.includes(c)) invCategoryFilter.delete(c); });

      invByBranch = {};
      branches.forEach((b) => { invByBranch[b.id] = { pcs: 0, amount: 0 }; });
      invGrandTotal = { pcs: 0, amount: 0 };
      invQtyRowsCache.forEach((r) => {
        // A row for a Discontinued or otherwise-missing SKU shouldn't count toward
        // an "Active SKUs only" total -- skuInfo only has Active SKUs in it, so a
        // lookup miss means this row isn't one of them.
        const info = skuInfo[r.sku];
        if (!info) return;
        // Empty filter = every category (unfiltered, the original behavior).
        if (invCategoryFilter.size > 0 && !invCategoryFilter.has(info.category)) return;
        const bucket = invByBranch[r.branch_id];
        if (!bucket) return; // a branch not in getBranches() (shouldn't happen, but don't crash on it)
        const qty = Number(r.qty_available || 0);
        const amount = qty * Number(info.price || 0);
        bucket.pcs += qty;
        bucket.amount += amount;
        invGrandTotal.pcs += qty;
        invGrandTotal.amount += amount;
      });
      renderInventoryValue();
    }

    function renderInventoryValue() {
      const box = document.getElementById('ac-inventory-value-tiles');
      if (!box) return;
      const totalTile = '<div class="tile"><div class="num">' + invGrandTotal.pcs.toLocaleString('en-PH') + '</div><div class="lbl">Total Pcs (All Branches)</div>' +
        '<div style="font-size:12px;font-weight:600;margin-top:4px;">' + money(invGrandTotal.amount) + '</div></div>';
      const sortedBranches = applySort(branches, invSort, INV_SORT_COMPARATORS);
      const branchTiles = sortedBranches.map((b) => {
        const v = invByBranch[b.id] || { pcs: 0, amount: 0 };
        const c = branchColor(b.id, branches);
        return '<div class="tile" style="background:' + c.bg + ';">' +
          '<div class="num" style="color:' + c.text + ';">' + v.pcs.toLocaleString('en-PH') + '</div>' +
          '<div class="lbl" style="color:' + c.text + ';">' + esc(b.name) + '</div>' +
          '<div style="font-size:12px;font-weight:600;margin-top:4px;color:' + c.text + ';">' + money(v.amount) + '</div>' +
        '</div>';
      }).join('');

      // Multi-select category filter, click to toggle any combination on/off -- none
      // active shows every category (Ren, 2026-09-24: "add category make it multiple
      // click and sort by branch"). Rebuilt every render since invCategories is data,
      // same as the .lvl-pill rows elsewhere on this page.
      const catPillsHtml = !invCategories.length ? '' :
        '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">' +
          '<span class="muted" style="font-size:12px;">Category:</span>' +
          invCategories.map((c) => '<button type="button" class="cat-pill' + (invCategoryFilter.has(c) ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join('') +
          (invCategoryFilter.size > 0 ? '<button type="button" class="btn small secondary" id="inv-cat-clear">Clear</button>' : '') +
        '</div>';

      box.innerHTML =
        catPillsHtml +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">' +
          sortControlHtml(INV_SORT_FIELDS, invSort, 'inv-sort-field', 'inv-sort-dir') +
        '</div>' +
        '<div class="tiles">' + totalTile + branchTiles + '</div>';

      box.querySelectorAll('[data-cat]').forEach((btn) => btn.addEventListener('click', () => {
        const c = btn.dataset.cat;
        if (invCategoryFilter.has(c)) invCategoryFilter.delete(c); else invCategoryFilter.add(c);
        recomputeInventoryValue();
      }));
      const catClearBtn = document.getElementById('inv-cat-clear');
      if (catClearBtn) catClearBtn.addEventListener('click', () => { invCategoryFilter.clear(); recomputeInventoryValue(); });
      wireSortControl('inv-sort-field', 'inv-sort-dir', invSort, renderInventoryValue);
    }

    async function loadScrapEntries() {
      try { scrapEntries = await listScrapEntries(); } catch (err) { scrapEntries = []; }
      renderScrapLeaderboard();
    }

    function renderScrapLeaderboard() {
      const box = document.getElementById('ac-scrap-leaderboard');
      if (!box) return;
      let rows = scrapEntries;
      if (scrapFrom) rows = rows.filter((r) => r.entry_date >= scrapFrom);
      if (scrapTo) rows = rows.filter((r) => r.entry_date <= scrapTo);

      const byEmp = {};
      rows.forEach((r) => {
        const name = (r.creator && r.creator.full_name) || 'Unknown';
        const e = byEmp[name] || (byEmp[name] = { count: 0, total: 0, grams: 0 });
        e.count += 1;
        e.total += Number(r.total_amount || 0);
        // "Received" -- scrap bought from a customer, not what was later sold back out.
        if (r.entry_type === 'In') e.grams += Number(r.weight_grams || 0);
      });
      // Filtering (the date range above) already picked `rows`/`byEmp`; sort only
      // reorders the ranking (section 11) -- via the shared Sort control, not a
      // per-column header click.
      const unranked = Object.entries(byEmp).map(([name, v]) => ({ name, ...v }));
      const ranked = applySort(unranked, scrapLbSort, SCRAP_LB_SORT_COMPARATORS);
      const grandTotal = rows.reduce((s, r) => s + Number(r.total_amount || 0), 0);
      const grandGrams = rows.reduce((s, r) => s + (r.entry_type === 'In' ? Number(r.weight_grams || 0) : 0), 0);
      // Rank 1 only reads as "the busiest" (bold, gold row, trophy) when sorted
      // highest-first by a performance metric -- sorted the other way, or sorted
      // alphabetically by name, rank 1 isn't a trophy moment.
      const topIsHighlighted = scrapLbSort.dir === 'desc' && scrapLbSort.field !== 'name';

      box.innerHTML =
        (!ranked.length
        ? '<p class="muted">No scrap entries for this range.</p>'
        : '<div class="table-scroll"><table><thead><tr><th>Rank</th><th>Employee</th><th>Entries Encoded</th><th>Total</th><th>Grams Received</th></tr></thead><tbody>' +
            ranked.map((r, i) => '<tr' + (i === 0 && topIsHighlighted ? ' style="font-weight:bold;background:#fdf6e3;"' : '') + '>' +
              '<td data-label="Rank">' + (i + 1) + (i === 0 && topIsHighlighted ? ' 🏆' : '') + '</td>' +
              '<td data-label="Employee">' + esc(r.name) + '</td>' +
              '<td data-label="Entries Encoded">' + r.count + '</td>' +
              '<td data-label="Total">' + money(r.total) + '</td>' +
              '<td data-label="Grams Received">' + weight(r.grams) + '</td>' +
            '</tr>').join('') +
            '</tbody><tfoot><tr style="font-weight:bold;background:#f7f7f7;"><td colspan="2">Total</td><td>' + rows.length + '</td><td>' + money(grandTotal) + '</td><td>' + weight(grandGrams) + '</td></tr></tfoot>' +
          '</table></div>');

      renderScrapGramsByPurity(rows);
    }

    // "Total grams received, by purity" -- company-wide for the same range/filter as
    // the leaderboard above, since a purity total isn't really an employee's own
    // number the way Entries Encoded/Total are. "Received" means bought from a
    // customer (entry_type 'In'); what was later sold back out doesn't count here.
    function renderScrapGramsByPurity(rows) {
      const box = document.getElementById('ac-scrap-grams');
      if (!box) return;
      const inRows = rows.filter((r) => r.entry_type === 'In' && r.weight_grams != null);
      if (!inRows.length) { box.innerHTML = '<p class="muted">No scrap received for this range.</p>'; return; }

      const byKey = {};
      inRows.forEach((r) => {
        const key = r.metal_type + '|' + (r.karat || '');
        byKey[key] = (byKey[key] || 0) + Number(r.weight_grams);
      });
      const items = Object.keys(byKey).map((key) => {
        const [metalType, karat] = key.split('|');
        return { metalType, karat: karat || '—', grams: byKey[key] };
      }).sort((a, b) => a.metalType.localeCompare(b.metalType) || a.karat.localeCompare(b.karat));

      box.innerHTML = '<div class="table-scroll table-mini"><table><tr><th>Metal</th><th>Karat/Purity</th><th>Total Grams Received</th></tr>' +
        items.map((it) => '<tr><td data-label="Metal">' + esc(it.metalType) + '</td><td data-label="Karat/Purity">' + esc(it.karat) + '</td><td data-label="Total Grams Received">' + weight(it.grams) + '</td></tr>').join('') +
        '</table></div>';
    }

    // POS Top Selling -- company-wide, ranked by staff (Ren: "pos top selling if for
    // all the staff not the product") -- who's actually processing sales at the
    // counter, same spirit as the Scrap Encoding Activity leaderboard above. Item/
    // product ranking lives on Dashboard's own "Top-Selling Items" table instead.
    async function loadPosEntries() {
      try { posEntries = await listSales({ fromDate: posFrom || null, toDate: posTo || null }); } catch (err) { posEntries = []; }
      renderPosLeaderboard();
    }

    function renderPosLeaderboard() {
      const box = document.getElementById('ac-pos-leaderboard');
      if (!box) return;
      const employeeNameById = Object.fromEntries(people.map((p) => [p.id, p.name]));
      const byEmp = {};
      posEntries.forEach((r) => {
        if (!r.sale_group_id) return;
        const empId = r.employee_id;
        const e = byEmp[empId] || (byEmp[empId] = { name: employeeNameById[empId] || 'Unknown', groupIds: new Set(), qty: 0, amount: 0 });
        e.groupIds.add(r.sale_group_id);
        e.qty += Number(r.qty || 0);
        e.amount += Number(r.unit_price || 0) * Number(r.qty || 0);
      });
      const unranked = Object.values(byEmp).map((v) => ({ name: v.name, sales: v.groupIds.size, qty: v.qty, amount: v.amount }));
      const ranked = applySort(unranked, posLbSort, POS_LB_SORT_COMPARATORS);
      const grandSales = new Set(posEntries.map((r) => r.sale_group_id).filter(Boolean)).size;
      const grandQty = ranked.reduce((s, r) => s + r.qty, 0);
      const grandAmount = ranked.reduce((s, r) => s + r.amount, 0);
      const topIsHighlighted = posLbSort.dir === 'desc' && posLbSort.field !== 'name';

      box.innerHTML = !ranked.length
        ? '<p class="muted">No POS sales for this range.</p>'
        : '<div class="table-scroll"><table><thead><tr><th>Rank</th><th>Employee</th><th>Sales</th><th>Qty Sold</th><th>Total Amount</th></tr></thead><tbody>' +
            ranked.map((r, i) => '<tr' + (i === 0 && topIsHighlighted ? ' style="font-weight:bold;background:#fdf6e3;"' : '') + '>' +
              '<td data-label="Rank">' + (i + 1) + (i === 0 && topIsHighlighted ? ' 🏆' : '') + '</td>' +
              '<td data-label="Employee">' + esc(r.name) + '</td>' +
              '<td data-label="Sales">' + r.sales + '</td>' +
              '<td data-label="Qty Sold">' + r.qty + '</td>' +
              '<td data-label="Total Amount">' + money(r.amount) + '</td>' +
            '</tr>').join('') +
            '</tbody><tfoot><tr style="font-weight:bold;background:#f7f7f7;"><td colspan="2">Total</td><td>' + grandSales + '</td><td>' + grandQty + '</td><td>' + money(grandAmount) + '</td></tr></tfoot>' +
          '</table></div>';
    }

    // Online Orders -- who's marking items Packing, ranked (Ren, 2026-09-25: "in the
    // packing include who created staff to check how many sales they have it", now
    // surfaced company-wide/all-time here rather than only the live Packing tab).
    async function loadPackedOrders() {
      try { packedEntries = await listPackedOrders({ fromDate: packedFrom || null, toDate: packedTo || null }); } catch (err) { packedEntries = []; }
      renderPackedLeaderboard();
    }

    function renderPackedLeaderboard() {
      const box = document.getElementById('ac-packed-leaderboard');
      if (!box) return;
      const byEmp = {};
      packedEntries.forEach((r) => {
        const name = (r.packer && r.packer.full_name) || 'Unknown';
        const e = byEmp[name] || (byEmp[name] = { orderRefs: new Set(), qty: 0 });
        e.orderRefs.add(r.order_reference);
        e.qty += Number(r.qty || 0);
      });
      const unranked = Object.entries(byEmp).map(([name, v]) => ({ name, orders: v.orderRefs.size, qty: v.qty }));
      const ranked = applySort(unranked, packedLbSort, PACKED_LB_SORT_COMPARATORS);
      const grandOrders = new Set(packedEntries.map((r) => r.order_reference)).size;
      const grandQty = packedEntries.reduce((s, r) => s + Number(r.qty || 0), 0);
      const topIsHighlighted = packedLbSort.dir === 'desc' && packedLbSort.field !== 'name';

      box.innerHTML = !ranked.length
        ? '<p class="muted">No packed items for this range.</p>'
        : '<div class="table-scroll"><table><thead><tr><th>Rank</th><th>Employee</th><th>Orders Packed</th><th>Qty Packed</th></tr></thead><tbody>' +
            ranked.map((r, i) => '<tr' + (i === 0 && topIsHighlighted ? ' style="font-weight:bold;background:#fdf6e3;"' : '') + '>' +
              '<td data-label="Rank">' + (i + 1) + (i === 0 && topIsHighlighted ? ' 🏆' : '') + '</td>' +
              '<td data-label="Employee">' + esc(r.name) + '</td>' +
              '<td data-label="Orders Packed">' + r.orders + '</td>' +
              '<td data-label="Qty Packed">' + r.qty + '</td>' +
            '</tr>').join('') +
            '</tbody><tfoot><tr style="font-weight:bold;background:#f7f7f7;"><td colspan="2">Total</td><td>' + grandOrders + '</td><td>' + grandQty + '</td></tr></tfoot>' +
          '</table></div>';
    }

    // Customer Care Staff -- who's assigned in Pancake (raw_payload.assigning_care),
    // not our own packed_by. Names come straight from Pancake's own account names
    // (e.g. "Angelyn Kittymae"), which are otherwise shown as-is rather than
    // fuzzy-merged automatically -- Pancake's own naming is inconsistent (casing,
    // trailing spaces, nicknames), and guessing two spellings are the same person risks
    // misattributing real sales credit. Specific aliases only go in this map once Ren
    // confirms them (2026-09-25: "NISSY is Nissa, merge those two rows" -- "NISSY" and
    // "NISSY " both normalize to the same trimmed key below).
    const CARE_NAME_ALIASES = {
      'NISSY': 'Nissa Kittymae',
    };
    async function loadCareAssignments() {
      try { careEntries = await listOnlineOrderCareAssignments({ fromDate: careFrom || null, toDate: careTo || null }); } catch (err) { careEntries = []; }
      renderCareLeaderboard();
    }

    function renderCareLeaderboard() {
      const box = document.getElementById('ac-care-leaderboard');
      if (!box) return;
      const byName = {};
      careEntries.forEach((r) => {
        const rawName = r.care.name.trim();
        const name = CARE_NAME_ALIASES[rawName] || rawName;
        const e = byName[name] || (byName[name] = { orderRefs: new Set(), qty: 0 });
        e.orderRefs.add(r.order_reference);
        e.qty += Number(r.qty || 0);
      });
      const unranked = Object.entries(byName).map(([name, v]) => ({ name, orders: v.orderRefs.size, qty: v.qty }));
      const ranked = applySort(unranked, careLbSort, CARE_LB_SORT_COMPARATORS);
      const grandOrders = new Set(careEntries.map((r) => r.order_reference)).size;
      const grandQty = careEntries.reduce((s, r) => s + Number(r.qty || 0), 0);
      const topIsHighlighted = careLbSort.dir === 'desc' && careLbSort.field !== 'name';

      box.innerHTML = !ranked.length
        ? '<p class="muted">No Pancake care assignments for this range.</p>'
        : '<div class="table-scroll"><table><thead><tr><th>Rank</th><th>Staff (Pancake account)</th><th>Orders</th><th>Qty</th></tr></thead><tbody>' +
            ranked.map((r, i) => '<tr' + (i === 0 && topIsHighlighted ? ' style="font-weight:bold;background:#fdf6e3;"' : '') + '>' +
              '<td data-label="Rank">' + (i + 1) + (i === 0 && topIsHighlighted ? ' 🏆' : '') + '</td>' +
              '<td data-label="Staff (Pancake account)">' + esc(r.name) + '</td>' +
              '<td data-label="Orders">' + r.orders + '</td>' +
              '<td data-label="Qty">' + r.qty + '</td>' +
            '</tr>').join('') +
            '</tbody><tfoot><tr style="font-weight:bold;background:#f7f7f7;"><td colspan="2">Total</td><td>' + grandOrders + '</td><td>' + grandQty + '</td></tr></tfoot>' +
          '</table></div>';
    }

    async function load() {
      try {
        const [emps, rows] = await Promise.all([getEmployeesForChecklist(), getAccessChecklist()]);
        // Keeps the raw record (raw) alongside the derived fields so a position change
        // can recompute this one person's items locally (itemsForEmployee needs branch,
        // bills_access, refund_approval_access, extra_page_access -- not just position).
        people = emps.map((e) => ({ id: e.id, name: e.full_name, role: e.role, position: e.position, raw: e, items: itemsForEmployee(e) }));
        overrides = {};
        rows.forEach((r) => { overrides[r.employee_id + ':' + r.item_key] = { checked: r.checked, levels: r.levels || [] }; });
        if (selectedId && !people.some((p) => p.id === selectedId)) selectedId = null;
      } catch (err) {
        toast('ac-msg', String(err.message || err), true);
      }
      render();
    }

    await Promise.all([load(), loadScrapEntries(), loadInventoryValue(), loadPosEntries(), loadPackedOrders(), loadCareAssignments()]);
    subscribeToChanges('access_checklist_verifications', load);
    subscribeToChanges('scrap_entries', loadScrapEntries);
    subscribeToChanges(['products', 'inventory'], loadInventoryValue);
    subscribeToChanges('sales_inventory_movements', loadPosEntries);
    // order_item_status gets constant high-frequency Pancake sync traffic -- debounced
    // (one shared timer covers both leaderboards that read this table), same as
    // online-orders.html's own subscription to it, so a resync batch doesn't fire
    // these reloads dozens of times in a row.
    let orderStatusReloadTimer = null;
    subscribeToChanges('order_item_status', () => {
      clearTimeout(orderStatusReloadTimer);
      orderStatusReloadTimer = setTimeout(() => { loadPackedOrders(); loadCareAssignments(); }, 800);
    });

    // Effective levels for a row: an array, any combination of view/encode/edit/
    // approver, empty means No access -- the override if Ren has set one, otherwise
    // the computed default. Ren can pick more than one (e.g. Edit AND Approver) --
    // entirely his call, not something the system infers.
    function effectiveLevels(personId, item) {
      const key = personId + ':' + item.id;
      const ov = overrides[key];
      if (ov) return ov.checked ? ov.levels : [];
      return item.access ? item.levels : [];
    }
    function accessCount(p) { return p.items.filter((it) => effectiveLevels(p.id, it).length > 0).length; }

    function render() {
      const empListHtml = !people.length ? '<p class="muted">No non-Admin employees yet.</p>' : people.map((p) =>
        '<button type="button" class="ac-emp-row' + (p.id === selectedId ? ' active' : '') + '" data-select-emp="' + p.id + '">' +
          '<div class="name">' + esc(p.name) + '</div>' +
          '<div class="sub">' + esc(p.role) + (p.position ? ' · ' + esc(p.position) : '') + '</div>' +
          '<div class="progress">' + accessCount(p) + ' / ' + p.items.length + ' tasks accessible</div>' +
        '</button>'
      ).join('');

      const selected = people.find((p) => p.id === selectedId);

      let mainHtml;
      if (!selected) {
        mainHtml = '<div class="card"><p class="muted">Select an employee on the left to see their access checklist.</p></div>';
      } else {
        const byCategory = {};
        CATEGORY_ORDER.forEach((c) => { byCategory[c] = []; });
        selected.items.forEach((it) => { byCategory[it.category].push(it); });

        const taskCardsHtml = CATEGORY_ORDER.map((catKey) => {
          const items = byCategory[catKey];
          if (!items.length) return '';
          return '<div class="card ac-task-card">' +
            '<h4>' + esc(CATEGORY_LABEL[catKey]) + '</h4>' +
            items.map((it) => {
              const key = selected.id + ':' + it.id;
              const current = effectiveLevels(selected.id, it);
              // "No access" resets the whole row (exclusive); the other four toggle
              // independently -- Ren can combine any of them, e.g. Edit + Approver.
              const pill = (lvl, label) => {
                const active = lvl === 'none' ? current.length === 0 : current.includes(lvl);
                return '<button type="button" class="lvl-pill ' + lvl + (active ? ' active' : '') + '"' +
                  (canEdit
                    ? ' data-key="' + key + '" data-level="' + lvl + '">'
                    : ' disabled style="cursor:default;' + (active ? '' : 'opacity:0.35;') + '">') +
                  label + '</button>';
              };
              return '<div class="ac-item">' +
                '<span class="lbl-text">' + esc(it.label) + '</span>' +
                '<div class="lvl-picker">' +
                  pill('none', 'No access') + pill('view', 'View only') + pill('encode', 'Encode') + pill('edit', 'Edit') + pill('approver', 'Approver') +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('');

        mainHtml =
          '<div class="card">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
              '<h3 style="margin:0;">' + esc(selected.name) + ' <span class="muted" style="font-weight:normal;font-size:13px;">— ' + esc(selected.role) + '</span></h3>' +
              (canEdit
                ? '<span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
                    '<span style="display:flex;align-items:center;gap:6px;">' +
                      '<label class="muted" style="font-size:12px;">Position</label>' +
                      '<select data-position-for="' + selected.id + '" style="padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">' + positionOptions(selected.position) + '</select>' +
                    '</span>' +
                    '<button type="button" class="btn small" id="ac-save-all" title="Confirm every task below as verified, using whatever levels are currently shown (defaults or your own overrides)">Save All</button>' +
                    '<button type="button" class="btn small secondary" id="ac-set-password" title="Set or change this employee\'s ID+password login">Set Password</button>' +
                  '</span>'
                : '<span class="muted" style="font-size:12px;">' + esc(selected.position || '— None —') + '</span>') +
            '</div>' +
            (canEdit ? '<p class="muted" style="margin-bottom:0;">Changing Position here takes effect immediately — several tasks below (and pages like Branches, Transactions, Branch Capital) key off it directly. "Save All" locks in whatever\'s currently shown for every task below as verified, in one click, instead of clicking each pill.</p>' : '') +
            (canEdit && showPasswordFormFor === selected.id
              ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0;">' +
                  '<p class="muted" style="margin-top:0;">Signs in with ID <b>' + esc(selected.raw.employee_code || '— not set —') + '</b> and this password' +
                  (selected.raw.employee_code ? '' : ' — <b>set an Employee Code in HR — 201 File first</b>, then come back here') + '.</p>' +
                  '<form id="ac-password-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
                    '<div class="field"><label>New Password *</label><input type="password" name="password" minlength="6" required autocomplete="new-password"></div>' +
                    '<div class="field"><label>Confirm Password *</label><input type="password" name="confirm" minlength="6" required autocomplete="new-password"></div>' +
                    '<button class="btn small" type="submit"' + (selected.raw.employee_code ? '' : ' disabled') + '>Save Password</button>' +
                    '<button class="btn small secondary" type="button" id="ac-password-cancel">Cancel</button>' +
                  '</form>' +
                '</div>'
              : '') +
          '</div>' +
          taskCardsHtml;
      }

      root.innerHTML =
        '<h2>Access Verification Checklist</h2>' +
        '<p class="muted">' + (canEdit
          ? 'Pick an employee on the left. Each task starts from what their role/position actually grants — click No access, View only, Encode (can add an entry but not edit/delete), Edit, or Approver to correct it if what you see on their real account is different. More than one can be active on the same task (e.g. Edit + Approver) — that\'s entirely your call.'
          : 'Pick an employee on the left to see their current access levels. This view is read-only.') + '</p>' +
        '<div class="card">' +
          '<h3 style="margin:0 0 2px;">Inventory Value by Branch</h3>' +
          '<p class="muted" style="margin-top:-2px;">Total pieces and total retail value (system selling price × pcs on hand) per branch, Active SKUs only — same numbers as SKU Catalog\'s own tiles.</p>' +
          '<div id="ac-inventory-value-tiles"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="card">' +
          '<h3 style="margin:0 0 2px;">Scrap Encoding Activity</h3>' +
          '<p class="muted" style="margin-top:-2px;">Who\'s actually encoding Scrap entries, ranked by how many — the top row is your busiest encoder for this range.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">' +
            '<div class="field"><label>From</label><input type="date" id="scrap-lb-from" value="' + scrapFrom + '"></div>' +
            '<div class="field"><label>To</label><input type="date" id="scrap-lb-to" value="' + scrapTo + '"></div>' +
            sortControlHtml(SCRAP_LB_SORT_FIELDS, scrapLbSort, 'scrap-lb-sort-field', 'scrap-lb-sort-dir') +
            '<button type="button" class="btn small secondary" id="scrap-lb-clear">All Time</button>' +
          '</div>' +
          '<div id="ac-scrap-leaderboard"><div class="muted">Loading…</div></div>' +
          '<h4 style="margin:16px 0 2px;">Total Grams Received <span class="muted" style="font-weight:normal;">— by purity, same range as above</span></h4>' +
          '<div id="ac-scrap-grams"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="card">' +
          '<h3 style="margin:0 0 2px;">POS Top Selling</h3>' +
          '<p class="muted" style="margin-top:-2px;">Who\'s actually processing sales at the counter, company-wide, ranked by sales/quantity/amount for this range.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">' +
            '<div class="field"><label>From</label><input type="date" id="pos-lb-from" value="' + posFrom + '"></div>' +
            '<div class="field"><label>To</label><input type="date" id="pos-lb-to" value="' + posTo + '"></div>' +
            sortControlHtml(POS_LB_SORT_FIELDS, posLbSort, 'pos-lb-sort-field', 'pos-lb-sort-dir') +
            '<button type="button" class="btn small secondary" id="pos-lb-clear">All Time</button>' +
          '</div>' +
          '<div id="ac-pos-leaderboard"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="card">' +
          '<h3 style="margin:0 0 2px;">Online Orders — Packed By</h3>' +
          '<p class="muted" style="margin-top:-2px;">Who\'s marking Pancake orders as Packing, ranked by how many — credit stays with whoever packed it even after it\'s later Delivered.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">' +
            '<div class="field"><label>From</label><input type="date" id="packed-lb-from" value="' + packedFrom + '"></div>' +
            '<div class="field"><label>To</label><input type="date" id="packed-lb-to" value="' + packedTo + '"></div>' +
            sortControlHtml(PACKED_LB_SORT_FIELDS, packedLbSort, 'packed-lb-sort-field', 'packed-lb-sort-dir') +
            '<button type="button" class="btn small secondary" id="packed-lb-clear">All Time</button>' +
          '</div>' +
          '<div id="ac-packed-leaderboard"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="card">' +
          '<h3 style="margin:0 0 2px;">Customer Care Staff</h3>' +
          '<p class="muted" style="margin-top:-2px;">Who\'s assigned to the order in Pancake itself (assigning_care) — who actually handled/converted the sale, ranked by how many. Names are Pancake\'s own account names, shown as-is.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">' +
            '<div class="field"><label>From</label><input type="date" id="care-lb-from" value="' + careFrom + '"></div>' +
            '<div class="field"><label>To</label><input type="date" id="care-lb-to" value="' + careTo + '"></div>' +
            sortControlHtml(CARE_LB_SORT_FIELDS, careLbSort, 'care-lb-sort-field', 'care-lb-sort-dir') +
            '<button type="button" class="btn small secondary" id="care-lb-clear">Recent</button>' +
          '</div>' +
          '<div id="ac-care-leaderboard"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="ac-layout">' +
          '<div class="card ac-emp-list">' + empListHtml + '</div>' +
          '<div class="ac-emp-main">' + mainHtml + '</div>' +
        '</div>';

      renderInventoryValue();
      renderScrapLeaderboard();
      document.getElementById('scrap-lb-from').addEventListener('change', (ev) => { scrapFrom = ev.target.value; renderScrapLeaderboard(); });
      document.getElementById('scrap-lb-to').addEventListener('change', (ev) => { scrapTo = ev.target.value; renderScrapLeaderboard(); });
      wireSortControl('scrap-lb-sort-field', 'scrap-lb-sort-dir', scrapLbSort, renderScrapLeaderboard);
      document.getElementById('scrap-lb-clear').addEventListener('click', () => {
        scrapFrom = ''; scrapTo = '';
        document.getElementById('scrap-lb-from').value = '';
        document.getElementById('scrap-lb-to').value = '';
        renderScrapLeaderboard();
      });

      renderPosLeaderboard();
      document.getElementById('pos-lb-from').addEventListener('change', (ev) => { posFrom = ev.target.value; loadPosEntries(); });
      document.getElementById('pos-lb-to').addEventListener('change', (ev) => { posTo = ev.target.value; loadPosEntries(); });
      wireSortControl('pos-lb-sort-field', 'pos-lb-sort-dir', posLbSort, renderPosLeaderboard);
      document.getElementById('pos-lb-clear').addEventListener('click', () => {
        posFrom = ''; posTo = '';
        document.getElementById('pos-lb-from').value = '';
        document.getElementById('pos-lb-to').value = '';
        loadPosEntries();
      });

      renderPackedLeaderboard();
      document.getElementById('packed-lb-from').addEventListener('change', (ev) => { packedFrom = ev.target.value; loadPackedOrders(); });
      document.getElementById('packed-lb-to').addEventListener('change', (ev) => { packedTo = ev.target.value; loadPackedOrders(); });
      wireSortControl('packed-lb-sort-field', 'packed-lb-sort-dir', packedLbSort, renderPackedLeaderboard);
      document.getElementById('packed-lb-clear').addEventListener('click', () => {
        packedFrom = ''; packedTo = '';
        document.getElementById('packed-lb-from').value = '';
        document.getElementById('packed-lb-to').value = '';
        loadPackedOrders();
      });

      renderCareLeaderboard();
      document.getElementById('care-lb-from').addEventListener('change', (ev) => { careFrom = ev.target.value; loadCareAssignments(); });
      document.getElementById('care-lb-to').addEventListener('change', (ev) => { careTo = ev.target.value; loadCareAssignments(); });
      wireSortControl('care-lb-sort-field', 'care-lb-sort-dir', careLbSort, renderCareLeaderboard);
      document.getElementById('care-lb-clear').addEventListener('click', () => {
        careFrom = ''; careTo = '';
        document.getElementById('care-lb-from').value = '';
        document.getElementById('care-lb-to').value = '';
        loadCareAssignments();
      });

      root.querySelectorAll('[data-select-emp]').forEach((btn) => btn.addEventListener('click', () => {
        selectedId = btn.dataset.selectEmp;
        showPasswordFormFor = null;
        render();
      }));

      if (!canEdit) return; // Personal Assistant: no position select or pill listeners to wire up below

      // "Save All" (Ren, 2026-09-17: "add a clickable save ... to approve automatic
      // the task they are in") -- locks in whatever's CURRENTLY shown for every task
      // (the computed default, or an existing override) as an explicit confirmed
      // override in one click, instead of needing to click each pill individually just
      // to record "yes, this one's correct."
      const saveAllBtn = document.getElementById('ac-save-all');
      if (saveAllBtn) saveAllBtn.addEventListener('click', async () => {
        const person = people.find((p) => p.id === selectedId);
        if (!person) return;
        saveAllBtn.disabled = true;
        try {
          await Promise.all(person.items.map((item) => {
            const levels = effectiveLevels(person.id, item);
            overrides[person.id + ':' + item.id] = { checked: levels.length > 0, levels };
            return setAccessChecklistItem(person.id, item.id, levels.length > 0, levels);
          }));
          toast('ac-msg', 'All ' + person.items.length + ' tasks confirmed for ' + person.name + '.', false);
          render();
        } catch (err) {
          toast('ac-msg', String(err.message || err), true);
          await load();
        } finally {
          saveAllBtn.disabled = false;
        }
      });

      const setPasswordBtn = document.getElementById('ac-set-password');
      if (setPasswordBtn) setPasswordBtn.addEventListener('click', () => {
        showPasswordFormFor = selectedId;
        render();
      });
      const passwordCancelBtn = document.getElementById('ac-password-cancel');
      if (passwordCancelBtn) passwordCancelBtn.addEventListener('click', () => {
        showPasswordFormFor = null;
        render();
      });
      const passwordForm = document.getElementById('ac-password-form');
      if (passwordForm) passwordForm.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const person = people.find((p) => p.id === selectedId);
        if (!person) return;
        if (f.password.value !== f.confirm.value) { toast('ac-msg', 'Passwords do not match.', true); return; }
        if (f.password.value.length < 6) { toast('ac-msg', 'Password must be at least 6 characters.', true); return; }
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          const result = await setEmployeePassword(person.id, f.password.value);
          toast('ac-msg', (result.mode === 'created' ? 'Password set' : 'Password updated') + ' for ' + person.name + ' — signs in with ID ' + result.email.split('@')[0] + '.', false);
          showPasswordFormFor = null;
          render();
        } catch (err) {
          toast('ac-msg', String(err.message || err), true);
          btn.disabled = false;
        }
      });

      root.querySelectorAll('[data-position-for]').forEach((sel) => sel.addEventListener('change', async (ev) => {
        const employeeId = ev.target.dataset.positionFor;
        const newPosition = ev.target.value;
        const person = people.find((p) => p.id === employeeId);
        const prevPosition = person ? person.position : null;
        // Optimistic update: recompute this person's task list from the new position
        // immediately and re-render, instead of waiting on the save + a full reload
        // round-trip -- their checklist should change the instant you pick a position,
        // not a beat later.
        if (person) {
          person.position = newPosition;
          person.raw.position = newPosition;
          person.items = itemsForEmployee(person.raw);
        }
        render();
        try {
          await updateEmployeePosition(employeeId, newPosition);
          toast('ac-msg', 'Position updated.', false);
          await load(); // reconciles with the server (also picks up anyone else's concurrent edits)
        } catch (err) {
          if (person) {
            person.position = prevPosition;
            person.raw.position = prevPosition;
            person.items = itemsForEmployee(person.raw);
          }
          render();
          toast('ac-msg', String(err.message || err), true);
        }
      }));

      root.querySelectorAll('.lvl-pill').forEach((btn) => btn.addEventListener('click', async () => {
        const key = btn.dataset.key;
        const clicked = btn.dataset.level; // 'none' | 'view' | 'encode' | 'edit' | 'approver'
        const sep = key.indexOf(':');
        const employeeId = key.slice(0, sep), itemKey = key.slice(sep + 1);
        const person = people.find((p) => p.id === employeeId);
        const item = person && person.items.find((it) => it.id === itemKey);
        if (!item) return;
        const current = effectiveLevels(employeeId, item);
        // "No access" resets the row; any other pill toggles independently -- Ren can
        // have more than one active at once (e.g. Edit + Approver), entirely his call.
        const newLevels = clicked === 'none' ? [] : (current.includes(clicked) ? current.filter((l) => l !== clicked) : [...current, clicked]);
        const newChecked = newLevels.length > 0;
        const prevOverride = overrides.hasOwnProperty(key) ? overrides[key] : undefined;
        overrides[key] = { checked: newChecked, levels: newLevels };
        render();
        try {
          await setAccessChecklistItem(employeeId, itemKey, newChecked, newLevels);
        } catch (err) {
          if (prevOverride === undefined) delete overrides[key]; else overrides[key] = prevOverride;
          render();
          toast('ac-msg', String(err.message || err), true);
        }
      }));
    }
  }
}
</script>
</body>
</html>
