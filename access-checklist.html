<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Checklist — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .ac-item { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #f0f0f0; }
  .ac-item:last-child { border-bottom:none; }
  .ac-item input[type="checkbox"] { margin-top:3px; width:16px; height:16px; flex-shrink:0; }
  .ac-item .lbl { flex:1; }
  .ac-item.checked .lbl-text { color:var(--muted); }
  .ac-progress { font-size:12px; color:var(--muted); }
  .ac-task-card h4 { margin:0 0 2px; }
  .ac-task-card .ac-task-progress { font-size:12px; color:var(--muted); margin-bottom:8px; }

  .ac-layout { display:flex; gap:16px; align-items:flex-start; }
  .ac-emp-list { flex:0 0 260px; max-height:calc(100vh - 220px); overflow-y:auto; padding:6px; }
  .ac-emp-main { flex:1 1 auto; min-width:0; }
  .ac-emp-row { display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:10px 12px; cursor:pointer; font:inherit; color:inherit; }
  .ac-emp-row:hover { background:#f7f5f0; }
  .ac-emp-row.active { background:var(--rose); }
  .ac-emp-row .name { font-weight:600; }
  .ac-emp-row .sub { font-size:12px; color:var(--muted); }
  .ac-emp-row .progress { font-size:11px; color:var(--muted); margin-top:2px; }
  @media (max-width:760px) {
    .ac-layout { flex-direction:column; }
    .ac-emp-list { flex:0 0 auto; max-height:300px; width:100%; }
  }
</style>
</head>
<body>
<main>
  <div id="ac-msg"></div>
  <div id="ac-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { getEmployeesForChecklist, getAccessChecklist, setAccessChecklistItem, updateEmployeePosition, subscribeToChanges } from './js/api.js';

// Every position value that currently drives an access rule somewhere, plus the other
// job titles already in use -- kept as a fixed list (not free text) so a typo here
// can't silently fail to match the position checks in shell.js/transactions.html/etc.
const POSITIONS = ['Sales Executive', 'Admin Assistant', 'Branch Team Leader', 'HR Supervisor', 'Inventory Supervisor', 'Operations Supervisor', 'Personal Assistant'];
const positionOptions = (selected) => '<option value="">— None —</option>' + POSITIONS.map((p) =>
  '<option' + (p === selected ? ' selected' : '') + '>' + p + '</option>'
).join('');
// Mirrors is_position_manager() in 62_position_managers_refund_scrap_subasta.sql --
// full manage (approve/edit/delete) on Refunds/Scrap/Subasta, not just add.
const POSITION_MANAGERS = ['Operations Supervisor', 'Inventory Supervisor', 'Admin Assistant'];

// Fixed set of task categories, in the order they're shown -- every item pushed
// below is tagged with one of these keys so a selected employee's checklist can be
// broken into one section per task (Inventory, Branches, Capital, ...) instead of
// one long undifferentiated list.
const CATEGORY_ORDER = ['inventory', 'movement', 'transfers', 'branches', 'capital', 'payments', 'assets', 'lbc', 'refund', 'bills', 'extra'];
const CATEGORY_LABEL = {
  inventory: 'Inventory Visibility',
  movement: 'Stock Movements',
  transfers: 'Transfers',
  branches: 'Branches (Subasta / Scrap)',
  capital: 'Branch Capital',
  payments: 'Transactions',
  assets: 'Asset & Supplies Custodian',
  lbc: 'LBC Monitoring',
  refund: 'Refund Approval',
  bills: 'Bills',
  extra: 'Other Individually Granted Access',
};
// extra_page_access values map onto the same task section the rest of that page's
// access lives under, so e.g. Jessica's individual Transactions grant shows up
// alongside everyone else's Transactions expectations, not off in its own bucket.
const EXTRA_PAGE_CATEGORY = { transactions: 'payments', assets: 'assets', lbc: 'lbc' };

/** Builds the list of things to verify from the employee's CURRENT role,
 * branch, and bills_access -- not a hardcoded name lookup -- so a role or
 * task change shows up here automatically instead of needing a code edit. */
function itemsForEmployee(emp) {
  const branch = (emp.branches && emp.branches.name) || 'their branch';
  const items = [];
  if (emp.role === 'Manager') {
    items.push({ id: 'inventory-all', category: 'inventory', label: 'Sees inventory for every branch, not just ' + branch, expect: true });
    items.push({ id: 'movement', category: 'movement', label: 'Can record stock movements at any branch', expect: true });
    items.push({ id: 'transfers', category: 'transfers', label: 'Can approve, ship, and receive transfers anywhere', expect: true });
    items.push({ id: 'branches', category: 'branches', label: 'Can see and manage Subasta and Scrap for every branch', expect: true });
    items.push({ id: 'capital', category: 'capital', label: 'Can add Branch Capital entries (auto-approved) and approve others’ pending entries anywhere', expect: true });
    items.push({ id: 'payments', category: 'payments', label: 'Can see, add, and import Transactions (GCash/Bank Transfer)', expect: true });
    items.push({ id: 'lbc', category: 'lbc', label: 'Can see and manage LBC Monitoring (COD shipments)', expect: true });
  } else if (emp.role === 'Branch Supervisor') {
    items.push({ id: 'inventory-own', category: 'inventory', label: 'Sees inventory for ' + branch, expect: true });
    items.push({ id: 'inventory-other', category: 'inventory', label: 'Cannot see inventory for other branches', expect: false });
    items.push({ id: 'movement', category: 'movement', label: 'Can record Stock In/Out, Damage, Missing at ' + branch, expect: true });
    items.push({ id: 'adjustment', category: 'movement', label: 'Cannot post Adjustment or Correction entries', expect: false });
    items.push({ id: 'transfers', category: 'transfers', label: 'Can request, ship, and receive transfers involving ' + branch, expect: true });
    items.push({ id: 'branches-own', category: 'branches', label: 'Can see and manage Subasta and Scrap for ' + branch, expect: true });
    items.push({ id: 'branches-other', category: 'branches', label: 'Cannot see Subasta/Scrap for other branches', expect: false });
    items.push({ id: 'capital', category: 'capital', label: 'Can add Branch Capital entries (pending approval elsewhere, auto-approved for ' + branch + ') and approve pending entries for ' + branch, expect: true });
    items.push({ id: 'payments', category: 'payments', label: 'Can see Transactions and fill in FB Name/Customer/Order ID — cannot add, import, or delete', expect: true });
    items.push({ id: 'assets', category: 'assets', label: 'Can add/edit/delete Asset & Supplies Custodian items', expect: true });
    items.push({ id: 'lbc', category: 'lbc', label: 'Can see and manage LBC Monitoring (COD shipments)', expect: true });
  } else if (emp.role === 'Staff') {
    items.push({ id: 'inventory-own', category: 'inventory', label: 'Sees inventory for ' + branch, expect: true });
    items.push({ id: 'inventory-other', category: 'inventory', label: 'Cannot see inventory for other branches', expect: false });
    items.push({ id: 'movement', category: 'movement', label: 'Can record Stock In/Out, Damage, Missing at ' + branch, expect: true });
    items.push({ id: 'transfers-view', category: 'transfers', label: 'Can view transfers involving ' + branch + ', but cannot request or approve them', expect: true });
    items.push({ id: 'branches', category: 'branches', label: 'Can add Subasta/Scrap entries for ' + branch + ' — cannot edit or delete any entry', expect: true });
    items.push({ id: 'capital', category: 'capital', label: 'Can add Branch Capital entries (pending approval) — sees only their own submissions, not company-wide', expect: true });
    items.push({ id: 'payments', category: 'payments', label: 'Cannot see Transactions', expect: false });
  } else if (emp.role === 'None' && emp.position === 'Sales Executive') {
    items.push({ id: 'inventory', category: 'inventory', label: 'Sees inventory for every branch (view only)', expect: true });
    items.push({ id: 'movement', category: 'movement', label: 'Cannot record any stock movement', expect: false });
    items.push({ id: 'transfers', category: 'transfers', label: 'Can request transfers, cannot approve them', expect: true });
    items.push({ id: 'branches', category: 'branches', label: 'Can view and add Subasta/Scrap entries for any branch — cannot edit or delete', expect: true });
    items.push({ id: 'capital', category: 'capital', label: 'Can view Branch Capital for every branch, and add entries (pending approval) — cannot approve or delete', expect: true });
    items.push({ id: 'payments', category: 'payments', label: 'Cannot see Transactions', expect: false });
  } else if (emp.role === 'None' && POSITION_MANAGERS.includes(emp.position)) {
    // Admin Assistant, Operations Supervisor, Inventory Supervisor -- same expanded
    // rule: full manage (add/edit/delete) on Subasta/Scrap anywhere, not just add.
    items.push({ id: 'inventory', category: 'inventory', label: 'Cannot see any branch’s inventory', expect: false });
    items.push({ id: 'movement', category: 'movement', label: 'Cannot record any stock movement', expect: false });
    items.push({ id: 'transfers', category: 'transfers', label: 'Cannot see or act on transfers', expect: false });
    items.push({ id: 'branches', category: 'branches', label: 'Can add, edit, and delete Subasta/Scrap entries for any branch', expect: true });
    items.push({ id: 'capital', category: 'capital', label: 'Can add Branch Capital entries for any branch, held as Pending Approval until a Manager/Supervisor approves', expect: true });
    items.push({
      id: 'payments', category: 'payments',
      label: emp.position === 'Admin Assistant'
        ? 'Can see Transactions and fill in FB Name/Customer/Order ID — cannot add, import, or delete'
        : 'Cannot see Transactions',
      expect: emp.position === 'Admin Assistant',
    });
  } else if (emp.role === 'None' && emp.position === 'Personal Assistant') {
    items.push({ id: 'inventory', category: 'inventory', label: 'Cannot see any branch’s inventory', expect: false });
    items.push({ id: 'movement', category: 'movement', label: 'Cannot record any stock movement', expect: false });
    items.push({ id: 'transfers', category: 'transfers', label: 'Cannot see or act on transfers', expect: false });
    items.push({ id: 'branches', category: 'branches', label: 'Can view Subasta/Scrap for every branch (view only) — cannot add, edit, or delete', expect: true });
    items.push({ id: 'capital', category: 'capital', label: 'Can view remaining balance (Total Capital tiles) for every branch, and add entries (pending approval) — sees only their own submissions in the list, not the full company-wide log', expect: true });
    items.push({ id: 'payments', category: 'payments', label: 'Cannot see Transactions', expect: false });
  } else if (emp.role === 'None') {
    items.push({ id: 'inventory', category: 'inventory', label: 'Cannot see any branch’s inventory', expect: false });
    items.push({ id: 'movement', category: 'movement', label: 'Cannot record any stock movement', expect: false });
    items.push({ id: 'transfers', category: 'transfers', label: 'Cannot see or act on transfers', expect: false });
    items.push({
      id: 'branches', category: 'branches',
      label: emp.branches ? 'Can add Subasta/Scrap entries for ' + branch + ' — cannot edit or delete' : 'Cannot add Subasta/Scrap entries (no branch assigned)',
      expect: !!emp.branches,
    });
    items.push({ id: 'capital', category: 'capital', label: 'Can add Branch Capital entries (pending approval) — sees only their own submissions, not company-wide', expect: true });
    items.push({ id: 'payments', category: 'payments', label: 'Cannot see Transactions', expect: false });
  }
  const autoRefundApprover = ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role) || POSITION_MANAGERS.includes(emp.position);
  items.push({
    id: 'refund-approval', category: 'refund',
    label: (autoRefundApprover || emp.refund_approval_access)
      ? 'Can approve and process refund requests (not just submit them)'
      : 'Can only submit refund requests, cannot approve or process them',
    expect: true, // Admin/Manager/Branch Supervisor/the position-manager group qualify automatically; anyone else matches today's refund_approval_access flag
  });
  items.push({
    id: 'bills', category: 'bills',
    label: emp.bills_access ? 'Can see and add Bills' : 'Cannot see the Bills tracker',
    expect: true, // either outcome is correct as long as it matches today's bills_access flag
  });
  // extra_page_access is the catch-all for "grant this one person this one page"
  // requests (e.g. Jessica on Transactions/Assets) that don't fit any role/position
  // rule above -- surfaced here so it's just as verifiable as everything else.
  (emp.extra_page_access || []).forEach((page) => {
    items.push({ id: 'extra-' + page, category: EXTRA_PAGE_CATEGORY[page] || 'extra', label: 'Individually granted extra access to: ' + page, expect: true });
  });
  return items;
}

const employee = await initShell('access-checklist');
if (employee) {
  const root = document.getElementById('ac-root');

  if (employee.role !== 'Admin') {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">This checklist is Admin-only.</p></div></div>';
  } else {
    let people = [];
    let checked = {};
    let selectedId = null;

    async function load() {
      try {
        const [emps, rows] = await Promise.all([getEmployeesForChecklist(), getAccessChecklist()]);
        // Keeps the raw record (raw) alongside the derived fields so a position change
        // can recompute this one person's items locally (itemsForEmployee needs branch,
        // bills_access, refund_approval_access, extra_page_access -- not just position).
        people = emps.map((e) => ({ id: e.id, name: e.full_name, role: e.role, position: e.position, raw: e, items: itemsForEmployee(e) }));
        checked = {};
        rows.forEach((r) => { if (r.checked) checked[r.employee_id + ':' + r.item_key] = true; });
        if (selectedId && !people.some((p) => p.id === selectedId)) selectedId = null;
      } catch (err) {
        toast('ac-msg', String(err.message || err), true);
      }
      render();
    }

    await load();
    subscribeToChanges('access_checklist_verifications', load);

    function personProgress(p) {
      const doneCt = p.items.filter((it) => checked[p.id + ':' + it.id]).length;
      return doneCt + ' / ' + p.items.length;
    }

    function render() {
      let total = 0, done = 0;
      people.forEach((p) => p.items.forEach((it) => { total++; if (checked[p.id + ':' + it.id]) done++; }));

      const empListHtml = !people.length ? '<p class="muted">No non-Admin employees yet.</p>' : people.map((p) =>
        '<button type="button" class="ac-emp-row' + (p.id === selectedId ? ' active' : '') + '" data-select-emp="' + p.id + '">' +
          '<div class="name">' + esc(p.name) + '</div>' +
          '<div class="sub">' + esc(p.role) + (p.position ? ' · ' + esc(p.position) : '') + '</div>' +
          '<div class="progress">' + personProgress(p) + ' verified</div>' +
        '</button>'
      ).join('');

      const selected = people.find((p) => p.id === selectedId);

      let mainHtml;
      if (!selected) {
        mainHtml = '<div class="card"><p class="muted">Select an employee on the left to see their access checklist.</p></div>';
      } else {
        const byCategory = {};
        CATEGORY_ORDER.forEach((c) => { byCategory[c] = []; });
        selected.items.forEach((it) => { (byCategory[it.category] || byCategory.extra).push(it); });

        const taskCardsHtml = CATEGORY_ORDER.map((catKey) => {
          const items = byCategory[catKey];
          if (!items.length) return '';
          const catDone = items.filter((it) => checked[selected.id + ':' + it.id]).length;
          return '<div class="card ac-task-card">' +
            '<h4>' + esc(CATEGORY_LABEL[catKey]) + '</h4>' +
            '<div class="ac-task-progress">' + catDone + ' / ' + items.length + ' verified</div>' +
            items.map((it) => {
              const key = selected.id + ':' + it.id;
              const isChecked = !!checked[key];
              return '<label class="ac-item' + (isChecked ? ' checked' : '') + '">' +
                '<input type="checkbox" data-key="' + key + '"' + (isChecked ? ' checked' : '') + '>' +
                '<span class="lbl"><span class="lbl-text">' + esc(it.label) + '</span> ' +
                  '<span class="badge ' + (it.expect ? 'ok' : 'low') + '">' + (it.expect ? 'Should have access' : 'Should NOT have access') + '</span>' +
                '</span>' +
              '</label>';
            }).join('') +
          '</div>';
        }).join('');

        mainHtml =
          '<div class="card">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
              '<h3 style="margin:0;">' + esc(selected.name) + ' <span class="muted" style="font-weight:normal;font-size:13px;">— ' + esc(selected.role) + '</span></h3>' +
              '<span style="display:flex;align-items:center;gap:6px;">' +
                '<label class="muted" style="font-size:12px;">Position</label>' +
                '<select data-position-for="' + selected.id + '" style="padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">' + positionOptions(selected.position) + '</select>' +
              '</span>' +
            '</div>' +
            '<p class="muted" style="margin-bottom:0;">Changing Position here takes effect immediately — several tasks below (and pages like Branches, Transactions, Branch Capital) key off it directly.</p>' +
          '</div>' +
          taskCardsHtml;
      }

      root.innerHTML =
        '<h2>Access Verification Checklist</h2>' +
        '<p class="muted">Pick an employee on the left, then tick each task off only after you’ve personally confirmed it with their real account. Each person’s list is built from their current role, position, and branch, so it updates on its own whenever any of those change — Ren isn’t listed since Admin already has full access by definition.</p>' +
        '<div class="tiles"><div class="tile"><div class="num">' + done + ' / ' + total + '</div><div class="lbl">Verified</div></div></div>' +
        '<div class="ac-layout">' +
          '<div class="card ac-emp-list">' + empListHtml + '</div>' +
          '<div class="ac-emp-main">' + mainHtml + '</div>' +
        '</div>';

      root.querySelectorAll('[data-select-emp]').forEach((btn) => btn.addEventListener('click', () => {
        selectedId = btn.dataset.selectEmp;
        render();
      }));

      root.querySelectorAll('[data-position-for]').forEach((sel) => sel.addEventListener('change', async (ev) => {
        const employeeId = ev.target.dataset.positionFor;
        const newPosition = ev.target.value;
        const person = people.find((p) => p.id === employeeId);
        const prevPosition = person ? person.position : null;
        // Optimistic update: recompute this person's task list from the new position
        // immediately and re-render, instead of waiting on the save + a full reload
        // round-trip -- their checklist should change the instant you pick a position,
        // not a beat later.
        if (person) {
          person.position = newPosition;
          person.raw.position = newPosition;
          person.items = itemsForEmployee(person.raw);
        }
        render();
        try {
          await updateEmployeePosition(employeeId, newPosition);
          toast('ac-msg', 'Position updated.', false);
          await load(); // reconciles with the server (also picks up anyone else's concurrent edits)
        } catch (err) {
          if (person) {
            person.position = prevPosition;
            person.raw.position = prevPosition;
            person.items = itemsForEmployee(person.raw);
          }
          render();
          toast('ac-msg', String(err.message || err), true);
        }
      }));

      root.querySelectorAll('input[type="checkbox"]').forEach((cb) => cb.addEventListener('change', async (ev) => {
        const key = ev.target.dataset.key;
        const isChecked = ev.target.checked;
        if (isChecked) checked[key] = true; else delete checked[key];
        try {
          const sep = key.indexOf(':');
          const employeeId = key.slice(0, sep), itemKey = key.slice(sep + 1);
          await setAccessChecklistItem(employeeId, itemKey, isChecked);
          render();
        } catch (err) {
          ev.target.checked = !isChecked;
          if (isChecked) delete checked[key]; else checked[key] = true;
          toast('ac-msg', String(err.message || err), true);
        }
      }));
    }
  }
}
</script>
</body>
</html>
