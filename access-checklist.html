<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Checklist — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .ac-item { padding:10px 0; border-bottom:1px solid #f0f0f0; }
  .ac-item:last-child { border-bottom:none; }
  .ac-item .lbl-text { display:block; margin-bottom:6px; }
  .ac-task-card h4 { margin:0 0 2px; }
  .lvl-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .lvl-pill { border:1px solid #e2e2e2; background:#fff; color:var(--muted); padding:4px 12px; border-radius:14px; font-size:12px; cursor:pointer; font:inherit; }
  .lvl-pill:hover { border-color:#ccc; }
  .lvl-pill.active.none { background:#fdecea; color:var(--warn); border-color:#fdecea; }
  .lvl-pill.active.view { background:#eef2f7; color:#46586b; border-color:#eef2f7; }
  .lvl-pill.active.encode { background:#eaf6ec; color:var(--ok); border-color:#eaf6ec; }
  .lvl-pill.active.edit { background:#fff4e0; color:#a15c00; border-color:#fff4e0; }
  .lvl-pill.active.approver { background:#f0e9fb; color:#6a3fa0; border-color:#f0e9fb; }

  .ac-layout { display:flex; gap:16px; align-items:flex-start; }
  .ac-emp-list { flex:0 0 260px; max-height:calc(100vh - 220px); overflow-y:auto; padding:6px; }
  .ac-emp-main { flex:1 1 auto; min-width:0; }
  .ac-emp-row { display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:10px 12px; cursor:pointer; font:inherit; color:inherit; }
  .ac-emp-row:hover { background:#f7f5f0; }
  .ac-emp-row.active { background:var(--rose); }
  .ac-emp-row .name { font-weight:600; }
  .ac-emp-row .sub { font-size:12px; color:var(--muted); }
  .ac-emp-row .progress { font-size:11px; color:var(--muted); margin-top:2px; }
  @media (max-width:760px) {
    .ac-layout { flex-direction:column; }
    .ac-emp-list { flex:0 0 auto; max-height:300px; width:100%; }
  }
</style>
</head>
<body>
<main>
  <div id="ac-msg"></div>
  <div id="ac-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { getEmployeesForChecklist, getAccessChecklist, setAccessChecklistItem, updateEmployeePosition, subscribeToChanges } from './js/api.js';

// Every position value that currently drives an access rule somewhere, plus the other
// job titles already in use -- kept as a fixed list (not free text) so a typo here
// can't silently fail to match the position checks in shell.js/transactions.html/etc.
const POSITIONS = ['Sales Executive', 'Admin Assistant', 'Branch Team Leader', 'HR Supervisor', 'Inventory Supervisor', 'Operations Supervisor', 'Personal Assistant'];
const positionOptions = (selected) => '<option value="">— None —</option>' + POSITIONS.map((p) =>
  '<option' + (p === selected ? ' selected' : '') + '>' + p + '</option>'
).join('');
// Mirrors is_position_manager() in 62_position_managers_refund_scrap_subasta.sql --
// full manage (approve/edit/delete) on Refunds/Scrap/Subasta, not just add.
const POSITION_MANAGERS = ['Operations Supervisor', 'Inventory Supervisor', 'Admin Assistant'];

// Fixed set of task categories, in the order they're shown -- one row per category
// per employee (not several sub-statements), each carrying a single access level.
const CATEGORY_ORDER = ['inventory', 'movement', 'transfers', 'branches', 'capital', 'payments', 'assets', 'lbc', 'refund', 'bills'];
const CATEGORY_LABEL = {
  inventory: 'Inventory Visibility',
  movement: 'Stock Movements',
  transfers: 'Transfers',
  branches: 'Branches (Subasta / Scrap)',
  capital: 'Branch Capital',
  payments: 'Transactions',
  assets: 'Asset & Supplies Custodian',
  lbc: 'LBC Monitoring',
  refund: 'Refund Approval',
  bills: 'Bills',
};
// extra_page_access grants (e.g. Jessica on Transactions/Assets) upgrade whichever
// category that page belongs to, rather than showing as a separate row.
const EXTRA_PAGE_CATEGORY = { transactions: 'payments', assets: 'assets', lbc: 'lbc' };
const NO_ACCESS_LABEL = {
  inventory: 'Cannot see any branch’s inventory', movement: 'Cannot record any stock movement',
  transfers: 'Cannot see or act on transfers', branches: 'Cannot add Subasta/Scrap entries',
  capital: 'Cannot add Branch Capital entries', payments: 'Cannot see Transactions',
  assets: 'Cannot access Asset & Supplies Custodian', lbc: 'Cannot access LBC Monitoring',
};

/** Builds one row per task category from the employee's CURRENT role, position,
 * branch, and flags -- not a hardcoded name lookup -- so a role or task change shows
 * up here automatically instead of needing a code edit. Each row is { access: does
 * this person currently have access at all, levels: any combination of
 * 'view'|'encode'|'edit'|'approver' when they do }. 'encode' means they can add a new
 * entry but not edit/delete an existing one (e.g. Staff on Scrap, or anyone's own
 * pending-approval Branch Capital request) -- distinct from 'edit', which is full
 * read-write over existing records. This is the DEFAULT the level picker shows for
 * that row -- Ren can click different options (including combining several, or "No
 * access") to record what's actually observed on their real account, if it differs. */
function itemsForEmployee(emp) {
  const branch = (emp.branches && emp.branches.name) || 'their branch';
  const isPosMgr = POSITION_MANAGERS.includes(emp.position);
  const cat = {};
  CATEGORY_ORDER.forEach((c) => { cat[c] = { label: '', access: false, levels: [] }; });

  if (emp.role === 'Manager') {
    cat.inventory = { label: 'Sees inventory for every branch', access: true, levels: ['view'] };
    cat.movement  = { label: 'Can record stock movements at any branch', access: true, levels: ['encode'] };
    cat.transfers = { label: 'Can approve, ship, and receive transfers anywhere', access: true, levels: ['edit', 'approver'] };
    cat.branches  = { label: 'Can add, edit, and delete Subasta/Scrap for every branch', access: true, levels: ['edit'] };
    cat.capital   = { label: 'Can add (auto-approved) and approve Branch Capital entries anywhere', access: true, levels: ['encode', 'approver'] };
    cat.payments  = { label: 'Can see, add, and import Transactions', access: true, levels: ['edit'] };
    cat.assets    = { label: 'Can add/edit/delete Asset & Supplies Custodian items', access: true, levels: ['edit'] };
    cat.lbc       = { label: 'Can see and manage LBC Monitoring', access: true, levels: ['edit'] };
  } else if (emp.role === 'Branch Supervisor') {
    cat.inventory = { label: 'Sees inventory for ' + branch + ' only', access: true, levels: ['view'] };
    cat.movement  = { label: 'Can record Stock In/Out, Damage, Missing at ' + branch + ' (not Adjustment/Correction)', access: true, levels: ['encode'] };
    cat.transfers = { label: 'Can request, ship, and receive transfers involving ' + branch, access: true, levels: ['edit'] };
    cat.branches  = { label: 'Can add, edit, and delete Subasta/Scrap for ' + branch, access: true, levels: ['edit'] };
    cat.capital   = { label: 'Can add and approve Branch Capital entries for ' + branch, access: true, levels: ['encode', 'approver'] };
    cat.payments  = { label: 'Can see Transactions and fill in FB Name/Customer/Order ID (not add/import/delete)', access: true, levels: ['edit'] };
    cat.assets    = { label: 'Can add/edit/delete Asset & Supplies Custodian items', access: true, levels: ['edit'] };
    cat.lbc       = { label: 'Can see and manage LBC Monitoring', access: true, levels: ['edit'] };
  } else if (emp.role === 'Staff') {
    cat.inventory = { label: 'Sees inventory for ' + branch + ' only', access: true, levels: ['view'] };
    cat.movement  = { label: 'Can record Stock In/Out, Damage, Missing at ' + branch, access: true, levels: ['encode'] };
    cat.transfers = { label: 'Can view transfers involving ' + branch + ' (cannot request/approve)', access: true, levels: ['view'] };
    cat.branches  = { label: 'Can add Subasta/Scrap entries for ' + branch + ' (cannot edit/delete)', access: true, levels: ['encode'] };
    cat.capital   = { label: 'Can add Branch Capital entries for ' + branch + ' (pending approval) — own submissions only', access: true, levels: ['encode'] };
  } else if (emp.role === 'None' && emp.position === 'Sales Executive') {
    cat.inventory = { label: 'Sees inventory for every branch', access: true, levels: ['view'] };
    cat.transfers = { label: 'Can request transfers (cannot approve)', access: true, levels: ['encode'] };
    cat.branches  = { label: 'Can view and add Subasta/Scrap for any branch (cannot edit/delete)', access: true, levels: ['encode'] };
    cat.capital   = { label: 'Can view Branch Capital for every branch; add entries (pending approval)', access: true, levels: ['view', 'encode'] };
  } else if (emp.role === 'None' && isPosMgr) {
    // Admin Assistant, Operations Supervisor, Inventory Supervisor -- full manage
    // (add/edit/delete) on Subasta/Scrap anywhere, not just add.
    cat.branches = { label: 'Can add, edit, and delete Subasta/Scrap for any branch', access: true, levels: ['edit'] };
    cat.capital  = { label: 'Can add Branch Capital entries for any branch (pending approval)', access: true, levels: ['encode'] };
    if (emp.position === 'Admin Assistant') {
      cat.payments = { label: 'Can see Transactions and fill in FB Name/Customer/Order ID (not add/import/delete)', access: true, levels: ['edit'] };
      cat.lbc      = { label: 'Can see and manage LBC Monitoring', access: true, levels: ['edit'] };
    }
  } else if (emp.role === 'None' && emp.position === 'Personal Assistant') {
    cat.branches = { label: 'Can view Subasta/Scrap for every branch (view only)', access: true, levels: ['view'] };
    cat.capital  = { label: 'Can view remaining balance for every branch; add own entries (pending approval)', access: true, levels: ['view', 'encode'] };
  } else if (emp.role === 'None') {
    cat.branches = emp.branches
      ? { label: 'Can add Subasta/Scrap entries for ' + branch + ' (cannot edit/delete)', access: true, levels: ['encode'] }
      : { label: 'No branch assigned — cannot add Subasta/Scrap entries', access: false, levels: [] };
    cat.capital = { label: 'Can add Branch Capital entries (pending approval) — own submissions only', access: true, levels: ['encode'] };
  }

  const autoRefundApprover = ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role) || isPosMgr;
  cat.refund = (autoRefundApprover || emp.refund_approval_access)
    ? { label: 'Can approve and process refund requests', access: true, levels: ['approver'] }
    : { label: 'Can only submit refund requests (cannot approve)', access: false, levels: [] };

  cat.bills = emp.bills_access
    ? { label: 'Can see and add Bills', access: true, levels: ['edit'] }
    : { label: 'Cannot see the Bills tracker', access: false, levels: [] };

  // Individually granted extra access upgrades whichever category it belongs to,
  // instead of showing as a separate "other" row.
  (emp.extra_page_access || []).forEach((page) => {
    const c = EXTRA_PAGE_CATEGORY[page];
    if (!c) return;
    cat[c] = { label: cat[c].access ? cat[c].label : 'Individually granted access to ' + page, access: true, levels: cat[c].levels.length ? cat[c].levels : ['edit'] };
  });

  CATEGORY_ORDER.forEach((c) => { if (!cat[c].label) cat[c].label = NO_ACCESS_LABEL[c] || 'No access'; });

  return CATEGORY_ORDER.map((c) => ({ id: c, category: c, label: cat[c].label, access: cat[c].access, levels: cat[c].levels }));
}

const employee = await initShell('access-checklist');
if (employee) {
  const root = document.getElementById('ac-root');

  if (employee.role !== 'Admin') {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">This checklist is Admin-only.</p></div></div>';
  } else {
    let people = [];
    let selectedId = null;

    // overrides holds an EXPLICIT {checked, levels} only for (employee, task) pairs
    // Ren has actually set here -- absence means "not overridden," so the pill picker
    // falls back to the auto-computed item.access/item.levels. This is what lets the
    // picker directly mean "here's their access level(s)" while still defaulting
    // sensibly to what the system actually grants, with room to correct it if reality
    // differs from the computed default.
    let overrides = {};

    async function load() {
      try {
        const [emps, rows] = await Promise.all([getEmployeesForChecklist(), getAccessChecklist()]);
        // Keeps the raw record (raw) alongside the derived fields so a position change
        // can recompute this one person's items locally (itemsForEmployee needs branch,
        // bills_access, refund_approval_access, extra_page_access -- not just position).
        people = emps.map((e) => ({ id: e.id, name: e.full_name, role: e.role, position: e.position, raw: e, items: itemsForEmployee(e) }));
        overrides = {};
        rows.forEach((r) => { overrides[r.employee_id + ':' + r.item_key] = { checked: r.checked, levels: r.levels || [] }; });
        if (selectedId && !people.some((p) => p.id === selectedId)) selectedId = null;
      } catch (err) {
        toast('ac-msg', String(err.message || err), true);
      }
      render();
    }

    await load();
    subscribeToChanges('access_checklist_verifications', load);

    // Effective levels for a row: an array, any combination of view/encode/edit/
    // approver, empty means No access -- the override if Ren has set one, otherwise
    // the computed default. Ren can pick more than one (e.g. Edit AND Approver) --
    // entirely his call, not something the system infers.
    function effectiveLevels(personId, item) {
      const key = personId + ':' + item.id;
      const ov = overrides[key];
      if (ov) return ov.checked ? ov.levels : [];
      return item.access ? item.levels : [];
    }
    function accessCount(p) { return p.items.filter((it) => effectiveLevels(p.id, it).length > 0).length; }

    function render() {
      const empListHtml = !people.length ? '<p class="muted">No non-Admin employees yet.</p>' : people.map((p) =>
        '<button type="button" class="ac-emp-row' + (p.id === selectedId ? ' active' : '') + '" data-select-emp="' + p.id + '">' +
          '<div class="name">' + esc(p.name) + '</div>' +
          '<div class="sub">' + esc(p.role) + (p.position ? ' · ' + esc(p.position) : '') + '</div>' +
          '<div class="progress">' + accessCount(p) + ' / ' + p.items.length + ' tasks accessible</div>' +
        '</button>'
      ).join('');

      const selected = people.find((p) => p.id === selectedId);

      let mainHtml;
      if (!selected) {
        mainHtml = '<div class="card"><p class="muted">Select an employee on the left to see their access checklist.</p></div>';
      } else {
        const byCategory = {};
        CATEGORY_ORDER.forEach((c) => { byCategory[c] = []; });
        selected.items.forEach((it) => { byCategory[it.category].push(it); });

        const taskCardsHtml = CATEGORY_ORDER.map((catKey) => {
          const items = byCategory[catKey];
          if (!items.length) return '';
          return '<div class="card ac-task-card">' +
            '<h4>' + esc(CATEGORY_LABEL[catKey]) + '</h4>' +
            items.map((it) => {
              const key = selected.id + ':' + it.id;
              const current = effectiveLevels(selected.id, it);
              // "No access" resets the whole row (exclusive); the other four toggle
              // independently -- Ren can combine any of them, e.g. Edit + Approver.
              const pill = (lvl, label) => {
                const active = lvl === 'none' ? current.length === 0 : current.includes(lvl);
                return '<button type="button" class="lvl-pill ' + lvl + (active ? ' active' : '') + '" data-key="' + key + '" data-level="' + lvl + '">' + label + '</button>';
              };
              return '<div class="ac-item">' +
                '<span class="lbl-text">' + esc(it.label) + '</span>' +
                '<div class="lvl-picker">' +
                  pill('none', 'No access') + pill('view', 'View only') + pill('encode', 'Encode') + pill('edit', 'Edit') + pill('approver', 'Approver') +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('');

        mainHtml =
          '<div class="card">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
              '<h3 style="margin:0;">' + esc(selected.name) + ' <span class="muted" style="font-weight:normal;font-size:13px;">— ' + esc(selected.role) + '</span></h3>' +
              '<span style="display:flex;align-items:center;gap:6px;">' +
                '<label class="muted" style="font-size:12px;">Position</label>' +
                '<select data-position-for="' + selected.id + '" style="padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">' + positionOptions(selected.position) + '</select>' +
              '</span>' +
            '</div>' +
            '<p class="muted" style="margin-bottom:0;">Changing Position here takes effect immediately — several tasks below (and pages like Branches, Transactions, Branch Capital) key off it directly.</p>' +
          '</div>' +
          taskCardsHtml;
      }

      root.innerHTML =
        '<h2>Access Verification Checklist</h2>' +
        '<p class="muted">Pick an employee on the left. Each task starts from what their role/position actually grants — click No access, View only, Encode (can add an entry but not edit/delete), Edit, or Approver to correct it if what you see on their real account is different. More than one can be active on the same task (e.g. Edit + Approver) — that\'s entirely your call.</p>' +
        '<div class="ac-layout">' +
          '<div class="card ac-emp-list">' + empListHtml + '</div>' +
          '<div class="ac-emp-main">' + mainHtml + '</div>' +
        '</div>';

      root.querySelectorAll('[data-select-emp]').forEach((btn) => btn.addEventListener('click', () => {
        selectedId = btn.dataset.selectEmp;
        render();
      }));

      root.querySelectorAll('[data-position-for]').forEach((sel) => sel.addEventListener('change', async (ev) => {
        const employeeId = ev.target.dataset.positionFor;
        const newPosition = ev.target.value;
        const person = people.find((p) => p.id === employeeId);
        const prevPosition = person ? person.position : null;
        // Optimistic update: recompute this person's task list from the new position
        // immediately and re-render, instead of waiting on the save + a full reload
        // round-trip -- their checklist should change the instant you pick a position,
        // not a beat later.
        if (person) {
          person.position = newPosition;
          person.raw.position = newPosition;
          person.items = itemsForEmployee(person.raw);
        }
        render();
        try {
          await updateEmployeePosition(employeeId, newPosition);
          toast('ac-msg', 'Position updated.', false);
          await load(); // reconciles with the server (also picks up anyone else's concurrent edits)
        } catch (err) {
          if (person) {
            person.position = prevPosition;
            person.raw.position = prevPosition;
            person.items = itemsForEmployee(person.raw);
          }
          render();
          toast('ac-msg', String(err.message || err), true);
        }
      }));

      root.querySelectorAll('.lvl-pill').forEach((btn) => btn.addEventListener('click', async () => {
        const key = btn.dataset.key;
        const clicked = btn.dataset.level; // 'none' | 'view' | 'encode' | 'edit' | 'approver'
        const sep = key.indexOf(':');
        const employeeId = key.slice(0, sep), itemKey = key.slice(sep + 1);
        const person = people.find((p) => p.id === employeeId);
        const item = person && person.items.find((it) => it.id === itemKey);
        if (!item) return;
        const current = effectiveLevels(employeeId, item);
        // "No access" resets the row; any other pill toggles independently -- Ren can
        // have more than one active at once (e.g. Edit + Approver), entirely his call.
        const newLevels = clicked === 'none' ? [] : (current.includes(clicked) ? current.filter((l) => l !== clicked) : [...current, clicked]);
        const newChecked = newLevels.length > 0;
        const prevOverride = overrides.hasOwnProperty(key) ? overrides[key] : undefined;
        overrides[key] = { checked: newChecked, levels: newLevels };
        render();
        try {
          await setAccessChecklistItem(employeeId, itemKey, newChecked, newLevels);
        } catch (err) {
          if (prevOverride === undefined) delete overrides[key]; else overrides[key] = prevOverride;
          render();
          toast('ac-msg', String(err.message || err), true);
        }
      }));
    }
  }
}
</script>
</body>
</html>
