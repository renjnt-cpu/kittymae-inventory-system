<body>
<main>
  <div id="fix-root"><p class="muted">Loading…</p></div>
</main>

<script type="module">
import { initShell } from './js/shell.js?v=20261007f';
import { startFixPage } from './js/dqFix.js?v=20261007f';

const employee = await initShell('fix-data');
if (employee) {
  try { await startFixPage({ root: document.getElementById('fix-root'), employee }); }
  catch (err) { document.getElementById('fix-root').innerHTML = '<div class="msg error">We couldn\'t open this page right now. Please try again, or contact Admin if the problem continues.</div>'; console.error(err); }
}
</script>
