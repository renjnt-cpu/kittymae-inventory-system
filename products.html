<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKU Catalog — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20260923g">
</head>
<body>
<main>
  <div id="prod-msg"></div>
  <div id="products-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js?v=20260923g';
import {
  listProducts, updateProduct, getBranches, listAllInventoryQty, subscribeToChanges,
  requestProductEdit, listProductEditRequests, approveProductEdit, rejectProductEdit,
  setProductStatus, listProductLastChanges,
} from './js/api.js?v=20260923g';
import { branchColor } from './js/branchColors.js?v=20260923g';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const weight = (n) => n === null || n === undefined ? '—' : Number(n).toLocaleString('en-PH', { minimumFractionDigits: 3 }) + ' g';
// Per Gram jewelry (Ren, 2026-09-18: "since its jewelry per piece i also sell per
// gram... we will based it per grams") -- a Per Gram SKU's selling price is its rate
// (current_gold_rate_per_g) x its weight, computed here rather than stored, so editing
// either the rate or the weight always keeps the price consistent.
const effectivePrice = (p) => p.pricing_mode === 'Per Gram'
  ? (p.current_gold_rate_per_g != null && p.gross_weight_g != null ? p.current_gold_rate_per_g * p.gross_weight_g : null)
  : p.system_selling_price;
const priceCellHtml = (p) => money(effectivePrice(p)) +
  (p.pricing_mode === 'Per Gram' ? '<div class="muted" style="font-size:10px;">' + money(p.current_gold_rate_per_g) + '/g</div>' : '');
// Max rows actually built as <table> DOM rows in one go -- see the comment at its use
// in render() below for why (Ren, 2026-09-17: "lagging" as the catalog grew past 7,400
// SKUs was the table itself, not the fetch).
const CATALOG_RENDER_CAP = 300;

const employee = await initShell('products');
if (employee) {
  const root = document.getElementById('products-root');
  const canManage = ['Admin', 'Manager'].includes(employee.role);
  // Just decides who SEES an Edit button at all (Admin/Manager/Branch Supervisor) --
  // whether it applies immediately or goes through approval is isAdmin/needsApproval
  // below.
  const canEdit = canManage || employee.role === 'Branch Supervisor';
  const isAdmin = employee.role === 'Admin';
  // Only Admin's edit applies immediately (Ren, 2026-09-18: "give me editable all item
  // only me so that if theres an error coming i can edit immediately") -- Manager and
  // Branch Supervisor both submit a pending request instead (request_product_edit())
  // via the exact same edit form; products_update_admin_only blocks a direct UPDATE at
  // the RLS level too, so this isn't just a UI nicety.
  const needsApproval = !isAdmin;
  // Ren, 2026-09-21: reversed the "only me" approval call from 3 days ago -- Branch
  // Supervisor can now also approve/reject a pending Price/Grams/etc. request, on top
  // of Admin (approve_product_edit()/reject_product_edit() enforce this server-side
  // too, and block approving your own request).
  const canApprove = isAdmin || employee.role === 'Branch Supervisor';
  // Discontinue/Reactivate is a status flip, not a financial-field change -- lower risk
  // than Price/Grams, so it's direct for this whole group (no approval queue), matching
  // set_product_status()'s own server-side gate. Manager is restored here too --
  // products_update_admin_only's tightening had silently taken this away as a side
  // effect, which was never a deliberate call.
  const canDiscontinue = canManage || employee.role === 'Branch Supervisor';
  const branches = await getBranches();

  root.innerHTML =
    '<p class="muted">New SKUs and stock now come in through <a href="item-monitoring.html">Item Monitoring → Record Factory Purchase</a> instead of here.</p>' +
    '<div class="card">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
        '<div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="SKU, Sub SKU, or product name…"></div>' +
        '<div class="field"><label>Status</label><select id="f-status"><option value="all">All</option><option value="Active" selected>Active</option><option value="Discontinued">Discontinued</option></select></div>' +
        '<div class="field"><label>Category</label><select id="f-category"><option value="all">All</option></select></div>' +
        // One Sort control, same as every other module (Ren's 2026-09-21 Filter + Sort
        // spec, section 36: no per-module sort UI) -- generic fields plus this catalog's
        // own useful "pcs at this branch" sort share the one dropdown instead of two
        // competing controls.
        '<div class="field"><label>Sort By</label><select id="f-sort-branch">' +
          '<option value="sku" selected>SKU</option><option value="item_name">Item Name</option>' +
          '<option value="category">Category</option><option value="price">Price</option><option value="total_pcs">Total Pcs (All Branches)</option>' +
          '<optgroup label="Pcs at Branch">' + branches.map((b) => '<option value="' + b.id + '">' + esc(b.name) + '</option>').join('') + '</optgroup>' +
        '</select></div>' +
        '<div class="field"><label>Direction</label><select id="f-sort-dir"><option value="asc" selected>Ascending</option><option value="desc">Descending</option></select></div>' +
        '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
      '</div>' +
    '</div>' +
    '<div class="tiles" id="prod-tiles"></div>' +
    '<div id="prod-list"><div class="muted">Loading…</div></div>' +
    // Always-visible folder for Discontinued SKUs (Ren, 2026-09-17: MK01 kept getting
    // restocked/sold while sitting Discontinued and invisible, because finding a
    // Discontinued item meant remembering to flip the Status filter above) --
    // independent of whatever the Status/search/category filters above are set to, so
    // Discontinued SKUs are always one click away instead of hidden behind a dropdown.
    '<details class="card exp" id="prod-discontinued-folder" style="margin-top:14px;">' +
      '<summary><span class="exp-arrow" aria-hidden="true">▸</span>Discontinued <span class="exp-count" id="prod-discontinued-count"></span></summary>' +
      '<div class="exp-body" id="prod-discontinued-list"><div class="muted">Loading…</div></div>' +
    '</details>' +
    // Admin/Branch Supervisor review queue for a pending edit request (Ren,
    // 2026-09-17: "give me the final approver"; widened 2026-09-21 to include
    // Supervisor) -- open by default (unlike Discontinued) since a pending request is
    // something to act on, not just browse.
    (canApprove
      ? '<details class="card exp" id="prod-pending-edits-folder" style="margin-top:10px;" open>' +
          '<summary><span class="exp-arrow" aria-hidden="true">▸</span>Pending Edit Requests <span class="exp-count" id="prod-pending-edits-count"></span></summary>' +
          '<div class="exp-body" id="prod-pending-edits-list"><div class="muted">Loading…</div></div>' +
        '</details>'
      : '');

  // With 7,392 SKUs, search/status filters query the server directly (listProducts
  // pages through everything that matches instead of stopping at PostgREST's 1000-row
  // per-request cap) rather than fetching everything and filtering client-side.
  let allProducts = [];
  let discontinuedProducts = [];
  let pendingEditRequests = []; // every Pending row this employee can see (RLS: all for Admin/Manager, own for a Supervisor)
  let qtyBySku = {}; // { sku: { branchId: qty_available } }, from listAllInventoryQty()
  let lastChangeBySku = {}; // { sku: { changer, changed_at, action } }, from listProductLastChanges() -- who last touched each SKU (Ren, 2026-09-21: "update admin name on the side who is last edited it")
  let filterBranchId = null; // set by clicking a branch column header -- only SKUs with pcs > 0 there
  let searchTimer = null;
  let productsRealtimeTimer = null;
  let qtyRealtimeTimer = null;
  // Loaded once up front, then only re-fetched on an actual inventory change (below) --
  // this used to be re-fetched on every search/status load() call too, which meant
  // every keystroke paid for a second full inventory scan it didn't need and had
  // nothing to do with (typing a search term doesn't change anyone's stock). That was
  // most of the "SKU Catalog is lagging" feel while searching.
  await loadQty();
  await Promise.all([loadProducts(), loadDiscontinued(), loadPendingEditRequests(), loadLastChanges()]);
  document.getElementById('f-category').addEventListener('change', render);
  // Split by table so a search keystroke's debounce isn't sharing a timer with
  // inventory's -- a sale/stock-in elsewhere shouldn't cancel/delay a pending search,
  // and vice versa.
  subscribeToChanges(['products', 'inventory', 'product_edit_requests'], (payload) => {
    if (payload.table === 'inventory') {
      clearTimeout(qtyRealtimeTimer);
      qtyRealtimeTimer = setTimeout(async () => { await loadQty(); render(); }, 500);
    } else if (payload.table === 'product_edit_requests') {
      clearTimeout(productsRealtimeTimer);
      productsRealtimeTimer = setTimeout(async () => { await loadPendingEditRequests(); render(); }, 500);
    } else {
      clearTimeout(productsRealtimeTimer);
      // Any products change (a direct edit, an approval, Discontinue/Reactivate) also
      // logs to product_change_log, so "last edited by" needs a refresh here too.
      productsRealtimeTimer = setTimeout(async () => { await Promise.all([loadProducts(), loadDiscontinued(), loadLastChanges()]); }, 500);
    }
  });

  document.getElementById('f-search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadProducts, 300);
  });
  document.getElementById('f-status').addEventListener('change', loadProducts);
  document.getElementById('f-sort-branch').addEventListener('change', render);
  document.getElementById('f-sort-dir').addEventListener('change', render);
  document.getElementById('f-clear').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-status').value = 'all';
    document.getElementById('f-category').value = 'all';
    document.getElementById('f-sort-branch').value = 'sku';
    document.getElementById('f-sort-dir').value = 'asc';
    filterBranchId = null;
    loadProducts();
  });

  async function loadQty() {
    const qtyRows = await listAllInventoryQty();
    qtyBySku = {};
    qtyRows.forEach((r) => {
      (qtyBySku[r.sku] || (qtyBySku[r.sku] = {}))[r.branch_id] = r.qty_available;
    });
  }

  async function loadLastChanges() {
    try {
      const rows = await listProductLastChanges();
      lastChangeBySku = {};
      rows.forEach((r) => { lastChangeBySku[r.sku] = r; });
      render();
    } catch (err) { /* a failed lookup here shouldn't block the catalog from showing */ }
  }

  /** Ren, 2026-09-21: "update admin name on the side who is last edited it" -- whoever
   * actually applied the last change (an Admin's own direct edit, an approved request,
   * or a Discontinue/Reactivate), since trg_log_product_change logs every one of those
   * regardless of path. Blank for a SKU never individually touched since bulk import. */
  function lastChangeCellHtml(sku) {
    const c = lastChangeBySku[sku];
    if (!c || !c.changer) return '';
    return '<div class="muted" style="font-size:10px;">Last edited by ' + esc(c.changer.full_name) +
      ' · ' + new Date(c.changed_at).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) + '</div>';
  }

  // A branch name typed into Search (e.g. "APM Mall") isn't a SKU/Sub SKU/product-name
  // match -- it drives the branch sort + highlight in render() below instead of the
  // server-side text search, which would otherwise just return zero rows for it.
  function matchBranchByName(term) {
    const t = (term || '').trim().toLowerCase();
    if (!t) return null;
    return branches.find((b) => b.name.toLowerCase().includes(t)) || null;
  }

  async function loadProducts() {
    const list = document.getElementById('prod-list');
    list.innerHTML = '<div class="muted">Loading…</div>';
    try {
      const searchTerm = document.getElementById('f-search').value.trim();
      const branchMatch = matchBranchByName(searchTerm);
      allProducts = await listProducts({
        search: branchMatch ? '' : searchTerm,
        status: document.getElementById('f-status').value,
      });
      render();
    } catch (err) {
      list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  /** Fetched independently of the Status/search/category filters above, so the
   * Discontinued folder always shows every Discontinued SKU no matter what the main
   * table is currently filtered to -- that's the whole point of it being a folder. */
  async function loadDiscontinued() {
    const box = document.getElementById('prod-discontinued-list');
    try {
      discontinuedProducts = await listProducts({ status: 'Discontinued' });
      renderDiscontinuedFolder();
    } catch (err) {
      box.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  /** Only fetched for someone who can actually edit -- a plain viewer never sees the
   * Edit button in the first place, so the "Pending" badge below has nothing to
   * inform them of. RLS scopes the rows this comes back with (see listProductEditRequests). */
  async function loadPendingEditRequests() {
    if (!canEdit) return;
    try {
      pendingEditRequests = (await listProductEditRequests()).filter((r) => r.status === 'Pending');
    } catch (err) {
      pendingEditRequests = [];
    }
    if (canApprove) renderPendingEditRequests();
  }

  function renderPendingEditRequests() {
    document.getElementById('prod-pending-edits-count').textContent = '(' + pendingEditRequests.length + ')';
    const box = document.getElementById('prod-pending-edits-list');
    if (!pendingEditRequests.length) { box.innerHTML = '<p class="muted">No pending edit requests.</p>'; return; }

    // Only the fields that actually changed show a before -> after line -- an
    // unchanged field (Sub SKU left blank, say) would just be noise here.
    const diffLine = (label, before, after, fmt) => {
      const b = fmt ? fmt(before) : (before || '—');
      const a = fmt ? fmt(after) : (after || '—');
      if (String(before ?? '') === String(after ?? '')) return '';
      return '<div>' + label + ': <span class="muted" style="text-decoration:line-through;">' + esc(String(b)) + '</span> → <strong>' + esc(String(a)) + '</strong></div>';
    };
    box.innerHTML = pendingEditRequests.map((r) =>
      '<div class="card" style="margin-bottom:8px;background:#fffaf0;">' +
        '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">' +
          '<div><b>' + esc(r.sku) + '</b> <span class="muted" style="font-size:11px;">requested by ' + (r.requester ? esc(r.requester.full_name) : '—') + '</span></div>' +
          '<div class="muted" style="font-size:11px;">' + new Date(r.requested_at).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) + '</div>' +
        '</div>' +
        '<div style="font-size:12px;margin-top:6px;">' +
          diffLine('Product Name', r.previous_item_name, r.item_name) +
          diffLine('Category', r.previous_category, r.category) +
          diffLine('Sub SKU', r.previous_sub_sku, r.sub_sku) +
          diffLine('Price', r.previous_price, r.price, money) +
          diffLine('Est. Gram', r.previous_gross_weight_g, r.gross_weight_g, weight) +
          diffLine('Pricing', r.previous_pricing_mode, r.pricing_mode) +
          diffLine('Price per Gram', r.previous_price_per_gram, r.price_per_gram, money) +
        '</div>' +
        '<div style="margin-top:8px;display:flex;gap:6px;">' +
          '<button class="btn small" data-act="approve-edit" data-id="' + r.id + '">Approve</button>' +
          '<button class="btn small secondary" data-act="reject-edit" data-id="' + r.id + '">Reject</button>' +
        '</div>' +
      '</div>'
    ).join('');

    box.querySelectorAll('[data-act="approve-edit"]').forEach((btn) => btn.addEventListener('click', async () => {
      try {
        await approveProductEdit(Number(btn.dataset.id));
        toast('prod-msg', 'Edit approved.', false);
        await Promise.all([loadProducts(), loadPendingEditRequests()]);
      } catch (err) {
        toast('prod-msg', String(err.message || err), true);
      }
    }));
    box.querySelectorAll('[data-act="reject-edit"]').forEach((btn) => btn.addEventListener('click', async () => {
      const reason = prompt('Reason for rejecting (optional)?') || null;
      try {
        await rejectProductEdit(Number(btn.dataset.id), reason);
        toast('prod-msg', 'Edit rejected.', false);
        await loadPendingEditRequests();
        render();
      } catch (err) {
        toast('prod-msg', String(err.message || err), true);
      }
    }));
  }

  function renderDiscontinuedFolder() {
    document.getElementById('prod-discontinued-count').textContent = '(' + discontinuedProducts.length + ')';
    const box = document.getElementById('prod-discontinued-list');
    if (!discontinuedProducts.length) { box.innerHTML = '<p class="muted">No discontinued SKUs.</p>'; return; }
    box.innerHTML = '<div class="table-scroll table-mini"><table><thead><tr>' +
      '<th>SKU</th><th>Product Name</th><th>Category</th><th>Sub SKU</th><th>Price</th><th>Est. Gram</th><th></th>' +
      '</tr></thead><tbody>' +
      discontinuedProducts.map((p) => '<tr>' +
        '<td data-label="SKU"><b>' + esc(p.sku) + '</b></td>' +
        '<td data-label="Product Name">' + esc(p.item_name) + lastChangeCellHtml(p.sku) + '</td>' +
        '<td data-label="Category">' + esc(p.category || '—') + '</td>' +
        '<td data-label="Sub SKU">' + esc(p.sub_sku || '—') + '</td>' +
        '<td data-label="Price">' + priceCellHtml(p) + '</td>' +
        '<td data-label="Est. Gram">' + weight(p.gross_weight_g) + '</td>' +
        '<td>' + (canDiscontinue ? '<button class="btn small secondary" data-sku="' + esc(p.sku) + '" data-act="reactivate-folder">Reactivate</button>' : '') + '</td>' +
      '</tr>').join('') +
      '</tbody></table></div>';
    if (!canDiscontinue) return;
    box.querySelectorAll('[data-act="reactivate-folder"]').forEach((btn) => btn.addEventListener('click', async () => {
      try {
        await setProductStatus(btn.dataset.sku, 'Active');
        toast('prod-msg', 'SKU reactivated.', false);
        await Promise.all([loadProducts(), loadDiscontinued()]);
      } catch (err) {
        toast('prod-msg', String(err.message || err), true);
      }
    }));
  }

  function render() {
    let rows = allProducts; // already scoped to the current search + status at the query level

    // Searching a branch name auto-applies "Sort by Branch" for that branch, ascending
    // (fewest pcs first), and syncs the two dropdowns to show what's driving it -- the
    // sync is harmless since it only happens while a branch-name search is active, and
    // reverts to whatever the dropdowns say the moment the search is cleared.
    const branchMatch = matchBranchByName(document.getElementById('f-search').value.trim());
    if (branchMatch) {
      document.getElementById('f-sort-branch').value = String(branchMatch.id);
      document.getElementById('f-sort-dir').value = 'asc';
    }

    // Category options reflect whatever's currently loaded (search + status), same
    // as every other filter here -- rebuilt on each render so a value that stops
    // matching (e.g. after a search) drops out instead of pointing at nothing.
    const categorySelect = document.getElementById('f-category');
    const currentCategory = categorySelect.value || 'all';
    const categories = [...new Set(allProducts.map((p) => p.category).filter(Boolean))].sort();
    categorySelect.innerHTML = '<option value="all">All</option>' +
      categories.map((c) => '<option value="' + esc(c) + '"' + (c === currentCategory ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
    if (currentCategory !== 'all' && categories.includes(currentCategory)) rows = rows.filter((p) => p.category === currentCategory);

    // Click a branch column header to filter down to just the SKUs actually stocked
    // there (pcs > 0) -- click it again to clear. Applied before the tiles below so
    // the subtotal/total reflect whatever's actually showing in the table.
    if (filterBranchId != null) rows = rows.filter((p) => Number((qtyBySku[p.sku] || {})[filterBranchId] || 0) > 0);

    // Subtotal per branch + grand total across all of them -- reflects whatever's
    // currently filtered (search/status/branch), same as the SKU count notice below,
    // and is independent of the sort (sorting only reorders these same rows).
    let grandTotal = 0;
    const branchTiles = branches.map((b) => {
      const total = rows.reduce((s, p) => s + Number((qtyBySku[p.sku] || {})[b.id] || 0), 0);
      grandTotal += total;
      const c = branchColor(b.id, branches);
      return '<div class="tile" style="background:' + c.bg + ';"><div class="num" style="color:' + c.text + ';">' + total.toLocaleString('en-PH') + '</div><div class="lbl" style="color:' + c.text + ';">' + esc(b.name) + '</div></div>';
    });
    document.getElementById('prod-tiles').innerHTML = tile(grandTotal.toLocaleString('en-PH'), 'Total Pcs (All Branches)') + branchTiles.join('');

    // One Sort control for the whole catalog (section 36) -- generic fields plus a
    // per-branch "pcs there" sort share this same dropdown+direction pair. Filtering
    // (search/status/category/branch-column click) already picked `rows` above; this
    // only reorders them (section 11).
    const sortKey = document.getElementById('f-sort-branch').value;
    const totalPcsFor = (p) => Object.values(qtyBySku[p.sku] || {}).reduce((s, q) => s + Number(q || 0), 0);
    const GENERIC_SORT_COMPARATORS = {
      sku: (a, b) => a.sku.localeCompare(b.sku), item_name: (a, b) => a.item_name.localeCompare(b.item_name),
      category: (a, b) => String(a.category || '').localeCompare(String(b.category || '')),
      price: (a, b) => Number(effectivePrice(a) || 0) - Number(effectivePrice(b) || 0),
      total_pcs: (a, b) => totalPcsFor(a) - totalPcsFor(b),
    };
    const dirMul = document.getElementById('f-sort-dir').value === 'asc' ? 1 : -1;
    const genericCmp = GENERIC_SORT_COMPARATORS[sortKey];
    if (genericCmp) {
      rows = rows.slice().sort((a, b) => genericCmp(a, b) * dirMul);
    } else if (sortKey !== 'none') {
      const bId = Number(sortKey);
      rows = rows.slice().sort((a, b) => {
        const qa = Number((qtyBySku[a.sku] || {})[bId] || 0), qb = Number((qtyBySku[b.sku] || {})[bId] || 0);
        return (qa - qb) * dirMul;
      });
    }

    const list = document.getElementById('prod-list');
    if (!rows.length) {
      list.innerHTML = '<p class="muted">No SKUs match this filter.' +
        (filterBranchId != null ? ' <button type="button" class="btn small secondary" id="f-clear-branch">Clear branch filter</button>' : '') + '</p>';
      if (filterBranchId != null) document.getElementById('f-clear-branch').addEventListener('click', () => { filterBranchId = null; render(); });
      return;
    }

    // Rendering every matched row as a real <table> row is what was actually lagging
    // the page (Ren, 2026-09-17) -- with 7,400+ Active SKUs, an unfiltered/unsearched
    // view was building and laying out thousands of DOM rows at once. Tiles/totals
    // above still sum the FULL matched set (`rows`, untouched), only the table body
    // itself is capped -- search, a category, or a branch-column click narrows `rows`
    // below the cap and the whole matched set renders again.
    const matchedCount = rows.length;
    const truncated = matchedCount > CATALOG_RENDER_CAP;
    const renderRows = truncated ? rows.slice(0, CATALOG_RENDER_CAP) : rows;
    const countNotice = '<p class="muted" style="margin:0 0 8px;">' + matchedCount.toLocaleString('en-PH') + ' SKU(s)' +
      (truncated ? ' — showing the first ' + CATALOG_RENDER_CAP + '; search, pick a category, or click a branch column to narrow further' : '') + '</p>';

    const colCount = 9 + branches.length;
    const pendingSkus = new Set(pendingEditRequests.map((r) => r.sku));

    function rowHtml(p) {
      const qtyForSku = qtyBySku[p.sku] || {};
      const totalPcs = Object.values(qtyForSku).reduce((s, q) => s + Number(q || 0), 0);
      return '<tr data-row-id="' + esc(p.sku) + '">' +
          '<td data-label="SKU"><b>' + esc(p.sku) + '</b>' +
            (pendingSkus.has(p.sku) ? ' <span class="badge pending" title="An edit request for this SKU is awaiting Admin or Branch Supervisor approval">Pending Edit</span>' : '') +
          '</td>' +
          '<td data-label="Product Name">' + esc(p.item_name) + lastChangeCellHtml(p.sku) + '</td>' +
          '<td data-label="Category">' + esc(p.category || '—') + '</td>' +
          '<td data-label="Sub SKU">' + esc(p.sub_sku || '—') + '</td>' +
          '<td data-label="Price">' + priceCellHtml(p) + '</td>' +
          '<td data-label="Est. Gram">' + weight(p.gross_weight_g) + '</td>' +
          '<td data-label="Total Pcs"><b>' + totalPcs.toLocaleString('en-PH') + '</b></td>' +
          '<td data-label="Status"><span class="badge ' + (p.product_status === 'Active' ? 'ok' : 'low') + '">' + esc(p.product_status) + '</span></td>' +
          branches.map((b) => {
            const searched = branchMatch && branchMatch.id === b.id;
            const c = branchColor(b.id, branches);
            return '<td data-label="' + esc(b.name) + '" style="text-align:center;' + (searched ? 'background:' + c.bg + ';color:' + c.text + ';font-weight:800;' : '') + '">' + (qtyForSku[b.id] ?? '—') + '</td>';
          }).join('') +
          '<td data-label="Actions" style="white-space:nowrap;">' +
            (canEdit ? '<button class="btn small secondary" data-sku="' + esc(p.sku) + '" data-act="edit">Edit</button> ' : '') +
            (canDiscontinue
              ? (p.product_status === 'Active'
                  ? '<button class="btn small secondary" data-sku="' + esc(p.sku) + '" data-act="discontinue">Discontinue</button>'
                  : '<button class="btn small secondary" data-sku="' + esc(p.sku) + '" data-act="reactivate">Reactivate</button>')
              : '') +
          '</td>' +
        '</tr>' +
        '<tr class="edit-row" data-edit-for="' + esc(p.sku) + '" style="display:none;"><td colspan="' + colCount + '"></td></tr>';
    }

    const branchThs = branches.map((b) => {
      const c = branchColor(b.id, branches);
      const active = filterBranchId === b.id;
      const searched = branchMatch && branchMatch.id === b.id;
      return '<th data-branch-filter="' + b.id + '" title="Click to show only SKUs stocked at ' + esc(b.name) + '" style="cursor:pointer;background:' + c.bg + ';color:' + c.text + ';' +
        (active ? 'outline:2px solid ' + c.text + ';outline-offset:-2px;' : '') +
        (searched ? 'outline:3px solid ' + c.text + ';outline-offset:-3px;box-shadow:0 0 8px ' + c.text + ';font-weight:800;' : '') +
        '">' + (searched ? '🔎 ' : '') + esc(b.name) + (active ? ' ✕' : '') + '</th>';
    }).join('');

    list.innerHTML = (filterBranchId != null ? '<p class="muted" style="margin:0 0 8px;">Showing only SKUs stocked at <b>' + esc((branches.find((b) => b.id === filterBranchId) || {}).name) + '</b> — click the column again to clear.</p>' : '') +
      (branchMatch ? '<p class="muted" style="margin:0 0 8px;">🔎 Sorted by <b>' + esc(branchMatch.name) + '</b>, fewest pcs first — clear the search to sort another way.</p>' : '') +
      countNotice + '<div class="table-scroll table-mini"><table><thead><tr style="white-space:nowrap;">' +
      '<th>SKU</th><th>Product Name</th><th>Category</th><th>Sub SKU</th><th>Price</th><th>Est. Gram</th><th>Total Pcs</th><th>Status</th>' + branchThs + '<th></th>' +
      '</tr></thead><tbody>' + renderRows.map(rowHtml).join('') + '</tbody></table></div>';

    list.querySelectorAll('[data-branch-filter]').forEach((th) => th.addEventListener('click', () => {
      const id = Number(th.dataset.branchFilter);
      filterBranchId = filterBranchId === id ? null : id;
      render();
    }));

    if (!canEdit) return;

    list.querySelectorAll('[data-act="edit"]').forEach((btn) => btn.addEventListener('click', () => openEdit(btn.dataset.sku, rows)));

    if (!canDiscontinue) return;

    list.querySelectorAll('[data-act="discontinue"]').forEach((btn) => btn.addEventListener('click', async () => {
      if (!confirm('Are you sure you want to discontinue this item (' + btn.dataset.sku + ')? It stays visible in history, just hidden from the default Active view -- and moves into the Discontinued folder below.')) return;
      try { await setProductStatus(btn.dataset.sku, 'Discontinued'); toast('prod-msg', 'SKU discontinued.', false); await Promise.all([loadProducts(), loadDiscontinued()]); }
      catch (err) { toast('prod-msg', String(err.message || err), true); }
    }));

    list.querySelectorAll('[data-act="reactivate"]').forEach((btn) => btn.addEventListener('click', async () => {
      try { await setProductStatus(btn.dataset.sku, 'Active'); toast('prod-msg', 'SKU reactivated.', false); await Promise.all([loadProducts(), loadDiscontinued()]); }
      catch (err) { toast('prod-msg', String(err.message || err), true); }
    }));
  }

  /** Opens an inline edit form pre-filled with the SKU's current values, same pattern
   * as Bills' edit-in-place row. SKU itself is never editable — it's the primary key
   * every other table (inventory, ledger, transfers) references by. */
  function openEdit(sku, rows) {
    const p = rows.find((r) => r.sku === sku);
    const cell = document.querySelector('tr[data-edit-for="' + sku + '"]');
    const isOpen = cell.style.display !== 'none';
    document.querySelectorAll('.edit-row').forEach((r) => { r.style.display = 'none'; r.querySelector('td').innerHTML = ''; });
    if (isOpen) return;
    cell.style.display = '';
    cell.querySelector('td').innerHTML =
      '<form class="edit-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
        (needsApproval ? '<p class="muted" style="width:100%;margin:0 0 4px;">Submitted for Admin or Branch Supervisor approval -- won\'t apply until reviewed.</p>' : '') +
        '<div class="field"><label>Product Name</label><input type="text" name="itemName" value="' + esc(p.item_name) + '" required></div>' +
        '<div class="field"><label>Category</label><input type="text" name="category" value="' + esc(p.category || '') + '"></div>' +
        '<div class="field"><label>Sub SKU</label><input type="text" name="subSku" value="' + esc(p.sub_sku || '') + '"></div>' +
        '<div class="field"><label>Price (PHP)</label><input type="number" name="price" step="0.01" min="0" value="' + (p.system_selling_price ?? '') + '" title="Used when Pricing is Per Piece"></div>' +
        '<div class="field"><label>Est. Gram</label><input type="number" name="grossWeightG" step="0.001" min="0" value="' + (p.gross_weight_g ?? '') + '"></div>' +
        '<div class="field"><label>Pricing</label><select name="pricingMode"><option value="Per Piece"' + (p.pricing_mode !== 'Per Gram' ? ' selected' : '') + '>Per Piece</option><option value="Per Gram"' + (p.pricing_mode === 'Per Gram' ? ' selected' : '') + '>Per Gram</option></select></div>' +
        '<div class="field"><label>Price per Gram (PHP)</label><input type="number" name="pricePerGram" step="0.01" min="0" value="' + (p.current_gold_rate_per_g ?? '') + '" title="Used when Pricing is Per Gram -- selling price = this x Est. Gram"></div>' +
        '<button class="btn small" type="submit">' + (needsApproval ? 'Submit for Approval' : 'Save') + '</button> ' +
        '<button class="btn small secondary" type="button" data-cancel="1">Cancel</button>' +
      '</form>';
    const form = cell.querySelector('.edit-form');
    form.querySelector('[data-cancel]').addEventListener('click', () => { cell.style.display = 'none'; form.remove(); });
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      const fields = {
        itemName: f.itemName.value.trim(), category: f.category.value.trim(), subSku: f.subSku.value.trim(),
        price: f.price.value, grossWeightG: f.grossWeightG.value,
        pricingMode: f.pricingMode.value, pricePerGram: f.pricePerGram.value,
      };
      try {
        if (needsApproval) {
          await requestProductEdit({ sku, ...fields });
          toast('prod-msg', 'Edit request submitted -- awaiting Admin or Branch Supervisor approval.', false);
          await loadPendingEditRequests();
          render();
        } else {
          await updateProduct(sku, fields);
          toast('prod-msg', 'SKU updated.', false);
          await loadProducts();
        }
      } catch (err) {
        toast('prod-msg', String(err.message || err), true);
      }
    });
  }

  function tile(num, label) { return '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + esc(label) + '</div></div>'; }
}
</script>
</body>
</html>
