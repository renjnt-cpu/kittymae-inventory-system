<html lang="en">
<head>

<title>Asset &amp; Supplies Custodian — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20261007h">
</head>
<body>
<main id="ac-root"><p class="muted">Loading…</p></main>

<script type="module">
import { initShell } from './js/shell.js?v=20261007h';
import * as api from './js/assetsApi.js?v=20261007h';
import { startAssetsPage } from './js/assetsPage.js?v=20261007h';

// Everyone with a login can open this page: an employee sees the company property issued to them ("My Company Assets"); a branch
// supervisor, a custodian, a manager and an admin see more -- what each person sees and can do inside it follows their permissions
// (the Position Access Matrix) and their branch, and is enforced by the database, not by this page.
// ?asset=AST-2026-00001 (a scanned QR tag) opens that asset's card; #supplies, #requests ... open a tab.
const employee = await initShell('assets');
if (employee) {
  await startAssetsPage({ root: document.getElementById('ac-root'), api, employee, search: location.search, hash: location.hash });
}
</script>
</body>
</html>
