<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="dash-msg"></div>
  <div class="card">
    <h3>Branch</h3>
    <div id="branch-buttons" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
  <div class="card">
    <h3>Sales Overview</h3>
    <p class="muted" style="margin-top:-4px;">Every Sale recorded on Record Movement or completed as a Layaway, by branch.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field"><label>From</label><input type="date" id="sales-from"></div>
      <div class="field"><label>To</label><input type="date" id="sales-to"></div>
      <button type="button" class="btn small secondary" id="sales-clear">All Time</button>
    </div>
  </div>
  <div class="tiles" id="sales-tiles"></div>
  <div id="sales-top-branch" class="muted" style="margin:-8px 0 16px;"></div>
  <div id="sales-top-items"></div>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <div class="field"><label>Search SKU / Item Name</label><input type="text" id="search" oninput="window.__runSearch()"></div>
  </div>
  <div id="stock-table"><div class="muted">Loading…</div></div>
</main>

<script type="module">
import { initShell, esc, toast } from './js/shell.js';
import { getBranches, getInventory, listSales, subscribeToChanges } from './js/api.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });

const employee = await initShell('dashboard');
if (employee) {
  const branches = await getBranches();
  // Everyone can now VIEW every branch (read access is open on the underlying tables) —
  // Branch Supervisor/Staff just default to their own branch first since that's most
  // relevant to them day to day. Recording a movement still only works at your own
  // branch (movement.html / record_inventory_transaction() enforce that separately).
  const isScoped = employee.role === 'Branch Supervisor' || employee.role === 'Staff';
  let selectedBranch = isScoped ? employee.branch_id : null; // null = All Branches

  renderBranchButtons();
  await Promise.all([loadStock(), loadSales()]);
  subscribeToChanges(['inventory', 'inventory_transactions'], loadStock);
  subscribeToChanges('sales_inventory_movements', loadSales);

  document.getElementById('sales-from').addEventListener('change', loadSales);
  document.getElementById('sales-to').addEventListener('change', loadSales);
  document.getElementById('sales-clear').addEventListener('click', () => {
    document.getElementById('sales-from').value = '';
    document.getElementById('sales-to').value = '';
    loadSales();
  });

  async function loadSales() {
    try {
      const fromDate = document.getElementById('sales-from').value || undefined;
      const toDate = document.getElementById('sales-to').value || undefined;
      const rows = await listSales({ fromDate, toDate });
      renderSales(rows);
    } catch (err) {
      // Sales visibility is narrower than inventory visibility (see
      // sales_movements_read_scoped/_sales_exec_view in 66_sales_recording.sql) --
      // someone who can't see sales data just gets an empty section, not an error,
      // since the rest of the dashboard (inventory) is still fully usable to them.
      document.getElementById('sales-tiles').innerHTML = '';
      document.getElementById('sales-top-branch').innerHTML = '';
      document.getElementById('sales-top-items').innerHTML = '';
    }
  }

  function renderSales(rows) {
    const byBranch = {};
    rows.forEach((r) => {
      const b = byBranch[r.branch_id] || (byBranch[r.branch_id] = { qty: 0, revenue: 0, name: r.branches?.name || 'Branch #' + r.branch_id });
      b.qty += r.qty;
      b.revenue += r.qty * Number(r.unit_price || 0);
    });
    const branchStats = Object.values(byBranch).sort((a, b) => b.revenue - a.revenue);
    document.getElementById('sales-tiles').innerHTML = branchStats.length
      ? branchStats.map((b) => tile(money(b.revenue), 'Sold — ' + b.name + ' (' + b.qty + ' pcs)')).join('')
      : '<p class="muted">No sales for this range.</p>';

    document.getElementById('sales-top-branch').textContent = branchStats.length
      ? branchStats[0].name + ' sold the most in this range: ' + money(branchStats[0].revenue) + ' across ' + branchStats[0].qty + ' pieces.'
      : '';

    const byItem = {};
    rows.forEach((r) => {
      const it = byItem[r.sku] || (byItem[r.sku] = { qty: 0, revenue: 0, name: r.products?.item_name || '' });
      it.qty += r.qty;
      it.revenue += r.qty * Number(r.unit_price || 0);
    });
    const topItems = Object.entries(byItem).map(([sku, v]) => ({ sku, ...v })).sort((a, b) => b.qty - a.qty).slice(0, 10);
    const box = document.getElementById('sales-top-items');
    if (!topItems.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<h3>Top-Selling Items <span class="muted" style="font-weight:normal;">— this range</span></h3><div class="table-scroll"><table><tr><th>SKU</th><th>Item</th><th>Qty Sold</th><th>Revenue</th></tr>' +
      topItems.map((it) => '<tr><td data-label="SKU">' + esc(it.sku) + '</td><td data-label="Item">' + esc(it.name) + '</td><td data-label="Qty Sold">' + it.qty + '</td><td data-label="Revenue">' + money(it.revenue) + '</td></tr>').join('') +
      '</table></div>';
  }

  window.__runSearch = () => renderTable(window.__allRows || []);

  function renderBranchButtons() {
    const box = document.getElementById('branch-buttons');
    const options = [{ id: null, name: 'All Branches' }, ...branches];
    box.innerHTML = options.map((b) =>
      '<button class="btn ' + (b.id === selectedBranch ? '' : 'secondary') + '" data-id="' + b.id + '">' + esc(b.name) + '</button>'
    ).join('');
    box.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', async () => {
      selectedBranch = btn.dataset.id === 'null' ? null : Number(btn.dataset.id);
      renderBranchButtons();
      await loadStock();
    }));
  }

  async function loadStock() {
    document.getElementById('stock-table').innerHTML = '<div class="muted">Loading…</div>';
    try {
      const rows = await getInventory(selectedBranch);
      window.__allRows = rows;
      renderTiles(rows);
      renderTable(rows);
    } catch (err) {
      toast('dash-msg', String(err.message || err), true);
    }
  }

  function renderTiles(rows) {
    const totalPcs = rows.reduce((s, r) => s + r.qty_available, 0);
    const totalGrams = rows.reduce((s, r) => s + (r.total_grams_on_hand || 0), 0);
    const lowStock = rows.filter((r) => r.products && r.qty_available <= r.products.reorder_level).length;
    const outOfStock = rows.filter((r) => r.qty_available === 0).length;
    document.getElementById('tiles').innerHTML = [
      tile(totalPcs, 'Total Pieces'),
      tile(Math.round(totalGrams * 10) / 10 + 'g', 'Total Grams'),
      tile(lowStock, 'Low Stock SKUs'),
      tile(outOfStock, 'Out of Stock SKUs'),
    ].join('');
  }
  function tile(num, label) { return '<div class="tile"><div class="num">' + esc(num) + '</div><div class="lbl">' + esc(label) + '</div></div>'; }

  function renderTable(rows) {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const filtered = q ? rows.filter((r) => r.sku.toLowerCase().includes(q) || (r.products?.item_name || '').toLowerCase().includes(q)) : rows;
    const box = document.getElementById('stock-table');
    if (!filtered.length) { box.innerHTML = '<p class="muted">No matching stock.</p>'; return; }
    box.innerHTML = '<div class="table-scroll"><table><tr><th>SKU</th><th>Item Name</th><th>Available</th><th>Reserved</th><th>Grams on Hand</th><th>Status</th></tr>' +
      filtered.map((r) => {
        const low = r.products && r.qty_available <= r.products.reorder_level;
        const status = r.qty_available === 0
          ? '<span class="badge low">OUT OF STOCK</span>'
          : low ? '<span class="badge low">LOW STOCK</span>' : '<span class="badge ok">OK</span>';
        return '<tr><td data-label="SKU">' + esc(r.sku) + '</td><td data-label="Item Name">' + esc(r.products?.item_name || '') + '</td><td data-label="Available">' + r.qty_available +
          '</td><td data-label="Reserved">' + r.qty_reserved + '</td><td data-label="Grams on Hand">' + (r.total_grams_on_hand ?? '—') + '</td><td data-label="Status">' + status + '</td></tr>';
      }).join('') + '</table></div>';
  }
}
</script>
</body>
</html>
