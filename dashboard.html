<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="dash-msg"></div>
  <div class="card">
    <h3>Branch</h3>
    <div id="branch-buttons" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <div class="field"><label>Search SKU / Item Name</label><input type="text" id="search" oninput="window.__runSearch()"></div>
  </div>
  <div id="stock-table"><div class="muted">Loading…</div></div>
</main>

<script type="module">
import { initShell, esc, toast } from './js/shell.js';
import { getBranches, getInventory, subscribeToChanges } from './js/api.js';

const employee = await initShell('dashboard');
if (employee) {
  const branches = await getBranches();
  // Everyone can now VIEW every branch (read access is open on the underlying tables) —
  // Branch Supervisor/Staff just default to their own branch first since that's most
  // relevant to them day to day. Recording a movement still only works at your own
  // branch (movement.html / record_inventory_transaction() enforce that separately).
  const isScoped = employee.role === 'Branch Supervisor' || employee.role === 'Staff';
  let selectedBranch = isScoped ? employee.branch_id : null; // null = All Branches

  renderBranchButtons();
  await loadStock();
  subscribeToChanges(['inventory', 'inventory_transactions'], loadStock);

  window.__runSearch = () => renderTable(window.__allRows || []);

  function renderBranchButtons() {
    const box = document.getElementById('branch-buttons');
    const options = [{ id: null, name: 'All Branches' }, ...branches];
    box.innerHTML = options.map((b) =>
      '<button class="btn ' + (b.id === selectedBranch ? '' : 'secondary') + '" data-id="' + b.id + '">' + esc(b.name) + '</button>'
    ).join('');
    box.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', async () => {
      selectedBranch = btn.dataset.id === 'null' ? null : Number(btn.dataset.id);
      renderBranchButtons();
      await loadStock();
    }));
  }

  async function loadStock() {
    document.getElementById('stock-table').innerHTML = '<div class="muted">Loading…</div>';
    try {
      const rows = await getInventory(selectedBranch);
      window.__allRows = rows;
      renderTiles(rows);
      renderTable(rows);
    } catch (err) {
      toast('dash-msg', String(err.message || err), true);
    }
  }

  function renderTiles(rows) {
    const totalPcs = rows.reduce((s, r) => s + r.qty_available, 0);
    const totalGrams = rows.reduce((s, r) => s + (r.total_grams_on_hand || 0), 0);
    const lowStock = rows.filter((r) => r.products && r.qty_available <= r.products.reorder_level).length;
    const outOfStock = rows.filter((r) => r.qty_available === 0).length;
    document.getElementById('tiles').innerHTML = [
      tile(totalPcs, 'Total Pieces'),
      tile(Math.round(totalGrams * 10) / 10 + 'g', 'Total Grams'),
      tile(lowStock, 'Low Stock SKUs'),
      tile(outOfStock, 'Out of Stock SKUs'),
    ].join('');
  }
  function tile(num, label) { return '<div class="tile"><div class="num">' + esc(num) + '</div><div class="lbl">' + esc(label) + '</div></div>'; }

  function renderTable(rows) {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const filtered = q ? rows.filter((r) => r.sku.toLowerCase().includes(q) || (r.products?.item_name || '').toLowerCase().includes(q)) : rows;
    const box = document.getElementById('stock-table');
    if (!filtered.length) { box.innerHTML = '<p class="muted">No matching stock.</p>'; return; }
    box.innerHTML = '<div class="table-scroll"><table><tr><th>SKU</th><th>Item Name</th><th>Available</th><th>Reserved</th><th>Grams on Hand</th><th>Status</th></tr>' +
      filtered.map((r) => {
        const low = r.products && r.qty_available <= r.products.reorder_level;
        const status = r.qty_available === 0
          ? '<span class="badge low">OUT OF STOCK</span>'
          : low ? '<span class="badge low">LOW STOCK</span>' : '<span class="badge ok">OK</span>';
        return '<tr><td data-label="SKU">' + esc(r.sku) + '</td><td data-label="Item Name">' + esc(r.products?.item_name || '') + '</td><td data-label="Available">' + r.qty_available +
          '</td><td data-label="Reserved">' + r.qty_reserved + '</td><td data-label="Grams on Hand">' + (r.total_grams_on_hand ?? '—') + '</td><td data-label="Status">' + status + '</td></tr>';
      }).join('') + '</table></div>';
  }
}
</script>
</body>
</html>
