<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refunds — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="ref-msg"></div>
  <div id="refunds-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { listRefunds, createRefund, setRefundStatus, deleteRefund, addRefundAttachment, removeRefundAttachment, getRefundAttachmentUrl } from './js/api.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const STATUS_BADGE = { 'Pending Approval': 'pending', 'Approved': 'transit', 'Completed': 'ok' };

const employee = await initShell('refunds');
if (employee) {
  const root = document.getElementById('refunds-root');

  if (!['Admin', 'Manager'].includes(employee.role)) {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">Refund monitoring is restricted to Admin and Manager.</p></div></div>';
  } else {
    root.innerHTML =
      '<div class="layout-2col">' +
        '<div class="layout-2col-side">' +
          '<div class="card">' +
            '<h3>Add Refund</h3>' +
            '<p class="muted" style="margin-top:-4px;">No photo here — a refund starts as a request awaiting approval. Proof-of-payment photos get attached after it\'s approved and actually paid out.</p>' +
            '<form id="ref-form" style="flex-direction:column;align-items:stretch;">' +
              '<div class="field"><label>Customer Name *</label><input type="text" name="customerName" required></div>' +
              '<div class="field"><label>Order Reference</label><input type="text" name="orderReference"></div>' +
              '<div class="field"><label>Item</label><input type="text" name="itemDescription"></div>' +
              '<div class="field"><label>Refund Amount (PHP) *</label><input type="number" name="refundAmount" step="0.01" min="0" required></div>' +
              '<div class="field"><label>Refund Method</label><select name="refundMethod"><option>Cash</option><option>GCash</option><option>Bank Transfer</option></select></div>' +
              '<div class="field"><label>Reason</label><input type="text" name="reason"></div>' +
              '<div class="field"><label>Refund Date</label><input type="date" name="refundDate"></div>' +
              '<div class="field"><label>Notes</label><input type="text" name="notes"></div>' +
              '<button class="btn" type="submit">Add Refund Request</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="layout-2col-main">' +
          '<div class="tiles" id="ref-tiles"></div>' +
          '<div class="card">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
              '<div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="Customer, order ref, item…"></div>' +
              '<div class="field"><label>Status</label><select id="f-status"><option value="all">All Statuses</option><option>Pending Approval</option><option>Approved</option><option>Completed</option></select></div>' +
              '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
            '</div>' +
          '</div>' +
          '<div id="ref-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
      '</div>';

    document.getElementById('ref-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await createRefund({
          customerName: f.customerName.value.trim(), orderReference: f.orderReference.value.trim(),
          itemDescription: f.itemDescription.value.trim(), refundAmount: Number(f.refundAmount.value),
          refundMethod: f.refundMethod.value, reason: f.reason.value.trim(),
          refundDate: f.refundDate.value || null, notes: f.notes.value.trim(),
        });
        toast('ref-msg', 'Refund request added — pending approval.', false);
        f.reset();
        await load();
      } catch (err) {
        toast('ref-msg', String(err.message || err), true);
      }
    });

    let allRefunds = [];
    await load();

    document.getElementById('f-search').addEventListener('input', render);
    document.getElementById('f-status').addEventListener('change', render);
    document.getElementById('f-clear').addEventListener('click', () => {
      document.getElementById('f-search').value = '';
      document.getElementById('f-status').value = 'all';
      render();
    });

    async function load() {
      const list = document.getElementById('ref-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        allRefunds = await listRefunds();
        render();
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    function render() {
      let rows = allRefunds;
      const fSearch = document.getElementById('f-search').value.trim().toLowerCase();
      const fStatus = document.getElementById('f-status').value;
      if (fSearch) rows = rows.filter((r) =>
        r.customer_name.toLowerCase().includes(fSearch) ||
        (r.order_reference || '').toLowerCase().includes(fSearch) ||
        (r.item_description || '').toLowerCase().includes(fSearch));
      if (fStatus !== 'all') rows = rows.filter((r) => r.status === fStatus);

      const pendingCount = rows.filter((r) => r.status === 'Pending Approval').length;
      const approvedCount = rows.filter((r) => r.status === 'Approved').length;
      const completedTotal = rows.filter((r) => r.status === 'Completed').reduce((s, r) => s + Number(r.refund_amount || 0), 0);
      document.getElementById('ref-tiles').innerHTML =
        tile(String(pendingCount), 'Pending Approval') + tile(String(approvedCount), 'Approved') + tile(money(completedTotal), 'Total Refunded') + tile(String(rows.length), 'Count');

      const list = document.getElementById('ref-list');
      if (!rows.length) { list.innerHTML = '<p class="muted">No refunds for this filter.</p>'; return; }
      list.innerHTML = '<div class="table-scroll"><table><tr><th>Customer</th><th>Order Ref</th><th>Item</th><th>Amount</th><th>Method</th><th>Reason</th><th>Status</th><th>Date</th><th>Proof Photos</th><th></th></tr>' +
        rows.map((r) => {
          const canAttach = r.status !== 'Pending Approval';
          const photos = r.refund_attachments || [];
          return '<tr>' +
            '<td data-label="Customer">' + esc(r.customer_name) +
              (r.creator ? '<div class="muted" style="font-size:10px;margin-top:2px;">Added by ' + esc(r.creator.full_name) + '</div>' : '') +
            '</td>' +
            '<td data-label="Order Ref">' + esc(r.order_reference || '') + '</td>' +
            '<td data-label="Item">' + esc(r.item_description || '') + '</td>' +
            '<td data-label="Amount">' + money(r.refund_amount) + '</td>' +
            '<td data-label="Method">' + esc(r.refund_method) + '</td>' +
            '<td data-label="Reason">' + esc(r.reason || '') + '</td>' +
            '<td data-label="Status"><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
            '<td data-label="Date">' + (r.refund_date || '—') + '</td>' +
            '<td data-label="Proof Photos">' +
              (photos.length
                ? photos.map((a, i) => '<div style="margin-bottom:2px;"><button class="btn small secondary" data-view-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">View ' + (i + 1) + '</button> <button class="btn small secondary" data-remove-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">✕</button></div>').join('')
                : '<span class="muted">None yet</span>') +
              (canAttach
                ? '<label class="btn small secondary" style="cursor:pointer;display:inline-block;margin-top:2px;">+ Add Photo<input type="file" accept="image/*" data-add-for="' + r.id + '" style="display:none;"></label>'
                : '<div class="muted" style="font-size:11px;">Approve first</div>') +
            '</td>' +
            '<td data-label="Actions" style="white-space:nowrap;">' +
              (r.status === 'Pending Approval' ? '<button class="btn small" data-id="' + r.id + '" data-act="approve">Approve</button> ' : '') +
              (r.status === 'Approved' ? '<button class="btn small" data-id="' + r.id + '" data-act="complete">Mark Completed</button> ' : '') +
              (r.status === 'Completed' ? '<button class="btn small secondary" data-id="' + r.id + '" data-act="reopen">Reopen</button> ' : '') +
              '<button class="btn small secondary" data-id="' + r.id + '" data-act="delete">Delete</button>' +
            '</td>' +
          '</tr>';
        }).join('') + '</table></div>';

      list.querySelectorAll('[data-act]').forEach((btn) => btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        try {
          if (btn.dataset.act === 'approve') { await setRefundStatus(id, 'Approved'); toast('ref-msg', 'Approved.', false); await load(); }
          else if (btn.dataset.act === 'complete') { await setRefundStatus(id, 'Completed'); toast('ref-msg', 'Marked completed.', false); await load(); }
          else if (btn.dataset.act === 'reopen') { await setRefundStatus(id, 'Approved'); toast('ref-msg', 'Reopened to Approved.', false); await load(); }
          else if (btn.dataset.act === 'delete') { if (!confirm('Delete this refund?')) return; await deleteRefund(id); toast('ref-msg', 'Deleted.', false); await load(); }
        } catch (err) {
          toast('ref-msg', String(err.message || err), true);
        }
      }));

      list.querySelectorAll('[data-view-id]').forEach((btn) => btn.addEventListener('click', async () => {
        try { window.open(await getRefundAttachmentUrl(btn.dataset.path), '_blank'); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));

      list.querySelectorAll('[data-remove-id]').forEach((btn) => btn.addEventListener('click', async () => {
        if (!confirm('Remove this photo?')) return;
        try { await removeRefundAttachment(btn.dataset.removeId, btn.dataset.path); toast('ref-msg', 'Photo removed.', false); await load(); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));

      list.querySelectorAll('[data-add-for]').forEach((input) => input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        try { await addRefundAttachment(input.dataset.addFor, file); toast('ref-msg', 'Photo added.', false); await load(); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));
    }

    function tile(num, label) { return '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>'; }
  }
}
</script>
</body>
</html>
