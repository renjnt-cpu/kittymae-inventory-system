<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refunds — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="ref-msg"></div>
  <div id="refunds-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { listRefunds, createRefund, setRefundStatus, deleteRefund, addRefundAttachment, removeRefundAttachment, getRefundAttachmentUrl, subscribeToChanges } from './js/api.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const STATUS_BADGE = { 'Pending Approval': 'pending', 'Approved': 'transit', 'Completed': 'ok' };

/** Same customer name + same Order ID appearing on more than one refund is almost
 * always either an accidental double-submission or someone trying to claim a refund
 * twice — flag it in red wherever that name shows up, across every status, so an
 * approver notices before paying it out twice. */
function duplicateKeySet(rows) {
  const counts = {};
  rows.forEach((r) => {
    const key = r.customer_name.trim().toLowerCase() + '|' + (r.order_reference || '').trim().toLowerCase();
    counts[key] = (counts[key] || 0) + 1;
  });
  return new Set(Object.keys(counts).filter((k) => counts[k] > 1));
}
function nameOrderLabel(r, dupKeys) {
  const key = r.customer_name.trim().toLowerCase() + '|' + (r.order_reference || '').trim().toLowerCase();
  const text = esc(r.order_reference || '(no Order ID)') + ' — ' + esc(r.customer_name);
  return dupKeys.has(key) ? '<span style="color:var(--warn);font-weight:bold;" title="Possible duplicate: same Order ID + name appears more than once">' + text + ' ⚠</span>' : text;
}

/** Any active employee lands here to request a refund. Only the approval group --
 * Admin/Manager/Branch Supervisor (role), Admin Assistant (position), or the
 * hand-picked refund_approval_access flag (mirrors has_refund_approval_access() in
 * 58_refund_approval_role_based.sql) -- gets the full approve/manage view; everyone
 * else gets just the request form plus a read-only list of their own submissions. */
const canApprove = (emp) => ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role) || emp.position === 'Admin Assistant' || !!emp.refund_approval_access;
// Broader group (refund_approval_access) can approve/process and add Proof of Payment,
// but fixing a mistake -- removing a wrong attachment, deleting a refund outright --
// stays with a supervisor/manager, same rule as Scrap/Subasta.
const canEditRefund = (emp) => ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role);

const REFUND_FORM_FIELDS =
  '<div class="field"><label>Name *</label><input type="text" name="customerName" required></div>' +
  '<div class="field"><label>Order ID</label><input type="text" name="orderReference"></div>' +
  '<div class="field"><label>Date Purchased</label><input type="date" name="purchaseDate"></div>' +
  '<div class="field"><label>Date Requested</label><input type="date" name="dateRequested" value="' + new Date().toISOString().slice(0, 10) + '"></div>' +
  '<div class="field"><label>Item</label><input type="text" name="itemDescription"></div>' +
  '<div class="field"><label>Reason</label><input type="text" name="reason"></div>' +
  '<div class="field"><label>Refund Method *</label><select name="refundMethod" required><option>GCash</option><option>BDO</option><option>Maya</option><option>BPI</option><option>GoTyme</option><option>Maribank</option><option>Union Bank</option></select></div>' +
  '<div class="field"><label>Account Name</label><input type="text" name="accountName" placeholder="Payout account name"></div>' +
  '<div class="field"><label>Account Number</label><input type="text" name="accountNumber" placeholder="Payout account number"></div>' +
  '<div class="field"><label>Amount to Refund (PHP) *</label><input type="number" name="refundAmount" step="0.01" min="0.01" required></div>' +
  '<div class="field"><label>Notes</label><input type="text" name="notes"></div>';

function readRefundForm(f) {
  return {
    customerName: f.customerName.value.trim(), orderReference: f.orderReference.value.trim(),
    purchaseDate: f.purchaseDate.value || null, dateRequested: f.dateRequested.value || null,
    itemDescription: f.itemDescription.value.trim(),
    reason: f.reason.value.trim(), refundMethod: f.refundMethod.value,
    accountName: f.accountName.value.trim(), accountNumber: f.accountNumber.value.trim(),
    refundAmount: Number(f.refundAmount.value), notes: f.notes.value.trim(),
  };
}

const employee = await initShell('refunds');
if (employee) {
  const root = document.getElementById('refunds-root');

  if (canApprove(employee)) {
    renderApproverView();
  } else {
    renderRequesterView();
  }

  function renderRequesterView() {
    root.innerHTML =
      '<div class="layout-2col">' +
        '<div class="layout-2col-side">' +
          '<div class="card">' +
            '<h3>Add Refund Request</h3>' +
            '<p class="muted" style="margin-top:-4px;">Submit here — an approver will review it. No photo needed yet, that comes after approval.</p>' +
            '<form id="ref-form" style="flex-direction:column;align-items:stretch;">' + REFUND_FORM_FIELDS +
              '<button class="btn" type="submit">Add Refund Request</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="layout-2col-main">' +
          '<h3>My Refund Requests</h3>' +
          '<div id="ref-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
      '</div>';

    document.getElementById('ref-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await createRefund(readRefundForm(f));
        toast('ref-msg', 'Refund request added — pending approval.', false);
        f.reset();
        await loadMine();
      } catch (err) {
        toast('ref-msg', String(err.message || err), true);
      }
    });

    let myRows = [];
    loadMine();
    subscribeToChanges('refunds', loadMine);

    async function loadMine() {
      const list = document.getElementById('ref-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        myRows = await listRefunds(); // RLS already limits this to the caller's own rows
        renderMine();
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    /** Every field shows directly in the row -- no click-to-expand -- matching the
     * Transactions/Scrap/Subasta lists. Proof of Payment is view-only here (only an
     * approver processes the payout). */
    function renderMine() {
      const list = document.getElementById('ref-list');
      if (!myRows.length) { list.innerHTML = '<p class="muted">No refund requests yet.</p>'; return; }
      const dupKeys = duplicateKeySet(myRows);
      let totalRequested = 0, totalPaid = 0;
      const rowsHtml = myRows.map((r) => {
        const photos = r.refund_attachments || [];
        const paidSoFar = photos.reduce((s, a) => s + Number(a.amount || 0), 0);
        const remaining = Number(r.refund_amount || 0) - paidSoFar;
        totalRequested += Number(r.refund_amount || 0);
        totalPaid += paidSoFar;
        return '<tr>' +
          '<td>' + nameOrderLabel(r, dupKeys) + '</td>' +
          '<td><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
          '<td>' + (r.date_requested || '—') + '<div class="muted" style="font-size:10px;">Purchased: ' + (r.purchase_date || '—') + '</div></td>' +
          '<td style="font-size:11px;">' + esc(r.item_description || '—') + (r.reason ? '<div class="muted">' + esc(r.reason) + '</div>' : '') + '</td>' +
          '<td>' + money(r.refund_amount) +
            (photos.length ? '<div class="muted" style="font-size:10px;">' + money(paidSoFar) + (remaining > 0 ? ' paid · ' + money(remaining) + ' left' : ' paid · fully covered') + '</div>' : '') +
          '</td>' +
          '<td style="font-size:11px;">' + esc(r.refund_method) +
            (r.account_name || r.account_number ? '<div class="muted">' + esc(r.account_name || '') + (r.account_number ? ' · ' + esc(r.account_number) : '') + '</div>' : '') +
          '</td>' +
          '<td style="font-size:11px;">' +
            (photos.length
              ? photos.map((a) => '<div>' + money(a.amount) + (a.reference_number ? ' · ' + esc(a.reference_number) : '') + (a.attachment_path ? ' <button class="btn small secondary" data-view-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">View</button>' : ' <span class="muted">(no photo)</span>') + '</div>').join('')
              : '<span class="muted">None yet</span>') +
          '</td>' +
          '<td style="font-size:11px;">' + esc(r.notes || '') + '<div class="muted" style="font-size:10px;">Approved by: ' + (r.approver ? esc(r.approver.full_name) : '—') + '</div></td>' +
        '</tr>';
      }).join('');
      list.innerHTML = '<div class="table-scroll"><table style="table-layout:fixed;word-break:break-word;">' +
        '<colgroup><col style="width:14%"><col style="width:8%"><col style="width:11%"><col style="width:13%"><col style="width:11%"><col style="width:12%"><col style="width:16%"><col style="width:15%"></colgroup>' +
        '<thead><tr><th>Order ID / Customer</th><th>Status</th><th>Dates</th><th>Item / Reason</th><th>Amount</th><th>Method / Account</th><th>Proof of Payment</th><th>Notes / Approved by</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
        '<tfoot><tr style="font-weight:bold;background:#f7f7f7;">' +
          '<td colspan="4">Qty: ' + myRows.length + '</td>' +
          '<td>' + money(totalRequested) + '<div class="muted" style="font-size:10px;font-weight:normal;">' + money(totalPaid) + ' paid</div></td>' +
          '<td colspan="3"></td>' +
        '</tr></tfoot>' +
        '</table></div>';

      list.querySelectorAll('[data-view-id]').forEach((btn) => btn.addEventListener('click', async () => {
        try { window.open(await getRefundAttachmentUrl(btn.dataset.path), '_blank'); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));
    }
  }

  function renderApproverView() {
    root.innerHTML =
      '<div class="layout-3col">' +
        '<div class="layout-3col-side">' +
          '<div class="card">' +
            '<h3>Add Refund Request</h3>' +
            '<p class="muted" style="margin-top:-4px;">No photo here — proof-of-payment gets attached after approval, once it\'s actually paid out.</p>' +
            '<form id="ref-form" style="flex-direction:column;align-items:stretch;">' + REFUND_FORM_FIELDS +
              '<button class="btn" type="submit">Add Refund Request</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="layout-3col-main">' +
          '<div class="tiles" id="ref-tiles"></div>' +
          '<div class="card">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
              '<div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="Customer, order ID, item…"></div>' +
              '<div class="field"><label>Status</label><select id="f-status"><option value="all">All Statuses</option><option>Pending Approval</option><option>Approved</option></select></div>' +
              '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
            '</div>' +
          '</div>' +
          '<div id="ref-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="layout-3col-right">' +
          '<div class="card">' +
            '<h3>Completed</h3>' +
            '<div class="field"><label>Filter Order ID</label><input type="text" id="completed-search" placeholder="Order ID…"></div>' +
            '<div id="completed-list"><div class="muted">Loading…</div></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('ref-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await createRefund(readRefundForm(f));
        toast('ref-msg', 'Refund request added — pending approval.', false);
        f.reset();
        await load();
      } catch (err) {
        toast('ref-msg', String(err.message || err), true);
      }
    });

    let allRefunds = [];
    load();
    subscribeToChanges(['refunds', 'refund_attachments'], load);

    document.getElementById('f-search').addEventListener('input', render);
    document.getElementById('f-status').addEventListener('change', render);
    document.getElementById('f-clear').addEventListener('click', () => {
      document.getElementById('f-search').value = '';
      document.getElementById('f-status').value = 'all';
      render();
    });
    document.getElementById('completed-search').addEventListener('input', renderCompletedPanel);

    async function load() {
      const list = document.getElementById('ref-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        allRefunds = await listRefunds();
        render();
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    /** Completed refunds move out of the main table entirely and live in the
     * right-side panel instead. Every field shows directly -- no click-to-expand --
     * same as the main list, just in a narrower table for this panel's width. */
    function renderCompletedPanel() {
      const box = document.getElementById('completed-list');
      const q = document.getElementById('completed-search').value.trim().toLowerCase();
      let completed = allRefunds.filter((r) => r.status === 'Completed');
      if (q) completed = completed.filter((r) => (r.order_reference || '').toLowerCase().includes(q));
      if (!completed.length) { box.innerHTML = '<p class="muted">No completed refunds yet.</p>'; return; }

      const dupKeys = duplicateKeySet(allRefunds);
      let total = 0;
      const rowsHtml = completed.map((r) => {
        const photos = r.refund_attachments || [];
        total += Number(r.refund_amount || 0);
        return '<tr>' +
          '<td>' + nameOrderLabel(r, dupKeys) +
            '<div class="muted" style="font-size:10px;">' + esc(r.item_description || '') + '</div>' +
          '</td>' +
          '<td>' + money(r.refund_amount) + '<div class="muted" style="font-size:10px;">' + esc(r.refund_method) + '</div></td>' +
          '<td style="font-size:11px;">' +
            (photos.length
              ? photos.map((a) => '<div>' + money(a.amount) + (a.attachment_path ? ' <button class="btn small secondary" data-view-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">View</button>' : '') + '</div>').join('')
              : '<span class="muted">None</span>') +
            '<div class="muted" style="font-size:10px;">By ' + (r.approver ? esc(r.approver.full_name) : '—') + '</div>' +
          '</td>' +
          '<td style="white-space:nowrap;"><button class="btn small secondary" type="button" data-id="' + r.id + '" data-act="reopen">Reopen</button></td>' +
        '</tr>';
      }).join('');
      box.innerHTML = '<div class="table-scroll"><table style="table-layout:fixed;word-break:break-word;">' +
        '<colgroup><col style="width:32%"><col style="width:24%"><col style="width:28%"><col style="width:16%"></colgroup>' +
        '<thead><tr><th>Order ID / Customer</th><th>Amount</th><th>Proof of Payment</th><th></th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
        '<tfoot><tr style="font-weight:bold;background:#f7f7f7;"><td>Qty: ' + completed.length + '</td><td>' + money(total) + '</td><td colspan="2"></td></tr></tfoot>' +
        '</table></div>';

      box.querySelectorAll('[data-view-id]').forEach((btn) => btn.addEventListener('click', async () => {
        try { window.open(await getRefundAttachmentUrl(btn.dataset.path), '_blank'); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));
      box.querySelectorAll('[data-act="reopen"]').forEach((btn) => btn.addEventListener('click', async () => {
        try { await setRefundStatus(btn.dataset.id, 'Approved'); toast('ref-msg', 'Reopened to Approved.', false); await load(); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));
    }

    function render() {
      const fSearch = document.getElementById('f-search').value.trim().toLowerCase();
      const fStatus = document.getElementById('f-status').value;
      let filtered = allRefunds;
      if (fSearch) filtered = filtered.filter((r) =>
        r.customer_name.toLowerCase().includes(fSearch) ||
        (r.order_reference || '').toLowerCase().includes(fSearch) ||
        (r.item_description || '').toLowerCase().includes(fSearch));
      if (fStatus !== 'all') filtered = filtered.filter((r) => r.status === fStatus);

      const pendingCount = filtered.filter((r) => r.status === 'Pending Approval').length;
      const approvedCount = filtered.filter((r) => r.status === 'Approved').length;
      const completedTotal = allRefunds.filter((r) => r.status === 'Completed').reduce((s, r) => s + Number(r.refund_amount || 0), 0);
      // Completed refunds live in the right-side panel, not this table.
      const rows = filtered.filter((r) => r.status !== 'Completed');
      document.getElementById('ref-tiles').innerHTML =
        tile(String(pendingCount), 'Pending Approval') + tile(String(approvedCount), 'Approved') + tile(money(completedTotal), 'Total Refunded') + tile(String(rows.length), 'Count');

      renderCompletedPanel();

      const list = document.getElementById('ref-list');
      if (!rows.length) { list.innerHTML = '<p class="muted">No refunds for this filter.</p>'; return; }

      // Every field shows directly in the row -- no click-to-expand -- matching
      // Transactions/Scrap/Subasta. Add Proof of Payment is an always-visible inline
      // form (no "+ Add" toggle first) once the refund is past Pending Approval.
      const dupKeys = duplicateKeySet(allRefunds);
      let totalRequested = 0, totalPaid = 0, totalRemaining = 0;
      const rowsHtml = rows.map((r) => {
        const photos = r.refund_attachments || [];
        const paidSoFar = photos.reduce((s, a) => s + Number(a.amount || 0), 0);
        const remaining = Number(r.refund_amount || 0) - paidSoFar;
        totalRequested += Number(r.refund_amount || 0);
        totalPaid += paidSoFar;
        totalRemaining += Math.max(remaining, 0);
        const canAttach = r.status !== 'Pending Approval';
        const canComplete = r.status === 'Approved' && remaining <= 0;
        return '<tr' + (r.status === 'Pending Approval' ? ' style="background:#fff8e8;"' : '') + '>' +
          '<td>' + nameOrderLabel(r, dupKeys) +
            '<div class="muted" style="font-size:10px;">' + esc(r.item_description || '') + (r.reason ? ' · ' + esc(r.reason) : '') + '</div>' +
          '</td>' +
          '<td><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
          '<td>' + (r.date_requested || '—') + '<div class="muted" style="font-size:10px;">Purchased: ' + (r.purchase_date || '—') + '</div></td>' +
          '<td>' + money(r.refund_amount) +
            (photos.length ? '<div class="muted" style="font-size:10px;">' + money(paidSoFar) + (remaining > 0 ? ' paid · ' + money(remaining) + ' left' : ' paid · fully covered') + '</div>' : '') +
          '</td>' +
          '<td style="font-size:11px;">' + esc(r.refund_method) +
            (r.account_name || r.account_number ? '<div class="muted">' + esc(r.account_name || '') + (r.account_number ? ' · ' + esc(r.account_number) : '') + '</div>' : '') +
          '</td>' +
          '<td style="font-size:11px;">' +
            (photos.length
              ? photos.map((a) => '<div style="margin-bottom:2px;">' + money(a.amount) + (a.reference_number ? ' · ' + esc(a.reference_number) : '') + (a.attachment_path ? ' <button class="btn small secondary" data-view-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">View</button>' : ' <span class="muted">(no photo)</span>') + (canEditRefund(employee) ? ' <button class="btn small secondary" data-remove-id="' + a.id + '" data-path="' + esc(a.attachment_path || '') + '">✕</button>' : '') + '</div>').join('')
              : '<span class="muted">None yet</span>') +
            (canAttach
              ? '<form class="add-proof-form" data-refund-id="' + r.id + '" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">' +
                  '<input type="number" name="amount" step="0.01" min="0.01" placeholder="Amount" required style="width:70px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:11px;">' +
                  '<input type="text" name="referenceNumber" placeholder="Reference" required style="width:80px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:11px;">' +
                  '<input type="file" name="photo" accept="image/*" style="font-size:10px;width:90px;">' +
                  '<button class="btn small" type="submit">Save</button>' +
                '</form>'
              : '<div class="muted" style="font-size:11px;">Approve first</div>') +
          '</td>' +
          '<td style="font-size:11px;">' + esc(r.notes || '') +
            '<div class="muted" style="font-size:10px;">Req by: ' + (r.creator ? esc(r.creator.full_name) : '—') + '</div>' +
            '<div class="muted" style="font-size:10px;">App by: ' + (r.approver ? esc(r.approver.full_name) : '—') + '</div>' +
          '</td>' +
          '<td style="white-space:nowrap;">' +
            (r.status === 'Pending Approval' ? '<button class="btn small" data-id="' + r.id + '" data-act="approve">Approve</button> ' : '') +
            (r.status === 'Approved' ? (canComplete
                ? '<button class="btn small" data-id="' + r.id + '" data-act="complete">Mark Completed</button> '
                : '<span class="muted" style="font-size:11px;">' + money(remaining) + ' left</span> ')
              : '') +
            (canEditRefund(employee) ? '<button class="btn small secondary" data-id="' + r.id + '" data-act="delete">Delete</button>' : '') +
          '</td>' +
        '</tr>';
      }).join('');
      list.innerHTML = '<div class="table-scroll"><table style="table-layout:fixed;word-break:break-word;">' +
        '<colgroup><col style="width:13%"><col style="width:8%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:17%"><col style="width:13%"><col style="width:12%"></colgroup>' +
        '<thead><tr><th>Order ID / Customer</th><th>Status</th><th>Dates</th><th>Amount</th><th>Method / Account</th><th>Proof of Payment</th><th>Notes / By</th><th></th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
        '<tfoot><tr style="font-weight:bold;background:#f7f7f7;">' +
          '<td colspan="3">Qty: ' + rows.length + '</td>' +
          '<td>' + money(totalRequested) + '<div class="muted" style="font-size:10px;font-weight:normal;">' + money(totalPaid) + ' paid · ' + money(totalRemaining) + ' left</div></td>' +
          '<td colspan="4"></td>' +
        '</tr></tfoot>' +
        '</table></div>';

      list.querySelectorAll('[data-act]').forEach((btn) => btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        try {
          if (btn.dataset.act === 'approve') { await setRefundStatus(id, 'Approved'); toast('ref-msg', 'Approved.', false); await load(); }
          else if (btn.dataset.act === 'complete') { await setRefundStatus(id, 'Completed'); toast('ref-msg', 'Marked completed.', false); await load(); }
          else if (btn.dataset.act === 'reopen') { await setRefundStatus(id, 'Approved'); toast('ref-msg', 'Reopened to Approved.', false); await load(); }
          else if (btn.dataset.act === 'delete') { if (!confirm('Delete this refund?')) return; await deleteRefund(id); toast('ref-msg', 'Deleted.', false); await load(); }
        } catch (err) {
          toast('ref-msg', String(err.message || err), true);
        }
      }));

      list.querySelectorAll('[data-view-id]').forEach((btn) => btn.addEventListener('click', async () => {
        try { window.open(await getRefundAttachmentUrl(btn.dataset.path), '_blank'); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));

      list.querySelectorAll('[data-remove-id]').forEach((btn) => btn.addEventListener('click', async () => {
        if (!confirm('Remove this proof of payment?')) return;
        try { await removeRefundAttachment(btn.dataset.removeId, btn.dataset.path); toast('ref-msg', 'Removed.', false); await load(); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));

      list.querySelectorAll('.add-proof-form').forEach((form) => form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const refundId = form.dataset.refundId;
        const file = form.photo.files[0];
        const amount = Number(form.amount.value);
        const referenceNumber = form.referenceNumber.value.trim();
        try {
          await addRefundAttachment(refundId, amount, file, referenceNumber);
          toast('ref-msg', 'Proof of payment added.', false);
          await load();
        } catch (err) {
          toast('ref-msg', String(err.message || err), true);
        }
      }));
    }

    function tile(num, label) { return '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>'; }
  }
}
</script>
</body>
</html>
