<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refunds — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20261008a">
</head>
<body>
<main id="rf-root"><p class="muted">Loading…</p></main>

<script type="module">
import { initShell } from './js/shell.js?v=20261008a';
import * as api from './js/refundsApi.js?v=20261008a';
import { startRefundsPage } from './js/refundsPage.js?v=20261008a';

// Everyone with a login can open this page; what each person sees and can do inside it is decided by their Refunds
// role (Admin / Manager / Finance / View only / Staff) -- and enforced by the database, not by this page.
// ?open=<id> opens that refund's card (used by activity notifications and links from other pages).
const employee = await initShell('refunds');
if (employee) {
  await startRefundsPage({ root: document.getElementById('rf-root'), api, employee, search: location.search, hash: location.hash });
}
</script>
</body>
</html>
