<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refunds — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="ref-msg"></div>
  <div id="refunds-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { listRefunds, createRefund, setRefundStatus, deleteRefund, addRefundAttachment, removeRefundAttachment, getRefundAttachmentUrl, subscribeToChanges } from './js/api.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const STATUS_BADGE = { 'Pending Approval': 'pending', 'Approved': 'transit', 'Completed': 'ok' };

/** Any active employee lands here to request a refund. Only the named approval group
 * (Admin, or the refund_approval_access flag — mirrors has_refund_approval_access() in
 * 27_refund_request_any_employee.sql) gets the full approve/manage view; everyone else
 * gets just the request form plus a read-only list of their own submissions. */
const canApprove = (emp) => emp.role === 'Admin' || !!emp.refund_approval_access;

const REFUND_FORM_FIELDS =
  '<div class="field"><label>Name *</label><input type="text" name="customerName" required></div>' +
  '<div class="field"><label>Order ID</label><input type="text" name="orderReference"></div>' +
  '<div class="field"><label>Date Purchased</label><input type="date" name="purchaseDate"></div>' +
  '<div class="field"><label>Item</label><input type="text" name="itemDescription"></div>' +
  '<div class="field"><label>Reason</label><input type="text" name="reason"></div>' +
  '<div class="field"><label>Refund Method *</label><select name="refundMethod" required><option>GCash</option><option>BDO</option><option>Maya</option><option>BPI</option></select></div>' +
  '<div class="field"><label>Account Name</label><input type="text" name="accountName" placeholder="Payout account name"></div>' +
  '<div class="field"><label>Account Number</label><input type="text" name="accountNumber" placeholder="Payout account number"></div>' +
  '<div class="field"><label>Amount to Refund (PHP) *</label><input type="number" name="refundAmount" step="0.01" min="0.01" required></div>' +
  '<div class="field"><label>Notes</label><input type="text" name="notes"></div>';

function readRefundForm(f) {
  return {
    customerName: f.customerName.value.trim(), orderReference: f.orderReference.value.trim(),
    purchaseDate: f.purchaseDate.value || null, itemDescription: f.itemDescription.value.trim(),
    reason: f.reason.value.trim(), refundMethod: f.refundMethod.value,
    accountName: f.accountName.value.trim(), accountNumber: f.accountNumber.value.trim(),
    refundAmount: Number(f.refundAmount.value), notes: f.notes.value.trim(),
  };
}

const employee = await initShell('refunds');
if (employee) {
  const root = document.getElementById('refunds-root');

  if (canApprove(employee)) {
    renderApproverView();
  } else {
    renderRequesterView();
  }

  function renderRequesterView() {
    root.innerHTML =
      '<div class="layout-2col">' +
        '<div class="layout-2col-side">' +
          '<div class="card">' +
            '<h3>Add Refund Request</h3>' +
            '<p class="muted" style="margin-top:-4px;">Submit here — an approver will review it. No photo needed yet, that comes after approval.</p>' +
            '<form id="ref-form" style="flex-direction:column;align-items:stretch;">' + REFUND_FORM_FIELDS +
              '<button class="btn" type="submit">Add Refund Request</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="layout-2col-main">' +
          '<h3>My Refund Requests</h3>' +
          '<div id="ref-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
      '</div>';

    document.getElementById('ref-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await createRefund(readRefundForm(f));
        toast('ref-msg', 'Refund request added — pending approval.', false);
        f.reset();
        await loadMine();
      } catch (err) {
        toast('ref-msg', String(err.message || err), true);
      }
    });

    loadMine();
    subscribeToChanges('refunds', loadMine);

    async function loadMine() {
      const list = document.getElementById('ref-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        const rows = await listRefunds(); // RLS already limits this to the caller's own rows
        if (!rows.length) { list.innerHTML = '<p class="muted">No refund requests yet.</p>'; return; }
        list.innerHTML = '<div class="table-scroll"><table><tr><th>Order ID</th><th>Item</th><th>Amount</th><th>Method</th><th>Status</th></tr>' +
          rows.map((r) =>
            '<tr>' +
              '<td data-label="Order ID">' + esc(r.order_reference || '') + '</td>' +
              '<td data-label="Item">' + esc(r.item_description || '') + '</td>' +
              '<td data-label="Amount">' + money(r.refund_amount) + '</td>' +
              '<td data-label="Method">' + esc(r.refund_method) + '</td>' +
              '<td data-label="Status"><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
            '</tr>'
          ).join('') + '</table></div>';
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }
  }

  function renderApproverView() {
    root.innerHTML =
      '<div class="layout-3col">' +
        '<div class="layout-3col-side">' +
          '<div class="card">' +
            '<h3>Add Refund Request</h3>' +
            '<p class="muted" style="margin-top:-4px;">No photo here — proof-of-payment gets attached after approval, once it\'s actually paid out.</p>' +
            '<form id="ref-form" style="flex-direction:column;align-items:stretch;">' + REFUND_FORM_FIELDS +
              '<button class="btn" type="submit">Add Refund Request</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="layout-3col-main">' +
          '<div class="tiles" id="ref-tiles"></div>' +
          '<div class="card">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
              '<div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="Customer, order ID, item…"></div>' +
              '<div class="field"><label>Status</label><select id="f-status"><option value="all">All Statuses</option><option>Pending Approval</option><option>Approved</option></select></div>' +
              '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
            '</div>' +
          '</div>' +
          '<div id="ref-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
        '<div class="layout-3col-right">' +
          '<div class="card">' +
            '<h3>Completed</h3>' +
            '<div class="field"><label>Filter Order ID</label><input type="text" id="completed-search" placeholder="Order ID…"></div>' +
            '<div id="completed-list"><div class="muted">Loading…</div></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('ref-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await createRefund(readRefundForm(f));
        toast('ref-msg', 'Refund request added — pending approval.', false);
        f.reset();
        await load();
      } catch (err) {
        toast('ref-msg', String(err.message || err), true);
      }
    });

    let allRefunds = [];
    let openAddProofFor = null;
    let openCompletedId = null;
    load();
    subscribeToChanges(['refunds', 'refund_attachments'], load);

    document.getElementById('f-search').addEventListener('input', render);
    document.getElementById('f-status').addEventListener('change', render);
    document.getElementById('f-clear').addEventListener('click', () => {
      document.getElementById('f-search').value = '';
      document.getElementById('f-status').value = 'all';
      render();
    });
    document.getElementById('completed-search').addEventListener('input', renderCompletedPanel);

    async function load() {
      const list = document.getElementById('ref-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        allRefunds = await listRefunds();
        render();
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    /** Completed refunds move out of the main table entirely and live in the
     * right-side panel instead — a compact, click-to-expand list keyed by Order ID
     * rather than another wide row of columns. */
    function renderCompletedPanel() {
      const box = document.getElementById('completed-list');
      const q = document.getElementById('completed-search').value.trim().toLowerCase();
      let completed = allRefunds.filter((r) => r.status === 'Completed');
      if (q) completed = completed.filter((r) => (r.order_reference || '').toLowerCase().includes(q));
      if (!completed.length) { box.innerHTML = '<p class="muted">No completed refunds yet.</p>'; return; }

      box.innerHTML = completed.map((r) => {
        const photos = r.refund_attachments || [];
        const isOpen = openCompletedId === r.id;
        return '<div class="completed-item">' +
          '<button type="button" class="completed-orderid" data-toggle-completed="' + r.id + '">' + esc(r.order_reference || '(no Order ID) — ' + r.customer_name) + '</button>' +
          (isOpen ? '<div class="completed-detail">' +
            '<div><b>Customer:</b> ' + esc(r.customer_name) + '</div>' +
            '<div><b>Item:</b> ' + esc(r.item_description || '—') + '</div>' +
            '<div><b>Date Purchased:</b> ' + (r.purchase_date || '—') + '</div>' +
            '<div><b>Reason:</b> ' + esc(r.reason || '—') + '</div>' +
            '<div><b>Amount:</b> ' + money(r.refund_amount) + '</div>' +
            '<div><b>Method:</b> ' + esc(r.refund_method) + '</div>' +
            '<div><b>Payout Account:</b> ' + (r.account_name || r.account_number ? esc(r.account_name || '') + (r.account_number ? ' · ' + esc(r.account_number) : '') : '—') + '</div>' +
            '<div><b>Requested by:</b> ' + (r.creator ? esc(r.creator.full_name) : '—') + '</div>' +
            '<div style="margin-top:4px;"><b>Proof of Payment:</b><br>' +
              (photos.length
                ? photos.map((a) => '<div>' + money(a.amount) + ' <button class="btn small secondary" data-view-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">View</button></div>').join('')
                : 'None') +
            '</div>' +
            '<button class="btn small secondary" type="button" data-id="' + r.id + '" data-act="reopen" style="margin-top:8px;">Reopen</button>' +
          '</div>' : '') +
        '</div>';
      }).join('');

      box.querySelectorAll('[data-toggle-completed]').forEach((btn) => btn.addEventListener('click', () => {
        const id = Number(btn.dataset.toggleCompleted);
        openCompletedId = openCompletedId === id ? null : id;
        renderCompletedPanel();
      }));
      box.querySelectorAll('[data-view-id]').forEach((btn) => btn.addEventListener('click', async () => {
        try { window.open(await getRefundAttachmentUrl(btn.dataset.path), '_blank'); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));
      box.querySelectorAll('[data-act="reopen"]').forEach((btn) => btn.addEventListener('click', async () => {
        try { await setRefundStatus(btn.dataset.id, 'Approved'); toast('ref-msg', 'Reopened to Approved.', false); openCompletedId = null; await load(); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));
    }

    function render() {
      const fSearch = document.getElementById('f-search').value.trim().toLowerCase();
      const fStatus = document.getElementById('f-status').value;
      let filtered = allRefunds;
      if (fSearch) filtered = filtered.filter((r) =>
        r.customer_name.toLowerCase().includes(fSearch) ||
        (r.order_reference || '').toLowerCase().includes(fSearch) ||
        (r.item_description || '').toLowerCase().includes(fSearch));
      if (fStatus !== 'all') filtered = filtered.filter((r) => r.status === fStatus);

      const pendingCount = filtered.filter((r) => r.status === 'Pending Approval').length;
      const approvedCount = filtered.filter((r) => r.status === 'Approved').length;
      const completedTotal = allRefunds.filter((r) => r.status === 'Completed').reduce((s, r) => s + Number(r.refund_amount || 0), 0);
      // Completed refunds live in the right-side panel, not this table.
      const rows = filtered.filter((r) => r.status !== 'Completed');
      document.getElementById('ref-tiles').innerHTML =
        tile(String(pendingCount), 'Pending Approval') + tile(String(approvedCount), 'Approved') + tile(money(completedTotal), 'Total Refunded') + tile(String(rows.length), 'Count');

      renderCompletedPanel();

      const list = document.getElementById('ref-list');
      if (!rows.length) { list.innerHTML = '<p class="muted">No refunds for this filter.</p>'; return; }
      list.innerHTML = '<div class="table-scroll"><table><tr><th>Customer</th><th>Order ID</th><th>Date Purchased</th><th>Item</th><th>Reason</th><th>Amount</th><th>Method</th><th>Payout Account</th><th>Status</th><th>Proof of Payment</th><th></th></tr>' +
        rows.map((r) => {
          const photos = r.refund_attachments || [];
          const paidSoFar = photos.reduce((s, a) => s + Number(a.amount || 0), 0);
          const remaining = Number(r.refund_amount || 0) - paidSoFar;
          const canAttach = r.status !== 'Pending Approval';
          const canComplete = r.status === 'Approved' && remaining <= 0;
          return '<tr>' +
            '<td data-label="Customer">' + esc(r.customer_name) +
              (r.creator ? '<div class="muted" style="font-size:10px;margin-top:2px;">Requested by ' + esc(r.creator.full_name) + '</div>' : '') +
            '</td>' +
            '<td data-label="Order ID">' + esc(r.order_reference || '') + '</td>' +
            '<td data-label="Date Purchased">' + (r.purchase_date || '—') + '</td>' +
            '<td data-label="Item">' + esc(r.item_description || '') + '</td>' +
            '<td data-label="Reason">' + esc(r.reason || '') + '</td>' +
            '<td data-label="Amount">' + money(r.refund_amount) +
              (photos.length ? '<div class="muted" style="font-size:10px;margin-top:2px;">Paid ' + money(paidSoFar) + (remaining > 0 ? ' · ' + money(remaining) + ' left' : ' · fully covered') + '</div>' : '') +
            '</td>' +
            '<td data-label="Method">' + esc(r.refund_method) + '</td>' +
            '<td data-label="Payout Account">' + (r.account_name || r.account_number ? esc(r.account_name || '') + (r.account_number ? ' · ' + esc(r.account_number) : '') : '—') + '</td>' +
            '<td data-label="Status"><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
            '<td data-label="Proof of Payment">' +
              (photos.length
                ? photos.map((a, i) => '<div style="margin-bottom:2px;">' + money(a.amount) + ' <button class="btn small secondary" data-view-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">View</button> <button class="btn small secondary" data-remove-id="' + a.id + '" data-path="' + esc(a.attachment_path) + '">✕</button></div>').join('')
                : '<span class="muted">None yet</span>') +
              (canAttach
                ? (openAddProofFor === r.id
                    ? '<form class="add-proof-form" data-refund-id="' + r.id + '" style="display:flex;flex-direction:column;gap:4px;margin-top:6px;max-width:180px;">' +
                        '<input type="number" name="amount" step="0.01" min="0.01" placeholder="Amount paid" required style="padding:5px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">' +
                        '<input type="file" name="photo" accept="image/*" required style="font-size:11px;">' +
                        '<div><button class="btn small" type="submit">Save</button> <button class="btn small secondary" type="button" data-cancel-proof="1">Cancel</button></div>' +
                      '</form>'
                    : '<button type="button" class="btn small secondary" data-open-proof="' + r.id + '" style="margin-top:4px;">+ Add Proof of Payment</button>')
                : '<div class="muted" style="font-size:11px;">Approve first</div>') +
            '</td>' +
            '<td data-label="Actions" style="white-space:nowrap;">' +
              (r.status === 'Pending Approval' ? '<button class="btn small" data-id="' + r.id + '" data-act="approve">Approve</button> ' : '') +
              (r.status === 'Approved' ? (canComplete
                  ? '<button class="btn small" data-id="' + r.id + '" data-act="complete">Mark Completed</button> '
                  : '<span class="muted" style="font-size:11px;">' + money(remaining) + ' left to refund</span> ')
                : '') +
              '<button class="btn small secondary" data-id="' + r.id + '" data-act="delete">Delete</button>' +
            '</td>' +
          '</tr>';
        }).join('') + '</table></div>';

      list.querySelectorAll('[data-act]').forEach((btn) => btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        try {
          if (btn.dataset.act === 'approve') { await setRefundStatus(id, 'Approved'); toast('ref-msg', 'Approved.', false); await load(); }
          else if (btn.dataset.act === 'complete') { await setRefundStatus(id, 'Completed'); toast('ref-msg', 'Marked completed.', false); await load(); }
          else if (btn.dataset.act === 'reopen') { await setRefundStatus(id, 'Approved'); toast('ref-msg', 'Reopened to Approved.', false); await load(); }
          else if (btn.dataset.act === 'delete') { if (!confirm('Delete this refund?')) return; await deleteRefund(id); toast('ref-msg', 'Deleted.', false); await load(); }
        } catch (err) {
          toast('ref-msg', String(err.message || err), true);
        }
      }));

      list.querySelectorAll('[data-view-id]').forEach((btn) => btn.addEventListener('click', async () => {
        try { window.open(await getRefundAttachmentUrl(btn.dataset.path), '_blank'); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));

      list.querySelectorAll('[data-remove-id]').forEach((btn) => btn.addEventListener('click', async () => {
        if (!confirm('Remove this proof of payment?')) return;
        try { await removeRefundAttachment(btn.dataset.removeId, btn.dataset.path); toast('ref-msg', 'Removed.', false); await load(); }
        catch (err) { toast('ref-msg', String(err.message || err), true); }
      }));

      list.querySelectorAll('[data-open-proof]').forEach((btn) => btn.addEventListener('click', () => {
        openAddProofFor = Number(btn.dataset.openProof);
        render();
      }));

      list.querySelectorAll('[data-cancel-proof]').forEach((btn) => btn.addEventListener('click', () => {
        openAddProofFor = null;
        render();
      }));

      list.querySelectorAll('.add-proof-form').forEach((form) => form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const refundId = form.dataset.refundId;
        const file = form.photo.files[0];
        const amount = Number(form.amount.value);
        try {
          await addRefundAttachment(refundId, amount, file);
          toast('ref-msg', 'Proof of payment added.', false);
          openAddProofFor = null;
          await load();
        } catch (err) {
          toast('ref-msg', String(err.message || err), true);
        }
      }));
    }

    function tile(num, label) { return '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>'; }
  }
}
</script>
</body>
</html>
