<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refunds — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20260922e">
</head>
<body>
<main>
  <div id="ref-msg"></div>
  <!-- Same Form Drawer / Detail Drawer flow as the other modules (Ren's spec 271-288):
       primary action at the top, Summary tiles, Search & Filters and the active-filter
       strip, then the records. Requesting happens in the form drawer; a refund's full
       details, its proof-of-payment photos and the approve/complete/reopen/delete
       actions live in the detail drawer. Anyone can request; only the approval group
       sees other people's refunds and the approver actions (RLS + has_refund_approval_
       access() enforce that server-side -- this page just mirrors it). -->
  <div class="module-topbar"><div></div><div style="text-align:right;">
    <button type="button" class="btn" id="ref-new-btn">+ New Refund Request</button>
  </div></div>
  <div class="tiles" id="ref-tiles"></div>
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="Customer, order ID, item…"></div>
      <div class="field"><label>Status</label><select id="f-status"><option value="all">All Statuses</option><option>Pending Approval</option><option>Approved</option><option>Completed</option></select></div>
      <div class="field"><label>Requested From</label><input type="date" id="f-from"></div>
      <div class="field"><label>Requested To</label><input type="date" id="f-to"></div>
      <span id="ref-sort-slot"></span>
      <button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>
    </div>
  </div>
  <div id="ref-active-filters"></div>

  <h3 style="margin:0 0 8px;" id="ref-list-heading">Active</h3>
  <div id="ref-list"><div class="muted">Loading…</div></div>

  <details class="card exp" style="margin-top:16px;">
    <summary><span class="exp-arrow" aria-hidden="true">▸</span>Completed <span class="exp-count" id="ref-completed-count"></span></summary>
    <div class="exp-body" id="ref-completed"></div>
  </details>

  <div class="drawer-backdrop" id="ref-form-backdrop"></div>
  <div class="drawer" id="ref-form-drawer">
    <div class="drawer-header"><h3>New Refund Request</h3><button type="button" class="drawer-close" id="ref-form-close" aria-label="Close">✕</button></div>
    <div class="drawer-body">
      <p class="muted" style="margin-top:0;">Submit here — an approver will review it. A photo is optional (e.g. proof of purchase or the item itself); proof of payment is attached by the approver after approval, once it's actually paid out.</p>
      <form id="ref-form" style="display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;">
        <div class="drawer-section">
          <h4>Customer</h4>
          <div class="field"><label>Name *</label><input type="text" name="customerName" required></div>
          <div class="field"><label>Order ID</label><input type="text" name="orderReference"></div>
          <div class="field"><label>Date Purchased</label><input type="date" name="purchaseDate"></div>
          <div class="field"><label>Date Requested</label><input type="date" name="dateRequested"></div>
        </div>
        <div class="drawer-section">
          <h4>Refund</h4>
          <div class="field"><label>Item</label><input type="text" name="itemDescription"></div>
          <div class="field"><label>Reason</label><input type="text" name="reason"></div>
          <div class="field"><label>Amount to Refund (PHP) *</label><input type="number" name="refundAmount" step="0.01" min="0.01" required></div>
          <div class="field"><label>Refund Method *</label><select name="refundMethod" required><option>GCash</option><option>BDO</option><option>Maya</option><option>BPI</option><option>GoTyme</option><option>Maribank</option><option>Union Bank</option></select></div>
          <div class="field"><label>Account Name</label><input type="text" name="accountName" placeholder="Payout account name"></div>
          <div class="field"><label>Account Number</label><input type="text" name="accountNumber" placeholder="Payout account number"></div>
        </div>
        <div class="drawer-section">
          <h4>Notes &amp; Photo</h4>
          <div class="field"><label>Notes</label><input type="text" name="notes"></div>
          <div class="field"><label>Photo (optional)</label><input type="file" name="requestPhoto" accept="image/*"></div>
        </div>
      </form>
    </div>
    <div class="drawer-footer">
      <button class="btn" type="submit" form="ref-form" id="ref-submit-btn">Add Refund Request</button>
      <button type="button" class="btn secondary" id="ref-form-cancel">Cancel</button>
    </div>
  </div>
  <div class="drawer-backdrop" id="ref-detail-backdrop"></div>
  <div class="drawer" id="ref-detail-drawer">
    <div class="drawer-header"><div><h3 id="ref-detail-title">Refund Details</h3><div class="muted" id="ref-detail-sub"></div></div><button type="button" class="drawer-close" id="ref-detail-close" aria-label="Close">✕</button></div>
    <div class="drawer-body" id="ref-detail-body"></div>
  </div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js?v=20260922e';
import { listRefunds, createRefund, uploadRefundRequestPhoto, setRefundStatus, deleteRefund, addRefundAttachment, removeRefundAttachment, getRefundAttachmentUrl, subscribeToChanges } from './js/api.js?v=20260922e';
import { activeFiltersHtml, emptyStateHtml, wireProxyButtons, sortControlHtml, wireSortControl, applySort, byText, byNumber, byDate, localDateStr } from './js/uiKit.js?v=20260922e';

// Global Filter + Sort rules (Ren, 2026-09-21, section 16: Payment History) -- one
// shared Sort control replaces the old per-column header-click sort below, which
// silently stopped working once this table collapses to header-less cards on mobile.
const REF_SORT_FIELDS = [
  { key: 'date_requested', label: 'Requested Date' }, { key: 'order_reference', label: 'Order ID' },
  { key: 'customer_name', label: 'Customer' }, { key: 'status', label: 'Status' },
  { key: 'refund_amount', label: 'Amount' }, { key: 'refund_method', label: 'Payment Method' },
];
const REF_SORT_COMPARATORS = {
  date_requested: byDate('date_requested'), order_reference: byText('order_reference'), customer_name: byText('customer_name'),
  status: byText('status'), refund_amount: byNumber('refund_amount'), refund_method: byText('refund_method'),
};

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const STATUS_BADGE = { 'Pending Approval': 'pending', 'Approved': 'transit', 'Completed': 'ok' };
const tile = (num, label) => '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
const paidOf = (r) => (r.refund_attachments || []).reduce((s, a) => s + Number(a.amount || 0), 0);

/** Same customer name + same Order ID on more than one refund is almost always a
 * double-submission or a double claim -- flagged in red wherever that name shows up,
 * across every status, so an approver notices before paying it out twice. */
function duplicateKeySet(rows) {
  const counts = {};
  rows.forEach((r) => { const k = dupKey(r); counts[k] = (counts[k] || 0) + 1; });
  return new Set(Object.keys(counts).filter((k) => counts[k] > 1));
}
const dupKey = (r) => r.customer_name.trim().toLowerCase() + '|' + (r.order_reference || '').trim().toLowerCase();
const dupWarn = (r, dupKeys, text) => dupKeys.has(dupKey(r))
  ? '<span style="color:var(--warn);font-weight:bold;" title="Possible duplicate: same Order ID + name appears more than once">' + text + ' ⚠</span>' : text;

// Approval group: Admin/Manager/Branch Supervisor (role), Operations Supervisor/
// Inventory Supervisor/Admin Assistant (position), or the per-employee
// refund_approval_access flag -- mirrors has_refund_approval_access(). The same
// position-manager group can delete a refund / remove a wrong attachment
// (can_edit_refund()).
const POSITION_MANAGERS = ['Operations Supervisor', 'Inventory Supervisor', 'Admin Assistant'];
const canApprove = (emp) => ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role) || POSITION_MANAGERS.includes(emp.position) || !!emp.refund_approval_access;
const canEditRefund = (emp) => ['Admin', 'Manager', 'Branch Supervisor'].includes(emp.role) || POSITION_MANAGERS.includes(emp.position);

const employee = await initShell('refunds');
if (employee) {
  const approver = canApprove(employee);
  const editor = canEditRefund(employee);
  let allRefunds = [];
  let openDetailId = null;
  const sort = { field: 'date_requested', dir: 'desc' };
  document.getElementById('ref-sort-slot').outerHTML = sortControlHtml(REF_SORT_FIELDS, sort, 'ref-sort-field', 'ref-sort-dir');
  wireSortControl('ref-sort-field', 'ref-sort-dir', sort, render);

  if (!approver) document.getElementById('ref-list-heading').textContent = 'My Refund Requests';
  const form = document.getElementById('ref-form');
  form.dateRequested.value = localDateStr();

  // ---- form drawer ----
  function openFormDrawer() {
    document.getElementById('ref-form-backdrop').classList.add('open');
    document.getElementById('ref-form-drawer').classList.add('open');
  }
  function closeFormDrawer() {
    document.getElementById('ref-form-backdrop').classList.remove('open');
    document.getElementById('ref-form-drawer').classList.remove('open');
  }
  document.getElementById('ref-new-btn').addEventListener('click', openFormDrawer);
  document.getElementById('ref-form-close').addEventListener('click', closeFormDrawer);
  document.getElementById('ref-form-cancel').addEventListener('click', closeFormDrawer);
  document.getElementById('ref-form-backdrop').addEventListener('click', closeFormDrawer);

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    // The submit button lives in .drawer-footer (form="ref-form"), outside this <form>
    // element's own subtree, so it's reached by its own id.
    const btn = document.getElementById('ref-submit-btn');
    btn.disabled = true;
    try {
      const newId = await createRefund({
        customerName: f.customerName.value.trim(), orderReference: f.orderReference.value.trim(),
        purchaseDate: f.purchaseDate.value || null, dateRequested: f.dateRequested.value || null,
        itemDescription: f.itemDescription.value.trim(), reason: f.reason.value.trim(), refundMethod: f.refundMethod.value,
        accountName: f.accountName.value.trim(), accountNumber: f.accountNumber.value.trim(),
        refundAmount: Number(f.refundAmount.value), notes: f.notes.value.trim(),
      });
      if (f.requestPhoto.files[0]) await uploadRefundRequestPhoto(newId, f.requestPhoto.files[0]);
      toast('ref-msg', 'Refund request added — pending approval.', false);
      f.reset();
      f.dateRequested.value = localDateStr();
      closeFormDrawer();
      await load();
      // The same drawer system now shows the saved request (spec 273).
      if (newId != null) { openDetailId = newId; openDetail(newId); }
    } catch (err) {
      toast('ref-msg', String(err.message || err), true);
    } finally {
      btn.disabled = false;
    }
  });

  // ---- detail drawer ----
  function closeDetailDrawer() {
    document.getElementById('ref-detail-backdrop').classList.remove('open');
    document.getElementById('ref-detail-drawer').classList.remove('open');
  }
  document.getElementById('ref-detail-close').addEventListener('click', closeDetailDrawer);
  document.getElementById('ref-detail-backdrop').addEventListener('click', closeDetailDrawer);
  function openDetail(id) {
    const r = allRefunds.find((x) => String(x.id) === String(id));
    if (!r) return;
    // .textContent escapes on its own -- esc() here would double-escape.
    document.getElementById('ref-detail-title').textContent = (r.order_reference ? 'Order #' + r.order_reference + ' — ' : '') + r.customer_name;
    document.getElementById('ref-detail-sub').textContent = r.status + ' · ' + money(r.refund_amount) + ' via ' + r.refund_method;
    const body = document.getElementById('ref-detail-body');
    body.innerHTML = renderDetailBody(r);
    wireDetailBody(body, r);
    document.getElementById('ref-detail-backdrop').classList.add('open');
    document.getElementById('ref-detail-drawer').classList.add('open');
  }
  function refreshDetailIfOpen(id) {
    if (!document.getElementById('ref-detail-drawer').classList.contains('open')) return;
    if (!allRefunds.find((x) => String(x.id) === String(id))) { closeDetailDrawer(); return; }
    openDetail(id);
  }

  async function load() {
    const list = document.getElementById('ref-list');
    list.innerHTML = '<div class="muted">Loading…</div>';
    try {
      allRefunds = await listRefunds(); // RLS: every row for approvers, only their own for everyone else
      render();
      if (openDetailId != null) refreshDetailIfOpen(openDetailId);
    } catch (err) {
      list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  // ---- filters + lists ----
  function currentFilters() {
    return {
      q: document.getElementById('f-search').value.trim().toLowerCase(),
      status: document.getElementById('f-status').value,
      from: document.getElementById('f-from').value,
      to: document.getElementById('f-to').value,
    };
  }
  function rowHtml(r, dupKeys) {
    const paid = paidOf(r);
    const remaining = Number(r.refund_amount || 0) - paid;
    return '<tr' + (r.status === 'Pending Approval' ? ' style="background:#fff8e8;"' : '') + '>' +
      '<td data-label="Order ID">' + dupWarn(r, dupKeys, esc(r.order_reference || '(no Order ID)')) + '</td>' +
      '<td data-label="Customer" class="full-row">' + dupWarn(r, dupKeys, esc(r.customer_name)) +
        '<div class="muted" style="font-size:10px;">' + esc(r.item_description || '') + (r.reason ? ' · ' + esc(r.reason) : '') + '</div></td>' +
      '<td data-label="Status"><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
      '<td data-label="Requested">' + (r.date_requested || '—') + '</td>' +
      '<td data-label="Amount">' + money(r.refund_amount) +
        ((r.refund_attachments || []).length ? '<div class="muted" style="font-size:10px;">' + money(paid) + (remaining > 0 ? ' paid · ' + money(remaining) + ' left' : ' paid · covered') + '</div>' : '') + '</td>' +
      '<td data-label="Method">' + esc(r.refund_method) + '</td>' +
      '<td class="full-row"><button type="button" class="btn small secondary" data-act="view-details" data-id="' + r.id + '">View Details</button></td>' +
    '</tr>';
  }
  // Filtering already picked which rows are in play; sort only reorders them
  // (section 11), applied once here so Active and Completed stay in sync.
  const tableHtml = (rows, dupKeys) => '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
    '<colgroup><col style="width:14%"><col style="width:26%"><col style="width:14%"><col style="width:12%"><col style="width:12%"><col style="width:10%"><col style="width:12%"></colgroup>' +
    '<thead><tr><th>Order ID</th><th>Customer</th><th>Status</th><th>Requested</th><th>Amount</th><th>Method</th><th></th></tr></thead>' +
    '<tbody>' + applySort(rows, sort, REF_SORT_COMPARATORS).map((r) => rowHtml(r, dupKeys)).join('') + '</tbody></table></div>';

  function render() {
    const f = currentFilters();
    let filtered = allRefunds;
    if (f.q) filtered = filtered.filter((r) => r.customer_name.toLowerCase().includes(f.q) || (r.order_reference || '').toLowerCase().includes(f.q) || (r.item_description || '').toLowerCase().includes(f.q));
    if (f.status !== 'all') filtered = filtered.filter((r) => r.status === f.status);
    if (f.from) filtered = filtered.filter((r) => r.date_requested && r.date_requested >= f.from);
    if (f.to) filtered = filtered.filter((r) => r.date_requested && r.date_requested <= f.to);
    const hasFilters = !!(f.q || f.status !== 'all' || f.from || f.to);

    const active = filtered.filter((r) => r.status !== 'Completed');
    const completed = filtered.filter((r) => r.status === 'Completed');
    const dupKeys = duplicateKeySet(allRefunds);

    // Tiles, the active-filter strip, both lists and the folder count follow the same
    // filters (MASTER UI rules 6/19/20/28).
    const sum = (rows, fn) => rows.reduce((s, r) => s + fn(r), 0);
    document.getElementById('ref-tiles').innerHTML = approver
      ? tile(active.length, 'Qty') + tile(money(sum(active, (r) => Number(r.refund_amount || 0))), 'Total Amount (Pending + Approved)') +
        tile(money(sum(active, paidOf)), 'Total Paid') + tile(money(sum(active, (r) => Math.max(Number(r.refund_amount || 0) - paidOf(r), 0))), 'Total Remaining') +
        tile(active.filter((r) => r.status === 'Pending Approval').length, 'Pending Approval') + tile(active.filter((r) => r.status === 'Approved').length, 'Approved') +
        tile(money(sum(completed, (r) => Number(r.refund_amount || 0))), 'Total Refunded')
      : tile(filtered.length, 'Qty') + tile(money(sum(filtered, (r) => Number(r.refund_amount || 0))), 'Total Requested') + tile(money(sum(filtered, paidOf)), 'Total Paid');
    const activeEl = document.getElementById('ref-active-filters');
    activeEl.innerHTML = activeFiltersHtml([
      { label: 'Search', value: esc(f.q) }, { label: 'Status', value: esc(f.status) },
      { label: 'Requested From', value: esc(f.from) }, { label: 'Requested To', value: esc(f.to) },
    ], 'f-clear');
    wireProxyButtons(activeEl);

    const list = document.getElementById('ref-list');
    list.innerHTML = active.length ? tableHtml(active, dupKeys)
      : emptyStateHtml({ message: hasFilters ? 'No refunds match these filters.' : (approver ? 'No pending or approved refunds.' : 'No refund requests yet.'), hasFilters, clearId: 'f-clear', createLabel: '+ New Refund Request', createId: 'ref-new-btn' });
    wireProxyButtons(list);

    document.getElementById('ref-completed-count').textContent = '(' + completed.length + (completed.length ? ' · ' + money(sum(completed, (r) => Number(r.refund_amount || 0))) : '') + ')';
    const completedBox = document.getElementById('ref-completed');
    completedBox.innerHTML = completed.length ? tableHtml(completed, dupKeys)
      : emptyStateHtml({ message: hasFilters ? 'No completed refunds match these filters.' : 'No completed refunds yet.', hasFilters, clearId: 'f-clear' });
    wireProxyButtons(completedBox);

    document.querySelectorAll('[data-act="view-details"]').forEach((btn) => btn.addEventListener('click', () => { openDetailId = btn.dataset.id; openDetail(openDetailId); }));
  }

  // ---- detail drawer body ----
  const kv = (label, value) => value ? '<div class="drawer-kv"><span>' + label + '</span><b>' + value + '</b></div>' : '';
  function renderDetailBody(r) {
    const dupKeys = duplicateKeySet(allRefunds);
    const photos = r.refund_attachments || [];
    const paid = paidOf(r);
    const remaining = Number(r.refund_amount || 0) - paid;
    const canAttach = approver && r.status !== 'Pending Approval';
    const canComplete = r.status === 'Approved' && remaining <= 0;
    let actions = '';
    if (approver) {
      if (r.status === 'Pending Approval') actions += '<button type="button" class="btn small" data-act="approve">Approve</button> ';
      if (r.status === 'Approved') actions += canComplete
        ? '<button type="button" class="btn small" data-act="complete">Mark Completed</button> '
        : '<span class="muted" style="font-size:11px;">' + money(remaining) + ' still to pay out before this can be completed</span> ';
      if (r.status === 'Completed') actions += '<button type="button" class="btn small secondary" data-act="reopen">Reopen</button> ';
      if (editor) actions += '<button type="button" class="btn small secondary" data-act="delete">Delete</button>';
    }
    return '<div class="drawer-section"><h4>Request</h4>' +
      '<div class="drawer-kv"><span>Customer</span><b>' + dupWarn(r, dupKeys, esc(r.customer_name)) + '</b></div>' +
      '<div class="drawer-kv"><span>Order ID</span><b>' + dupWarn(r, dupKeys, esc(r.order_reference || '—')) + '</b></div>' +
      kv('Item', esc(r.item_description || '')) + kv('Reason', esc(r.reason || '')) +
      '<div class="drawer-kv"><span>Date Purchased</span><b>' + (r.purchase_date || '—') + '</b></div>' +
      '<div class="drawer-kv"><span>Date Requested</span><b>' + (r.date_requested || '—') + '</b></div>' +
      '<div class="drawer-kv"><span>Status</span><b><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></b></div>' +
      '<div class="drawer-kv"><span>Requested By</span><b>' + esc(r.creator ? r.creator.full_name : '—') + '</b></div>' +
      '<div class="drawer-kv"><span>Approved By</span><b>' + esc(r.approver ? r.approver.full_name : '—') + '</b></div>' +
      kv('Notes', esc(r.notes || '')) +
      (r.request_attachment_path ? '<div style="margin-top:8px;"><button type="button" class="btn small secondary" data-view-path="' + esc(r.request_attachment_path) + '">View Request Photo</button></div>' : '') +
    '</div>' +
    '<div class="drawer-section"><h4>Refund</h4>' +
      '<div class="drawer-kv"><span>Amount</span><b>' + money(r.refund_amount) + '</b></div>' +
      '<div class="drawer-kv"><span>Method</span><b>' + esc(r.refund_method) + '</b></div>' +
      kv('Account Name', esc(r.account_name || '')) + kv('Account Number', esc(r.account_number || '')) +
      '<div class="drawer-kv"><span>Paid So Far</span><b>' + money(paid) + '</b></div>' +
      '<div class="drawer-kv"><span>Remaining</span><b style="color:' + (remaining > 0 ? '#b23c3c' : 'var(--ok)') + ';">' + money(Math.max(remaining, 0)) + '</b></div>' +
    '</div>' +
    '<div class="drawer-section"><h4>Proof of Payment</h4>' +
      (photos.length
        ? photos.map((a) => '<div class="payment-line">' +
            '<div>' + money(a.amount) + (a.reference_number ? ' · Ref ' + esc(a.reference_number) : '') + '</div>' +
            '<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">' +
              (a.attachment_path ? '<button type="button" class="btn small secondary" data-view-path="' + esc(a.attachment_path) + '">View Photo</button>' : '<span class="muted" style="font-size:11px;">(no photo)</span>') +
              (editor ? '<button type="button" class="btn small secondary" data-remove-id="' + a.id + '" data-path="' + esc(a.attachment_path || '') + '">Remove</button>' : '') +
            '</div></div>').join('')
        : '<p class="muted" style="margin:0;">None yet.</p>') +
      (canAttach
        ? '<form id="ref-proof-form" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">' +
            '<div class="field"><label>Amount Paid (PHP) *</label><input type="number" name="amount" step="0.01" min="0.01" required></div>' +
            '<div class="field"><label>Reference *</label><input type="text" name="referenceNumber" required></div>' +
            '<div class="field"><label>Photo</label><input type="file" name="photo" accept="image/*"></div>' +
            '<button class="btn small" type="submit" style="align-self:flex-start;">Add Proof of Payment</button>' +
          '</form>'
        : (approver && r.status === 'Pending Approval' ? '<p class="muted" style="margin:8px 0 0;font-size:11px;">Approve first to record a payout.</p>' : '')) +
    '</div>' +
    (actions ? '<div class="drawer-section"><h4>Actions</h4>' + actions + '</div>' : '');
  }

  function wireDetailBody(container, r) {
    const done = async (msg) => { toast('ref-msg', msg, false); await load(); };
    const fail = (err) => toast('ref-msg', String(err.message || err), true);
    container.querySelectorAll('[data-view-path]').forEach((btn) => btn.addEventListener('click', async () => {
      try { window.open(await getRefundAttachmentUrl(btn.dataset.viewPath), '_blank'); } catch (err) { fail(err); }
    }));
    container.querySelector('[data-act="approve"]')?.addEventListener('click', async () => { try { await setRefundStatus(r.id, 'Approved'); done('Approved.'); } catch (err) { fail(err); } });
    container.querySelector('[data-act="complete"]')?.addEventListener('click', async () => { try { await setRefundStatus(r.id, 'Completed'); done('Marked completed.'); } catch (err) { fail(err); } });
    container.querySelector('[data-act="reopen"]')?.addEventListener('click', async () => { try { await setRefundStatus(r.id, 'Approved'); done('Reopened to Approved.'); } catch (err) { fail(err); } });
    container.querySelector('[data-act="delete"]')?.addEventListener('click', async () => {
      if (!confirm('Delete this refund?')) return;
      try { await deleteRefund(r.id); closeDetailDrawer(); done('Deleted.'); } catch (err) { fail(err); }
    });
    container.querySelectorAll('[data-remove-id]').forEach((btn) => btn.addEventListener('click', async () => {
      if (!confirm('Remove this proof of payment?')) return;
      try { await removeRefundAttachment(btn.dataset.removeId, btn.dataset.path); done('Removed.'); } catch (err) { fail(err); }
    }));
    container.querySelector('#ref-proof-form')?.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      const amount = Number(f.amount.value);
      const save = f.querySelector('button[type=submit]');
      save.disabled = true;
      try {
        await addRefundAttachment(r.id, amount, f.photo.files[0], f.referenceNumber.value.trim());
        // Auto-complete once the attached proof fully covers the refund amount -- the
        // manual "Mark Completed" stays as a fallback for edge cases.
        if (r.status === 'Approved' && paidOf(r) + amount >= Number(r.refund_amount || 0)) await setRefundStatus(r.id, 'Completed');
        done('Proof of payment added.');
      } catch (err) { fail(err); save.disabled = false; }
    });
  }

  document.getElementById('f-search').addEventListener('input', render);
  ['f-status', 'f-from', 'f-to'].forEach((id) => document.getElementById(id).addEventListener('change', render));
  document.getElementById('f-clear').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-status').value = 'all';
    document.getElementById('f-from').value = '';
    document.getElementById('f-to').value = '';
    render();
  });

  // A clicked activity notification opens the refund here in place (spec 321), or via
  // ?open=<id> when arriving from another page.
  window.__kmOpenRecord = (table, id) => { if (table !== 'refunds') return false; openDetailId = id; openDetail(id); return true; };

  await load();
  const deepLinkId = new URLSearchParams(window.location.search).get('open');
  if (deepLinkId) { openDetailId = deepLinkId; openDetail(deepLinkId); }
  subscribeToChanges(['refunds', 'refund_attachments'], load);
}
</script>
</body>
</html>
