<body>
<main id="sd-root"><p class="muted">Loading…</p></main>

<script type="module">
import { initShell } from './js/shell.js?v=20261007c';
import { startDashboardPage } from './js/sdPage.js?v=20261007c';

// Open to anyone holding the "Sales & Profit Dashboard — open" key (Position Access Matrix > Dashboard). What each person sees inside it follows the other
// dashboard keys (sales, profit, cost, capital, expenses, stock, branches, export, settings) and is enforced by the database: a figure someone may not see is never sent.
const employee = await initShell('sales-dashboard');
if (employee) {
  await startDashboardPage({ root: document.getElementById('sd-root'), employee });
}
</script>
