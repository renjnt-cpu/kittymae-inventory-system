<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="center-screen" id="screen">
  <div>
    <h2>💎 Kittymae Jewels System</h2>
    <p class="muted">Sign in with your Google account to continue.</p>
    <button class="btn" id="google-btn">Sign in with Google</button>
    <div id="msg" style="margin-top:16px;"></div>
  </div>
</div>

<script type="module">
import { supabase } from './js/supabaseClient.js';
import { signInWithGoogle, linkEmployee } from './js/auth.js';

document.getElementById('google-btn').addEventListener('click', async () => {
  try { await signInWithGoogle(); }
  catch (err) { showError(String(err.message || err)); }
});

function showError(text) {
  document.getElementById('msg').innerHTML = '<div class="msg error">' + text + '</div>';
}

// If we land here already signed in (e.g. OAuth redirect came back to login.html, or a
// stale tab), try to link + go straight to the dashboard instead of showing the button.
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  try {
    await linkEmployee();
    window.location.href = 'dashboard.html';
  } catch (err) {
    const msg = String(err.message || err);
    if (msg.startsWith('NOT_REGISTERED')) {
      document.getElementById('screen').innerHTML =
        '<div><h2>Not registered yet</h2><p>Signed in as <b>' + session.user.email + '</b>, but you\'re not in the Employees list.</p>' +
        '<p class="muted">Ask an Admin to add you, then sign in again.</p></div>';
    } else if (msg.startsWith('INACTIVE')) {
      document.getElementById('screen').innerHTML = '<div><h2>Account inactive</h2><p>Your record is marked Inactive. Contact an Admin.</p></div>';
    } else {
      showError(msg);
    }
  }
}
</script>
</body>
</html>
