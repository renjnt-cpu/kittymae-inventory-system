<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Monitoring — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="im-msg"></div>
  <div id="im-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import {
  getBranches, listStockByBranch, searchProducts, logCycleCount, listRecentCycleCounts,
  markCycleCountInvestigated, listLatestCycleCountBySkuBranch, listProductChangeLog,
  listFactoryPurchases, recordFactoryPurchase, subscribeToChanges,
} from './js/api.js';
import { branchBadge, branchOptionStyle } from './js/branchColors.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const weight = (n) => n === null || n === undefined ? '—' : Number(n).toLocaleString('en-PH', { minimumFractionDigits: 3 }) + ' g';
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('en-PH', { dateStyle: 'medium' }) : '—';
const fmtDateTime = (s) => s ? new Date(s).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const PRODUCT_CHANGE_BADGE = { Added: 'ok', Edited: 'transit', Discontinued: 'low', Reactivated: 'ok' };

// Same cadence-by-Value-Tier mapping as the old sheet's rebuildStockByBranchGrid():
// A = weekly, B = monthly, C = quarterly, anything else defaults to monthly.
const CADENCE_DAYS = { A: 7, B: 30, C: 90 };
function cadenceForTier(tier) { return CADENCE_DAYS[tier] || 30; }

// Same branch-scope rule as assert_can_act_on_branch() -- whole staff can log a count
// for their own branch; this group (plus Admin/Manager) can do it for any branch.
const UNSCOPED_POSITIONS = ['Sales Executive', 'Operations Supervisor', 'Inventory Supervisor', 'Admin Assistant'];

// A wide "Log a Physical Count" form and a wide monitoring table both push the count
// form's button and the low-stock/overdue rows far down the page -- scroll the message
// into view every time so a result is never invisible (same fix as layaway.html).
function notify(text, isError) {
  toast('im-msg', text, isError);
  document.getElementById('im-msg').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function tile(num, label) { return '<div class="tile"><div class="num">' + esc(num) + '</div><div class="lbl">' + esc(label) + '</div></div>'; }

const employee = await initShell('item-monitoring');
if (employee) {
  const root = document.getElementById('im-root');
  const branches = await getBranches();
  const branchById = Object.fromEntries(branches.map((b) => [b.id, b.name]));
  const isScoped = ['Admin', 'Manager'].includes(employee.role) ? false : !UNSCOPED_POSITIONS.includes(employee.position);

  const branchFieldHtml = isScoped
    ? '<div class="field"><label>Branch</label>' + (branchById[employee.branch_id] ? branchBadge(esc, branchById[employee.branch_id], employee.branch_id, branches) : '<input type="text" value="None assigned" disabled>') + '</div>'
    : '<div class="field"><label>Branch *</label><select name="branchId" required>' + branches.map((b) => '<option value="' + b.id + '" style="' + branchOptionStyle(b.id, branches) + '">' + esc(b.name) + '</option>').join('') + '</select></div>';

  // Record Factory Purchase -- replaces SKU Catalog's old "Add Item" (95_products_add_item.sql's
  // group), now also scoping a Branch Supervisor to their own branch since this moves
  // real stock instead of just editing catalog text (record_factory_purchase() enforces
  // this same rule server-side).
  const canRecordPurchase = ['Admin', 'Manager'].includes(employee.role) || employee.role === 'Branch Supervisor' || employee.position === 'Admin Assistant';
  const fpIsBranchLocked = employee.role === 'Branch Supervisor';
  const fpBranchFieldHtml = fpIsBranchLocked
    ? '<div class="field"><label>Branch</label>' + (branchById[employee.branch_id] ? branchBadge(esc, branchById[employee.branch_id], employee.branch_id, branches) : '<input type="text" value="None assigned" disabled>') + '</div>'
    : '<div class="field"><label>Branch *</label><select name="branchId" required>' + branches.map((b) => '<option value="' + b.id + '" style="' + branchOptionStyle(b.id, branches) + '">' + esc(b.name) + '</option>').join('') + '</select></div>';

  root.innerHTML =
    (canRecordPurchase ? '<div class="card">' +
      '<h3>Record Factory Purchase</h3>' +
      '<p class="muted" style="margin-top:-4px;">This is now the one place new stock (and, when needed, a brand-new SKU) enters the system -- it posts a real Stock In and shows up in the SKU Catalog right away. Product Name/Category are only used the first time a SKU is purchased; an existing SKU\'s catalog details are never overwritten. Add more than one item to log a whole delivery at once -- Branch, Date Delivered, and Current Per Gram are shared across every item below since a delivery normally arrives together.</p>' +
      '<form id="fp-form" style="flex-direction:column;align-items:stretch;flex-wrap:nowrap;">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
          fpBranchFieldHtml +
          '<div class="field"><label>Date Delivered *</label><input type="date" name="dateDelivered" required></div>' +
          '<div class="field"><label>Current Per Gram</label><input type="number" name="currentPerGram" step="0.01" min="0" placeholder="PHP/g, today\'s rate"></div>' +
        '</div>' +
        '<label style="font-size:13px;font-weight:600;margin-top:10px;">Items *</label>' +
        '<div id="fp-items"></div>' +
        '<button type="button" class="btn small secondary" id="fp-add-item" style="align-self:flex-start;margin:-4px 0 10px;">+ Add another item</button>' +
        '<button class="btn" type="submit" style="align-self:flex-start;">Record Purchase</button>' +
      '</form>' +
    '</div>' : '') +
    '<div class="card">' +
      '<h3>Log a Physical Count</h3>' +
      '<p class="muted" style="margin-top:-4px;">Counting a SKU only records what you found and how it compares to the system — it never changes stock by itself. If the variance is real, investigate first, then log the correction as an Adjustment in Record Movement (Kittymae POS).</p>' +
      '<form id="cc-form" style="align-items:flex-end;">' +
        '<div class="field" style="position:relative;min-width:200px;">' +
          '<label>SKU *</label>' +
          '<input type="text" name="sku" id="cc-sku" required autocomplete="off" placeholder="Type a SKU or item name…">' +
          '<div id="cc-sku-name" class="muted" style="font-size:11px;"></div>' +
          '<div id="cc-sku-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;"></div>' +
        '</div>' +
        branchFieldHtml +
        '<div class="field"><label>Counted Qty *</label><input type="number" name="countedQty" min="0" required></div>' +
        '<div class="field"><label>Actual Weight (g)</label><input type="number" name="actualWeightG" step="0.001" min="0" placeholder="optional"></div>' +
        '<div class="field" style="min-width:180px;"><label>Notes</label><input type="text" name="notes"></div>' +
        '<button class="btn" type="submit">Log Count</button>' +
      '</form>' +
    '</div>' +

    '<div class="tiles" id="im-tiles"></div>' +

    '<h2 style="margin-top:24px;">Stock by Branch</h2>' +
    '<p class="muted" style="margin-top:-4px;">A row appears here once a SKU has had at least one movement at that branch — nothing to monitor yet for a SKU never stocked anywhere.</p>' +
    '<div class="card">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
        '<div class="field" style="min-width:200px;"><label>Search</label><input type="text" id="f-search" placeholder="SKU or product name…"></div>' +
        '<div class="field"><label>Branch</label><select id="f-branch"><option value="all">All Branches</option>' + branches.map((b) => '<option value="' + b.id + '">' + esc(b.name) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Status</label><select id="f-status"><option value="low">Low Stock Only</option><option value="all">All</option></select></div>' +
        '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
      '</div>' +
    '</div>' +
    '<div id="sbb-list"><div class="muted">Loading…</div></div>' +

    '<h2 style="margin-top:30px;">Recent Counts</h2>' +
    '<div id="cc-list"><div class="muted">Loading…</div></div>' +

    '<h2 style="margin-top:30px;">Factory Purchases</h2>' +
    '<p class="muted" style="margin-top:-4px;">Every purchase recorded above, newest delivery date first.</p>' +
    '<div id="fp-list"><div class="muted">Loading…</div></div>' +

    '<h2 style="margin-top:30px;">Product Changes</h2>' +
    '<p class="muted" style="margin-top:-4px;">Every Add/Edit/Discontinue/Reactivate made in the SKU Catalog, with who and when.</p>' +
    '<div id="pcl-list"><div class="muted">Loading…</div></div>';

  // ---- SKU autocomplete for the count form, same pattern as movement.html/layaway.html ----
  const skuInput = document.getElementById('cc-sku');
  const skuSuggest = document.getElementById('cc-sku-suggest');
  const skuNamePreview = document.getElementById('cc-sku-name');
  let skuSearchToken = 0, skuSearchTimer = null;
  function hideSkuSuggestions() { skuSuggest.style.display = 'none'; skuSuggest.innerHTML = ''; }
  function pickSku(p) {
    skuInput.value = p.sku;
    skuNamePreview.textContent = p.item_name + (p.category || p.product_line ? ' · ' + (p.category || p.product_line) : '');
    hideSkuSuggestions();
  }
  function renderSkuSuggestions(matches) {
    if (!matches.length) { hideSkuSuggestions(); return; }
    skuSuggest.innerHTML = matches.map((p) =>
      '<div data-sku="' + esc(p.sku) + '" style="padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;">' +
        '<strong>' + esc(p.sku) + '</strong> — ' + esc(p.item_name) +
      '</div>'
    ).join('');
    skuSuggest.style.display = '';
    skuSuggest.querySelectorAll('[data-sku]').forEach((row, i) => {
      row.addEventListener('mousedown', (ev) => { ev.preventDefault(); pickSku(matches[i]); });
    });
  }
  skuInput.addEventListener('input', () => {
    skuNamePreview.textContent = '';
    const q = skuInput.value.trim();
    clearTimeout(skuSearchTimer);
    if (!q) { hideSkuSuggestions(); return; }
    skuSearchTimer = setTimeout(async () => {
      const token = ++skuSearchToken;
      try {
        const results = await searchProducts(q);
        if (token !== skuSearchToken) return;
        renderSkuSuggestions(results);
      } catch (err) { /* a failed lookup shouldn't block typing a SKU by hand */ }
    }, 200);
  });
  skuInput.addEventListener('blur', () => setTimeout(hideSkuSuggestions, 150));
  skuInput.addEventListener('focus', () => { if (skuSuggest.innerHTML) skuSuggest.style.display = ''; });

  document.getElementById('cc-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const branchId = isScoped ? employee.branch_id : Number(f.branchId.value);
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      const id = await logCycleCount({
        sku: f.sku.value.trim(), branchId, countedQty: Number(f.countedQty.value),
        actualWeightG: f.actualWeightG.value ? Number(f.actualWeightG.value) : null, notes: f.notes.value.trim(),
      });
      f.reset();
      skuNamePreview.textContent = '';
      hideSkuSuggestions();
      await load();
      const logged = cycleCounts.find((c) => c.id === id);
      notify(logged && logged.variance !== 0
        ? 'Count logged — variance ' + (logged.variance > 0 ? '+' : '') + logged.variance + ' vs. system.'
        : 'Count logged — matches the system exactly.', false);
    } catch (err) {
      notify(String(err.message || err), true);
    } finally {
      btn.disabled = false;
    }
  });

  // ---- Record Factory Purchase: a repeatable item list (same +Add another item
  // pattern as POS/Layaway) since a real delivery is usually many SKUs at once --
  // Branch, Date Delivered, and Current Per Gram are entered once and shared across
  // every row. Each row gets its own SKU autocomplete that also pre-fills Pancake
  // Price/Grams from an existing match (every field stays editable -- a real change
  // this time just types over it) plus a live Total Grams/Est. Sales/Purchased
  // Amount/Profit suggestion. Rows are submitted independently (not all-or-nothing):
  // if one SKU in a big batch has a typo, the rest still go through and only the bad
  // one is reported back. ----
  if (canRecordPurchase) {
    const fpForm = document.getElementById('fp-form');
    fpForm.dateDelivered.value = new Date().toISOString().slice(0, 10);
    const fpItemsContainer = document.getElementById('fp-items');

    function fpItemRowHtml() {
      return '<div class="fp-item-row" style="border:1px solid #e5e5e5;border-radius:8px;padding:8px;margin-bottom:6px;">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
          '<div class="field" style="position:relative;min-width:150px;">' +
            '<label>SKU *</label>' +
            '<input type="text" class="fp-item-sku" autocomplete="off" placeholder="Type a SKU or item name…">' +
            '<div class="fp-item-sku-name muted" style="font-size:11px;"></div>' +
            '<div class="fp-item-sku-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;"></div>' +
          '</div>' +
          '<div class="field" style="min-width:130px;"><label>Product Name</label><input type="text" class="fp-item-name" placeholder="only if new SKU"></div>' +
          '<div class="field" style="width:100px;"><label>Category</label><input type="text" class="fp-item-category" placeholder="only if new"></div>' +
          '<div class="field" style="width:60px;"><label>Pcs *</label><input type="number" class="fp-item-qty" min="1"></div>' +
          '<div class="field" style="width:90px;"><label>Sup. Price</label><input type="number" class="fp-item-sup-price" step="0.01" min="0"></div>' +
          '<div class="field" style="width:90px;"><label>Pancake Price</label><input type="number" class="fp-item-pancake-price" step="0.01" min="0"></div>' +
          '<div class="field" style="width:75px;"><label>Grams</label><input type="number" class="fp-item-grams" step="0.001" min="0"></div>' +
          '<div class="field" style="width:75px;"><label>Total g</label><span class="fp-item-total-grams muted" style="display:block;padding:7px 0;">—</span></div>' +
          '<div class="field" style="width:95px;"><label>Avail. Factory/g</label><input type="number" class="fp-item-availed" step="0.01" min="0"></div>' +
          '<div class="field" style="width:90px;"><label>Est. Sales</label><input type="number" class="fp-item-est-sales" step="0.01"></div>' +
          '<div class="field" style="width:95px;"><label>Purchased</label><input type="number" class="fp-item-purchased" step="0.01"></div>' +
          '<div class="field" style="width:85px;"><label>Profit</label><input type="number" class="fp-item-profit" step="0.01"></div>' +
          '<div class="field" style="min-width:100px;"><label>Tag/Note</label><input type="text" class="fp-item-tag"></div>' +
          '<button type="button" class="btn small secondary fp-item-remove" title="Remove this item">✕</button>' +
        '</div>' +
      '</div>';
    }

    function fpRecalcRow(row) {
      const qty = Number(row.querySelector('.fp-item-qty').value || 0);
      const grams = Number(row.querySelector('.fp-item-grams').value || 0);
      const totalGrams = qty * grams;
      row.querySelector('.fp-item-total-grams').textContent = totalGrams ? totalGrams.toLocaleString('en-PH', { minimumFractionDigits: 3 }) + ' g' : '—';

      const supPrice = Number(row.querySelector('.fp-item-sup-price').value || 0);
      const pancakePrice = Number(row.querySelector('.fp-item-pancake-price').value || 0);
      const estSales = qty * pancakePrice;
      const purchasedAmount = qty * supPrice;
      row.querySelector('.fp-item-est-sales').value = estSales ? estSales.toFixed(2) : '';
      row.querySelector('.fp-item-purchased').value = purchasedAmount ? purchasedAmount.toFixed(2) : '';
      row.querySelector('.fp-item-profit').value = (estSales || purchasedAmount) ? (estSales - purchasedAmount).toFixed(2) : '';
    }

    function fillRowFromExistingProduct(row, p) {
      row.querySelector('.fp-item-name').value = p.item_name || '';
      row.querySelector('.fp-item-category').value = p.category || '';
      if (p.system_selling_price != null) row.querySelector('.fp-item-pancake-price').value = p.system_selling_price;
      if (p.gross_weight_g != null) row.querySelector('.fp-item-grams').value = p.gross_weight_g;
      fpRecalcRow(row);
    }

    function attachFpRowAutocomplete(row) {
      const skuInput = row.querySelector('.fp-item-sku');
      const skuSuggest = row.querySelector('.fp-item-sku-suggest');
      const skuNamePreview = row.querySelector('.fp-item-sku-name');
      let searchToken = 0, searchTimer = null;
      function hide() { skuSuggest.style.display = 'none'; skuSuggest.innerHTML = ''; }
      function pick(p) {
        skuInput.value = p.sku;
        fillRowFromExistingProduct(row, p);
        skuNamePreview.textContent = 'Existing — edit anything that changed: ' + p.item_name;
        hide();
      }
      function renderSuggestions(matches) {
        if (!matches.length) { hide(); return; }
        skuSuggest.innerHTML = matches.map((p) =>
          '<div data-sku="' + esc(p.sku) + '" style="padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;">' +
            '<strong>' + esc(p.sku) + '</strong> — ' + esc(p.item_name) +
          '</div>'
        ).join('');
        skuSuggest.style.display = '';
        skuSuggest.querySelectorAll('[data-sku]').forEach((el, i) => {
          el.addEventListener('mousedown', (ev) => { ev.preventDefault(); pick(matches[i]); });
        });
      }
      skuInput.addEventListener('input', () => {
        skuNamePreview.textContent = '';
        const q = skuInput.value.trim();
        clearTimeout(searchTimer);
        if (!q) { hide(); return; }
        searchTimer = setTimeout(async () => {
          const token = ++searchToken;
          try {
            const results = await searchProducts(q);
            if (token !== searchToken) return;
            renderSuggestions(results);
            // An exact SKU typed by hand (not clicked from the dropdown) still counts
            // as picking that product -- fill in its details the same way, without
            // stealing focus by closing the still-open suggestion list.
            const exact = results.find((p) => p.sku.toLowerCase() === q.toLowerCase());
            if (exact) {
              fillRowFromExistingProduct(row, exact);
              skuNamePreview.textContent = 'Existing — edit anything that changed: ' + exact.item_name;
            }
          } catch (err) { /* a failed lookup shouldn't block typing a SKU by hand */ }
        }, 200);
      });
      skuInput.addEventListener('blur', () => setTimeout(hide, 150));
      skuInput.addEventListener('focus', () => { if (skuSuggest.innerHTML) skuSuggest.style.display = ''; });
      ['fp-item-qty', 'fp-item-grams', 'fp-item-sup-price', 'fp-item-pancake-price'].forEach((cls) => {
        row.querySelector('.' + cls).addEventListener('input', () => fpRecalcRow(row));
      });
    }

    function updateFpRemoveButtons() {
      const rows = fpItemsContainer.querySelectorAll('.fp-item-row');
      rows.forEach((row) => { row.querySelector('.fp-item-remove').style.display = rows.length > 1 ? '' : 'none'; });
    }
    function addFpItemRow() {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = fpItemRowHtml();
      const row = wrapper.firstElementChild;
      fpItemsContainer.appendChild(row);
      attachFpRowAutocomplete(row);
      row.querySelector('.fp-item-remove').addEventListener('click', () => {
        if (fpItemsContainer.querySelectorAll('.fp-item-row').length <= 1) return;
        row.remove();
        updateFpRemoveButtons();
      });
      updateFpRemoveButtons();
    }
    function resetFpItemRows() { fpItemsContainer.innerHTML = ''; addFpItemRow(); }
    addFpItemRow();
    document.getElementById('fp-add-item').addEventListener('click', addFpItemRow);

    function readFpItemRows() {
      const items = [];
      fpItemsContainer.querySelectorAll('.fp-item-row').forEach((row) => {
        const sku = row.querySelector('.fp-item-sku').value.trim();
        if (!sku) return;
        const get = (cls) => row.querySelector('.' + cls).value;
        items.push({
          sku, itemName: get('fp-item-name').trim(), category: get('fp-item-category').trim(),
          qty: Number(get('fp-item-qty') || 0),
          supPrice: get('fp-item-sup-price') ? Number(get('fp-item-sup-price')) : null,
          pancakePrice: get('fp-item-pancake-price') ? Number(get('fp-item-pancake-price')) : null,
          grams: get('fp-item-grams') ? Number(get('fp-item-grams')) : null,
          availedFactoryGram: get('fp-item-availed') ? Number(get('fp-item-availed')) : null,
          estSales: get('fp-item-est-sales') ? Number(get('fp-item-est-sales')) : null,
          purchasedAmount: get('fp-item-purchased') ? Number(get('fp-item-purchased')) : null,
          profit: get('fp-item-profit') ? Number(get('fp-item-profit')) : null,
          tagNote: get('fp-item-tag').trim(),
        });
      });
      return items;
    }

    fpForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      const branchId = fpIsBranchLocked ? employee.branch_id : Number(f.branchId.value);
      const dateDelivered = f.dateDelivered.value;
      const currentPerGram = f.currentPerGram.value ? Number(f.currentPerGram.value) : null;
      const items = readFpItemRows();
      if (!items.length) { notify('Add at least one item (SKU) to record.', true); return; }
      const badQty = items.find((it) => !it.qty || it.qty <= 0);
      if (badQty) { notify('Pcs must be a positive number for ' + badQty.sku + '.', true); return; }

      const btn = f.querySelector('button[type=submit]');
      btn.disabled = true;
      let succeeded = 0;
      const failures = [];
      for (const it of items) {
        try {
          await recordFactoryPurchase({ ...it, branchId, dateDelivered, currentPerGram });
          succeeded++;
        } catch (err) {
          failures.push(it.sku + ': ' + (err.message || err));
        }
      }
      if (failures.length) {
        notify(succeeded + ' of ' + items.length + ' item(s) recorded. Failed — ' + failures.join('; '), true);
      } else {
        notify(items.length + ' item(s) recorded — stock and SKU Catalog updated.', false);
      }
      if (succeeded) {
        f.reset();
        f.dateDelivered.value = new Date().toISOString().slice(0, 10);
        resetFpItemRows();
      }
      await load();
      btn.disabled = false;
    });
  }

  let stockRows = [];
  let cycleCounts = [];
  let latestCounts = {};
  let productChanges = [];
  let factoryPurchases = [];
  await load();
  subscribeToChanges(['inventory', 'cycle_counts'], load);
  subscribeToChanges('product_change_log', async () => { productChanges = await listProductChangeLog(100); renderProductChanges(); });
  subscribeToChanges('factory_purchases', async () => { factoryPurchases = await listFactoryPurchases(); renderFactoryPurchases(); });

  document.getElementById('f-search').addEventListener('input', renderStockByBranch);
  document.getElementById('f-branch').addEventListener('change', renderStockByBranch);
  document.getElementById('f-status').addEventListener('change', renderStockByBranch);
  document.getElementById('f-clear').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-branch').value = 'all';
    document.getElementById('f-status').value = 'low';
    renderStockByBranch();
  });

  async function load() {
    try {
      [stockRows, cycleCounts, latestCounts, productChanges, factoryPurchases] = await Promise.all([
        listStockByBranch(), listRecentCycleCounts(100), listLatestCycleCountBySkuBranch(), listProductChangeLog(100), listFactoryPurchases(),
      ]);
      renderTiles();
      renderStockByBranch();
      renderRecentCounts();
      renderProductChanges();
      renderFactoryPurchases();
    } catch (err) {
      document.getElementById('sbb-list').innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  function nextDueInfo(sku, branchId, valueTier) {
    const lastCounted = latestCounts[sku + '|' + branchId] || null;
    const cadence = cadenceForTier(valueTier);
    const due = lastCounted ? new Date(new Date(lastCounted).getTime() + cadence * 86400000) : new Date();
    return { lastCounted, due, overdue: due <= new Date() };
  }

  function isLowStock(row) {
    const p = row.products || {};
    return p.reorder_level != null && Number(row.qty_available) <= Number(p.reorder_level);
  }

  // Tiles reflect the whole monitored set regardless of the table's current filter --
  // a KPI summary should show real totals, not shrink every time someone searches.
  function renderTiles() {
    let lowCount = 0, overdueCount = 0;
    stockRows.forEach((r) => {
      if (isLowStock(r)) lowCount++;
      if (nextDueInfo(r.sku, r.branch_id, (r.products || {}).value_tier).overdue) overdueCount++;
    });
    document.getElementById('im-tiles').innerHTML =
      tile(stockRows.length, 'SKU × Branch Monitored') +
      tile(lowCount, 'Low Stock') +
      tile(overdueCount, 'Counts Overdue');
  }

  function renderStockByBranch() {
    const fSearch = document.getElementById('f-search').value.trim().toLowerCase();
    const fBranch = document.getElementById('f-branch').value;
    const fStatus = document.getElementById('f-status').value;

    let rows = stockRows;
    if (fSearch) rows = rows.filter((r) => r.sku.toLowerCase().includes(fSearch) || ((r.products || {}).item_name || '').toLowerCase().includes(fSearch));
    if (fBranch !== 'all') rows = rows.filter((r) => String(r.branch_id) === fBranch);
    if (fStatus === 'low') rows = rows.filter((r) => isLowStock(r));

    const list = document.getElementById('sbb-list');
    if (!rows.length) { list.innerHTML = '<p class="muted">No rows match this filter.</p>'; return; }

    list.innerHTML = '<div class="table-scroll table-mini"><table><thead><tr>' +
      '<th>SKU</th><th>Product Name</th><th>Branch</th><th>Product Line</th><th>Metal Purity</th><th>Current Stock</th><th>Status</th><th>Weight on Hand</th><th>Next Count Due</th>' +
      '</tr></thead><tbody>' +
      rows.map((r) => {
        const p = r.products || {};
        const low = isLowStock(r);
        const { lastCounted, due, overdue } = nextDueInfo(r.sku, r.branch_id, p.value_tier);
        return '<tr' + (low ? ' style="background:#fdecea;"' : '') + '>' +
          '<td data-label="SKU"><b>' + esc(r.sku) + '</b></td>' +
          '<td data-label="Product Name">' + esc(p.item_name || '—') + '</td>' +
          '<td data-label="Branch">' + (branchById[r.branch_id] ? branchBadge(esc, branchById[r.branch_id], r.branch_id, branches) : '') + '</td>' +
          '<td data-label="Product Line">' + esc(p.product_line || '—') + '</td>' +
          '<td data-label="Metal Purity">' + esc(p.metal_purity || '—') + '</td>' +
          '<td data-label="Current Stock">' + r.qty_available + (r.qty_reserved ? '<div class="muted" style="font-size:10px;">' + r.qty_reserved + ' reserved</div>' : '') + '</td>' +
          '<td data-label="Status"><span class="badge ' + (low ? 'low' : 'ok') + '">' + (low ? '⚠ LOW STOCK' : 'OK') + '</span></td>' +
          '<td data-label="Weight on Hand">' + weight(r.total_grams_on_hand) + '</td>' +
          '<td data-label="Next Count Due">' + fmtDate(due) + (overdue ? ' <span class="badge low">DUE</span>' : '') +
            '<div class="muted" style="font-size:10px;">' + (lastCounted ? 'Last: ' + fmtDate(lastCounted) : 'Never counted') + '</div>' +
          '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ---- Recent Counts: every logged physical count, newest first, with the variance
  // that motivates the old sheet's "investigate first, then Adjustment" workflow. ----
  function renderRecentCounts() {
    const box = document.getElementById('cc-list');
    if (!cycleCounts.length) { box.innerHTML = '<p class="muted">No physical counts logged yet.</p>'; return; }

    box.innerHTML = '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
      '<thead><tr><th>Date</th><th>SKU</th><th>Branch</th><th>Counted</th><th>System</th><th>Variance</th><th>Weight Variance</th><th>Counted By</th><th>Notes</th><th></th></tr></thead><tbody>' +
      cycleCounts.map((c) => {
        const varStyle = c.variance === 0 ? '' : 'font-weight:600;' + (c.variance > 0 ? 'color:#2e7d4f;' : 'color:#b23c3c;');
        return '<tr>' +
          '<td data-label="Date">' + fmtDate(c.counted_at) + '</td>' +
          '<td data-label="SKU">' + esc(c.sku) + '</td>' +
          '<td data-label="Branch">' + (c.branches ? esc(c.branches.name) : '') + '</td>' +
          '<td data-label="Counted">' + c.counted_qty + '</td>' +
          '<td data-label="System">' + c.system_qty_at_count + '</td>' +
          '<td data-label="Variance" style="' + varStyle + '">' + (c.variance > 0 ? '+' : '') + c.variance + '</td>' +
          '<td data-label="Weight Variance">' + (c.weight_variance_g != null ? weight(c.weight_variance_g) : '—') + '</td>' +
          '<td data-label="Counted By">' + (c.counter ? esc(c.counter.full_name) : '—') + '</td>' +
          '<td data-label="Notes" class="full-row">' + esc(c.notes || '—') + '</td>' +
          '<td data-label="" class="full-row">' +
            (c.variance !== 0
              ? '<button class="btn small secondary" data-act="investigated" data-id="' + c.id + '" data-val="' + (!c.investigated) + '">' +
                  (c.investigated ? 'Investigated ✓ (undo)' : 'Mark Investigated') +
                '</button>'
              : '') +
          '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';

    box.querySelectorAll('[data-act="investigated"]').forEach((btn) => btn.addEventListener('click', async () => {
      try {
        await markCycleCountInvestigated(Number(btn.dataset.id), btn.dataset.val === 'true');
        notify('Updated.', false);
        await load();
      } catch (err) {
        notify(String(err.message || err), true);
      }
    }));
  }

  // ---- Product Changes: every Add/Edit/Discontinue/Reactivate written by
  // trg_log_product_change (96_product_change_log.sql) regardless of which page made
  // the change -- monitoring only, nothing here is editable. ----
  function renderProductChanges() {
    const box = document.getElementById('pcl-list');
    if (!productChanges.length) { box.innerHTML = '<p class="muted">No SKU Catalog changes logged yet.</p>'; return; }

    box.innerHTML = '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
      '<thead><tr><th>Date</th><th>SKU</th><th>Action</th><th>Details</th><th>Changed By</th></tr></thead><tbody>' +
      productChanges.map((c) => '<tr>' +
        '<td data-label="Date">' + fmtDateTime(c.changed_at) + '</td>' +
        '<td data-label="SKU">' + esc(c.sku) + '</td>' +
        '<td data-label="Action"><span class="badge ' + (PRODUCT_CHANGE_BADGE[c.action] || 'pending') + '">' + esc(c.action) + '</span></td>' +
        '<td data-label="Details" class="full-row">' + esc(c.details || '—') + '</td>' +
        '<td data-label="Changed By" class="full-row">' + (c.changer ? esc(c.changer.full_name) : '—') + '</td>' +
      '</tr>').join('') + '</tbody></table></div>';
  }

  // ---- Factory Purchases: every purchase recorded via the form above, newest
  // delivery first -- monitoring only, nothing here is editable. ----
  function renderFactoryPurchases() {
    const box = document.getElementById('fp-list');
    if (!factoryPurchases.length) { box.innerHTML = '<p class="muted">No factory purchases recorded yet.</p>'; return; }

    box.innerHTML = '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
      '<thead><tr><th>Delivered</th><th>SKU</th><th>Branch</th><th>Pcs</th><th>Sup. Price</th><th>Pancake Price</th>' +
      '<th>Grams</th><th>Total Grams</th><th>Availed Factory Gram</th><th>Current/Gram</th><th>Est. Sales</th><th>Purchased</th><th>Profit</th><th>Note</th><th>By</th></tr></thead><tbody>' +
      factoryPurchases.map((p) => '<tr>' +
        '<td data-label="Delivered">' + fmtDate(p.date_delivered) + '</td>' +
        '<td data-label="SKU"><b>' + esc(p.sku) + '</b></td>' +
        '<td data-label="Branch">' + (p.branches ? esc(p.branches.name) : '—') + '</td>' +
        '<td data-label="Pcs">' + p.qty + '</td>' +
        '<td data-label="Sup. Price">' + money(p.sup_price) + '</td>' +
        '<td data-label="Pancake Price">' + money(p.pancake_price) + '</td>' +
        '<td data-label="Grams">' + weight(p.grams) + '</td>' +
        '<td data-label="Total Grams">' + weight(p.total_grams) + '</td>' +
        '<td data-label="Availed Factory Gram">' + money(p.availed_factory_gram) + '</td>' +
        '<td data-label="Current/Gram">' + money(p.current_per_gram) + '</td>' +
        '<td data-label="Est. Sales">' + money(p.est_sales) + '</td>' +
        '<td data-label="Purchased">' + money(p.purchased_amount) + '</td>' +
        '<td data-label="Profit">' + money(p.profit) + '</td>' +
        '<td data-label="Note" class="full-row">' + esc(p.tag_note || '—') + '</td>' +
        '<td data-label="By" class="full-row">' + (p.creator ? esc(p.creator.full_name) : '—') + '</td>' +
      '</tr>').join('') + '</tbody></table></div>';
  }
}
</script>
</body>
</html>
