<script type="module">

import * as api from './js/imApi.js?v=20261030a';

// Item Monitoring (upgraded 2026-10-30): the stock board, the physical counts, the purchase history and the product changes the page always had -- reorganised into tabs with the stock search at
// the top -- plus FINAL APPROVAL: a factory purchase staff enter is a request that adds no stock until the Final Approver approves it, and a posted purchase is only reversed after the

// shows what a person can use.
const employee = await initShell('item-monitoring');
if (employee) {
  await startImPage({ root: document.getElementById('im-root'), api, employee, search: location.search, hash: location.hash });
}
