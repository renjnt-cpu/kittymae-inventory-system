<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfers — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20260922c">
</head>
<body>
<main>
  <div id="tr-msg"></div>
  <!-- Same Form Drawer / Detail Drawer flow as the branch modules (Ren's spec 271-288):
       primary action at the top, Summary tiles, Search & Filters and the active-filter
       strip, then the records. Requesting a transfer happens in the form drawer; every
       transfer's details and its workflow actions (Approve / Ship / Receive / ...) live
       in the detail drawer. -->
  <div class="module-topbar"><div></div><div style="text-align:right;">
    <button type="button" class="btn" id="tr-new-btn">+ New Transfer</button>
  </div></div>
  <div class="tiles" id="transfer-tiles"></div>
  <div class="card">
    <h3 style="margin-top:0;">Search &amp; Filter <span class="muted" style="font-weight:normal;">— trace a product across every transfer</span></h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="min-width:200px;"><label>Search</label><input type="text" id="tr-trace-search" placeholder="SKU or product name…"></div>
      <div class="field"><label>Status</label><select id="tr-f-status"><option value="all">All</option></select></div>
      <div class="field"><label>Requested From</label><input type="date" id="tr-trace-from"></div>
      <div class="field"><label>Requested To</label><input type="date" id="tr-trace-to"></div>
      <span id="tr-sort-slot"></span>
      <button type="button" class="btn small secondary" id="tr-trace-clear">Clear Filters</button>
    </div>
  </div>
  <div id="tr-active-filters"></div>

  <h3 style="margin:0 0 8px;">Active</h3>
  <div id="transfer-active"><div class="muted">Loading…</div></div>

  <!-- Same expand/collapse pattern as every other folder system-wide (Ren, 2026-09-22,
       see css/styles.css's details.exp). -->
  <details class="card exp" style="margin-top:16px;">
    <summary><span class="exp-arrow" aria-hidden="true">▸</span>Cancelled / Rejected <span class="exp-count" id="tr-cancelled-count"></span></summary>
    <div class="exp-body" id="transfer-cancelled"></div>
  </details>

  <h3 style="margin-top:20px;">Received — by Branch</h3>
  <div id="transfer-received-by-branch"></div>

  <div class="drawer-backdrop" id="tr-form-backdrop"></div>
  <div class="drawer" id="tr-form-drawer">
    <div class="drawer-header"><h3>New Transfer</h3><button type="button" class="drawer-close" id="tr-form-close" aria-label="Close">✕</button></div>
    <div class="drawer-body">
      <form id="req-form" style="display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;">
        <div class="drawer-section">
          <h4>Route</h4>
          <div class="field"><label>From Branch *</label><select name="fromBranchId" id="from-branch" required></select></div>
          <div class="field"><label>To Branch *</label><select name="toBranchId" id="to-branch" required></select></div>
        </div>
        <div class="drawer-section">
          <h4>Items</h4>
          <div id="req-lines"></div>
          <button type="button" class="btn small secondary" id="add-line" style="align-self:flex-start;margin-top:4px;">+ Add another item</button>
        </div>
      </form>
    </div>
    <div class="drawer-footer">
      <button class="btn" type="submit" form="req-form" id="tr-submit-btn">Request Transfer</button>
      <button type="button" class="btn secondary" id="tr-form-cancel">Cancel</button>
    </div>
  </div>
  <div class="drawer-backdrop" id="tr-detail-backdrop"></div>
  <div class="drawer" id="tr-detail-drawer">
    <div class="drawer-header"><div><h3 id="tr-detail-title">Transfer</h3><div class="muted" id="tr-detail-sub"></div></div><button type="button" class="drawer-close" id="tr-detail-close" aria-label="Close">✕</button></div>
    <div class="drawer-body" id="tr-detail-body"></div>
  </div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js?v=20260922c';
import {
  getBranches, listTransfers, createTransferRequest, editTransferRequest, approveTransfer, startPreparingTransfer,
  shipTransfer, receiveTransfer, rejectTransfer, cancelTransfer, deleteTransfer, subscribeToChanges, searchProducts,
} from './js/api.js?v=20260922c';
import { branchBadge, branchOptionStyle } from './js/branchColors.js?v=20260922c';
import { activeFiltersHtml, emptyStateHtml, wireProxyButtons, sortControlHtml, wireSortControl, applySort, byText, byDate } from './js/uiKit.js?v=20260922c';

const STATUS_BADGE = {
  Draft: 'pending', Requested: 'pending', Approved: 'pending', Preparing: 'pending',
  'In Transit': 'transit', Received: 'ok', Rejected: 'low', Cancelled: 'low',
};
const STATUSES = ['Requested', 'Approved', 'Preparing', 'In Transit', 'Received', 'Rejected', 'Cancelled'];
const fmtDateTime = (s) => s ? new Date(s).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const tile = (num, label) => '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
const transferQty = (t) => (t.inventory_transfer_items || []).reduce((s, i) => s + Number(i.received_qty ?? i.sent_qty ?? i.requested_qty ?? 0), 0);
// Global Filter + Sort rules (Ren, 2026-09-21, section 17-ish -- branch transaction
// details): one Sort control governs Active/Cancelled-Rejected/every Received-by-
// branch folder alike (tableHtml() applies it once, shared by every caller below).
const TR_SORT_FIELDS = [
  { key: 'requested_at', label: 'Requested Date' }, { key: 'from_branch', label: 'From Branch' },
  { key: 'to_branch', label: 'To Branch' }, { key: 'status', label: 'Status' }, { key: 'qty', label: 'Qty' },
];

const employee = await initShell('transfers');
if (employee) {
  const branches = await getBranches();
  const byId = Object.fromEntries(branches.map((b) => [b.id, b.name]));
  const isAdminManager = employee.role === 'Admin' || employee.role === 'Manager';
  let allTransfers = [];
  let openDetailId = null;
  const sort = { field: 'requested_at', dir: 'desc' };
  const TR_SORT_COMPARATORS = {
    requested_at: byDate('requested_at'), status: byText('status'),
    from_branch: (a, b) => String(byId[a.from_branch_id] || '').localeCompare(String(byId[b.from_branch_id] || '')),
    to_branch: (a, b) => String(byId[a.to_branch_id] || '').localeCompare(String(byId[b.to_branch_id] || '')),
    qty: (a, b) => transferQty(a) - transferQty(b),
  };
  document.getElementById('tr-sort-slot').outerHTML = sortControlHtml(TR_SORT_FIELDS, sort, 'tr-sort-field', 'tr-sort-dir');
  wireSortControl('tr-sort-field', 'tr-sort-dir', sort, render);

  // Requesting is open to any branch staff (Ren, 2026-09-16) -- create_transfer_request()
  // enforces the actual rule server-side: non-Admin/Manager/unscoped-position staff
  // must have their own branch as either end of the transfer.
  const branchOptionsHtml = (selected) => branches.map((b) =>
    '<option value="' + b.id + '" style="' + branchOptionStyle(b.id, branches) + '"' + (b.id === selected ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('');
  document.getElementById('from-branch').innerHTML = branchOptionsHtml(employee.branch_id ?? null);
  document.getElementById('to-branch').innerHTML = branchOptionsHtml(null);
  document.getElementById('tr-f-status').innerHTML += STATUSES.map((s) => '<option>' + s + '</option>').join('');

  // ---- item line rows (request form + the Edit form inside the detail drawer) ----
  function addLine(container, prefill) {
    const div = document.createElement('div');
    div.className = 'line-row';
    div.style.cssText = 'display:flex;gap:8px;align-items:flex-end;margin-bottom:6px;';
    div.innerHTML = '<div class="field" style="flex:1;min-width:0;position:relative;">' +
        '<label>SKU</label>' +
        '<input type="text" class="line-sku" autocomplete="off" placeholder="Type a SKU or item name…" required value="' + esc(prefill ? prefill.sku : '') + '">' +
        '<div class="line-sku-name muted" style="font-size:11px;"></div>' +
        '<div class="line-sku-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;"></div>' +
      '</div>' +
      '<div class="field" style="width:80px;"><label>Qty</label><input type="number" class="line-qty" min="1" required value="' + (prefill ? prefill.qty : '') + '"></div>' +
      '<button type="button" class="btn small secondary line-remove" aria-label="Remove item">✕</button>';
    container.appendChild(div);
    div.querySelector('.line-remove').addEventListener('click', () => { if (container.querySelectorAll('.line-row').length > 1) div.remove(); });
    attachSkuAutocomplete(div);
  }
  function readLines(container) {
    return Array.from(container.querySelectorAll('.line-row')).map((row) => ({
      sku: row.querySelector('.line-sku').value.trim(),
      qty: Number(row.querySelector('.line-qty').value),
    })).filter((i) => i.sku);
  }
  // Same SKU autocomplete pattern as the other modules' item rows.
  function attachSkuAutocomplete(row) {
    const skuInput = row.querySelector('.line-sku');
    const skuSuggest = row.querySelector('.line-sku-suggest');
    const skuNamePreview = row.querySelector('.line-sku-name');
    let searchToken = 0, searchTimer = null;
    function hide() { skuSuggest.style.display = 'none'; skuSuggest.innerHTML = ''; }
    skuInput.addEventListener('input', () => {
      skuNamePreview.textContent = '';
      const q = skuInput.value.trim();
      clearTimeout(searchTimer);
      if (!q) { hide(); return; }
      searchTimer = setTimeout(async () => {
        const token = ++searchToken;
        try {
          const results = await searchProducts(q);
          if (token !== searchToken) return;
          if (!results.length) { hide(); return; }
          skuSuggest.innerHTML = results.slice(0, 8).map((p, i) =>
            '<div data-i="' + i + '" style="padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;">' +
              '<strong>' + esc(p.sku) + '</strong> — ' + esc(p.item_name) +
              (p.category || p.product_line ? '<div class="muted" style="font-size:11px;">' + esc(p.category || p.product_line) + '</div>' : '') +
            '</div>').join('');
          skuSuggest.style.display = '';
          skuSuggest.querySelectorAll('[data-i]').forEach((el, i) => el.addEventListener('mousedown', (ev) => {
            ev.preventDefault();
            const p = results[i];
            skuInput.value = p.sku;
            skuNamePreview.textContent = p.item_name + (p.category || p.product_line ? ' · ' + (p.category || p.product_line) : '');
            hide();
          }));
          const exact = results.find((p) => p.sku.toLowerCase() === q.toLowerCase());
          if (exact) skuNamePreview.textContent = exact.item_name + (exact.category || exact.product_line ? ' · ' + (exact.category || exact.product_line) : '');
        } catch (err) { /* a failed lookup shouldn't block typing a SKU by hand */ }
      }, 200);
    });
    skuInput.addEventListener('blur', () => setTimeout(hide, 150));
  }

  // ---- form drawer ----
  const reqLines = document.getElementById('req-lines');
  addLine(reqLines);
  document.getElementById('add-line').addEventListener('click', () => addLine(reqLines));
  function openFormDrawer() {
    document.getElementById('tr-form-backdrop').classList.add('open');
    document.getElementById('tr-form-drawer').classList.add('open');
  }
  function closeFormDrawer() {
    document.getElementById('tr-form-backdrop').classList.remove('open');
    document.getElementById('tr-form-drawer').classList.remove('open');
  }
  document.getElementById('tr-new-btn').addEventListener('click', openFormDrawer);
  document.getElementById('tr-form-close').addEventListener('click', closeFormDrawer);
  document.getElementById('tr-form-cancel').addEventListener('click', closeFormDrawer);
  document.getElementById('tr-form-backdrop').addEventListener('click', closeFormDrawer);

  document.getElementById('req-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    // The submit button lives in .drawer-footer (form="req-form"), outside this <form>
    // element's own subtree, so it's reached by its own id.
    const btn = document.getElementById('tr-submit-btn');
    const items = readLines(reqLines);
    if (!items.length) { toast('tr-msg', 'Add at least one item.', true); return; }
    if (Number(f.fromBranchId.value) === Number(f.toBranchId.value)) { toast('tr-msg', 'From and To must be different branches.', true); return; }
    btn.disabled = true;
    try {
      const newId = await createTransferRequest(Number(f.fromBranchId.value), Number(f.toBranchId.value), items);
      toast('tr-msg', 'Transfer requested.', false);
      f.reset();
      document.getElementById('from-branch').value = employee.branch_id ?? branches[0].id;
      reqLines.innerHTML = '';
      addLine(reqLines);
      closeFormDrawer();
      await load();
      // The same drawer system now shows the saved request (spec 273).
      if (newId) { openDetailId = newId; openDetail(newId); }
    } catch (err) {
      toast('tr-msg', String(err.message || err), true);
    } finally {
      btn.disabled = false;
    }
  });

  // ---- detail drawer ----
  function closeDetailDrawer() {
    document.getElementById('tr-detail-backdrop').classList.remove('open');
    document.getElementById('tr-detail-drawer').classList.remove('open');
  }
  document.getElementById('tr-detail-close').addEventListener('click', closeDetailDrawer);
  document.getElementById('tr-detail-backdrop').addEventListener('click', closeDetailDrawer);
  function openDetail(id) {
    const t = allTransfers.find((x) => String(x.id) === String(id));
    if (!t) return;
    // .textContent escapes on its own -- esc() here would double-escape.
    document.getElementById('tr-detail-title').textContent = 'Transfer — ' + (byId[t.from_branch_id] || '?') + ' → ' + (byId[t.to_branch_id] || '?');
    document.getElementById('tr-detail-sub').textContent = t.status + ' · requested ' + fmtDateTime(t.requested_at);
    const body = document.getElementById('tr-detail-body');
    body.innerHTML = renderDetailBody(t);
    wireDetailBody(body, t);
    document.getElementById('tr-detail-backdrop').classList.add('open');
    document.getElementById('tr-detail-drawer').classList.add('open');
  }
  function refreshDetailIfOpen(id) {
    if (!document.getElementById('tr-detail-drawer').classList.contains('open')) return;
    if (!allTransfers.find((x) => String(x.id) === String(id))) { closeDetailDrawer(); return; }
    openDetail(id);
  }

  async function load() {
    const activeBox = document.getElementById('transfer-active');
    activeBox.innerHTML = '<div class="muted">Loading…</div>';
    try {
      allTransfers = await listTransfers();
      render();
      if (openDetailId != null) refreshDetailIfOpen(openDetailId);
    } catch (err) {
      activeBox.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  // ---- filters + lists ----
  function currentFilters() {
    return {
      q: document.getElementById('tr-trace-search').value.trim().toLowerCase(),
      status: document.getElementById('tr-f-status').value,
      from: document.getElementById('tr-trace-from').value,
      to: document.getElementById('tr-trace-to').value,
    };
  }
  function filterTransfers(rows, f) {
    let out = rows;
    if (f.q) out = out.filter((t) => t.inventory_transfer_items.some((i) =>
      i.sku.toLowerCase().includes(f.q) || ((i.products || {}).item_name || '').toLowerCase().includes(f.q)));
    if (f.status !== 'all') out = out.filter((t) => t.status === f.status);
    if (f.from) out = out.filter((t) => t.requested_at && t.requested_at.slice(0, 10) >= f.from);
    if (f.to) out = out.filter((t) => t.requested_at && t.requested_at.slice(0, 10) <= f.to);
    return out;
  }

  function rowHtml(t) {
    const items = t.inventory_transfer_items || [];
    const qty = items.reduce((s, i) => s + Number(i.received_qty ?? i.sent_qty ?? i.requested_qty ?? 0), 0);
    return '<tr>' +
      '<td data-label="Route" class="full-row">' + branchBadge(esc, byId[t.from_branch_id], t.from_branch_id, branches) + ' → ' + branchBadge(esc, byId[t.to_branch_id], t.to_branch_id, branches) + '</td>' +
      '<td data-label="Status"><span class="badge ' + (STATUS_BADGE[t.status] || 'pending') + '">' + esc(t.status) + '</span>' + (t.has_discrepancy ? ' <span class="badge low">Discrepancy</span>' : '') + '</td>' +
      '<td data-label="Items" class="full-row">' + items.length + ' item' + (items.length === 1 ? '' : 's') + ' · ' + qty + ' pcs<div class="muted" style="font-size:10px;">' + esc(items.map((i) => i.sku).slice(0, 4).join(', ')) + (items.length > 4 ? ' +' + (items.length - 4) + ' more' : '') + '</div></td>' +
      '<td data-label="Requested">' + esc(t.requester ? t.requester.full_name : '—') + '<div class="muted" style="font-size:10px;">' + fmtDateTime(t.requested_at) + '</div></td>' +
      '<td class="full-row"><button type="button" class="btn small secondary" data-act="view-details" data-id="' + esc(t.id) + '">View Details</button></td>' +
    '</tr>';
  }
  // Filtering already picked which rows are in play; sort only reorders them, applied
  // once here so every caller (Active/Cancelled/each Received-by-branch folder) stays
  // in sync with the one shared control (section 11/20).
  const tableHtml = (rows) => '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
    '<colgroup><col style="width:30%"><col style="width:16%"><col style="width:22%"><col style="width:18%"><col style="width:14%"></colgroup>' +
    '<thead><tr><th>Route</th><th>Status</th><th>Items</th><th>Requested</th><th></th></tr></thead><tbody>' + applySort(rows, sort, TR_SORT_COMPARATORS).map(rowHtml).join('') + '</tbody></table></div>';

  function render() {
    const f = currentFilters();
    const rows = filterTransfers(allTransfers, f);
    const hasFilters = !!(f.q || f.status !== 'all' || f.from || f.to);
    // Three buckets (Ren, 2026-09-16): Active covers every in-progress status,
    // Cancelled/Rejected is one collapsed folder, Received gets a folder per branch.
    const active = rows.filter((t) => !['Received', 'Rejected', 'Cancelled'].includes(t.status));
    const cancelled = rows.filter((t) => ['Rejected', 'Cancelled'].includes(t.status));
    const received = rows.filter((t) => t.status === 'Received');
    const inTransit = rows.filter((t) => t.status === 'In Transit');

    // Tiles, active-filter strip, every list and every count follow the same filters
    // (MASTER UI rules 6/19/20/28).
    document.getElementById('transfer-tiles').innerHTML =
      tile(rows.length, hasFilters ? 'Matching Transfers' : 'Total Transfers') +
      tile(active.length, 'Active') + tile(inTransit.length, 'In Transit') +
      tile(received.length, 'Received') + tile(cancelled.length, 'Cancelled/Rejected');
    const activeEl = document.getElementById('tr-active-filters');
    activeEl.innerHTML = activeFiltersHtml([
      { label: 'Search', value: esc(f.q) }, { label: 'Status', value: esc(f.status) },
      { label: 'Requested From', value: esc(f.from) }, { label: 'Requested To', value: esc(f.to) },
    ], 'tr-trace-clear');
    wireProxyButtons(activeEl);

    const activeBox = document.getElementById('transfer-active');
    activeBox.innerHTML = active.length ? tableHtml(active)
      : emptyStateHtml({ message: hasFilters ? 'No active transfers match these filters.' : 'No active transfers.', hasFilters, clearId: 'tr-trace-clear', createLabel: '+ New Transfer', createId: 'tr-new-btn' });
    wireProxyButtons(activeBox);

    document.getElementById('tr-cancelled-count').textContent = '(' + cancelled.length + ')';
    const cancelledBox = document.getElementById('transfer-cancelled');
    cancelledBox.innerHTML = cancelled.length ? tableHtml(cancelled)
      : emptyStateHtml({ message: hasFilters ? 'None match these filters.' : 'None.', hasFilters, clearId: 'tr-trace-clear' });
    wireProxyButtons(cancelledBox);

    const byBranch = {};
    received.forEach((t) => { (byBranch[t.to_branch_id] = byBranch[t.to_branch_id] || []).push(t); });
    const branchIds = Object.keys(byBranch).map(Number).sort((a, b) => (byId[a] || '').localeCompare(byId[b] || ''));
    const branchBox = document.getElementById('transfer-received-by-branch');
    branchBox.innerHTML = branchIds.length
      ? branchIds.map((bid) =>
          '<details class="card exp" style="margin-top:10px;">' +
            '<summary><span class="exp-arrow" aria-hidden="true">▸</span>' + esc(byId[bid] || 'Unknown Branch') + ' <span class="exp-count">(' + byBranch[bid].length + ')</span></summary>' +
            '<div class="exp-body">' + tableHtml(byBranch[bid]) + '</div>' +
          '</details>').join('')
      : emptyStateHtml({ message: hasFilters ? 'No received transfers match these filters.' : 'No received transfers yet.', hasFilters, clearId: 'tr-trace-clear' });
    wireProxyButtons(branchBox);

    document.querySelectorAll('[data-act="view-details"]').forEach((btn) => btn.addEventListener('click', () => { openDetailId = btn.dataset.id; openDetail(openDetailId); }));
  }

  // ---- detail drawer body ----
  function permissionsFor(t) {
    const canActOnFrom = isAdminManager || (employee.role === 'Branch Supervisor' && employee.branch_id === t.from_branch_id);
    const canActOnTo = isAdminManager || (employee.role === 'Branch Supervisor' && employee.branch_id === t.to_branch_id);
    // Maker-checker: whoever requested it can't also approve or ship it -- a different
    // Admin/Manager has to (approve_transfer()'s own server-side check, mirrored here).
    const isRequester = t.requested_by === employee.id;
    return {
      isRequester, canActOnFrom, canActOnTo,
      canApprove: !isRequester && isAdminManager,
      canShip: !isRequester && canActOnFrom,
      // Edit is Admin-only and only while still Requested (Ren, 2026-09-16: "add edit
      // transfer only me can edit") -- matching edit_transfer_request's own gate.
      canEdit: employee.role === 'Admin' && t.status === 'Requested',
      canDelete: employee.role === 'Admin' && ['Received', 'Rejected', 'Cancelled'].includes(t.status),
    };
  }
  const actBtn = (label, act, secondary) => '<button type="button" class="btn small' + (secondary ? ' secondary' : '') + '" data-act="' + act + '">' + label + '</button> ';
  function actionsHtml(t) {
    const p = permissionsFor(t);
    let actions = '';
    if (t.status === 'Requested') {
      if (p.canApprove) actions += actBtn('Approve', 'approve');
      else if (p.isRequester) actions += '<span class="muted" style="font-size:11px;">Awaiting approval from someone else</span> ';
      if (p.canEdit) actions += actBtn('Edit', 'edit', true);
      if (isAdminManager) actions += actBtn('Reject', 'reject', true);
    }
    if (t.status === 'Approved' && p.canActOnFrom) actions += actBtn('Start Preparing', 'prepare');
    if (t.status === 'Approved' || t.status === 'Preparing') {
      if (p.canShip) actions += actBtn('Ship', 'ship');
      else if (p.isRequester) actions += '<span class="muted" style="font-size:11px;">Awaiting shipping from someone else</span> ';
    }
    if (t.status === 'In Transit' && p.canActOnTo) actions += actBtn('Receive', 'receive');
    if (['Draft', 'Requested', 'Approved', 'Preparing'].includes(t.status) && isAdminManager) actions += actBtn('Cancel Transfer', 'cancel', true);
    // Distinct from Cancel -- for a Received transfer (a real duplicate) or a dead
    // Rejected/Cancelled one; reverses its inventory movements server-side, blocked if
    // that would take any SKU/branch negative. Admin-only (Ren, 2026-09-17).
    if (p.canDelete) actions += actBtn('Delete', 'delete', true);
    return actions;
  }
  const kv = (label, value) => value ? '<div class="drawer-kv"><span>' + label + '</span><b>' + value + '</b></div>' : '';
  function renderDetailBody(t) {
    const items = t.inventory_transfer_items || [];
    const actions = actionsHtml(t);
    return '<div class="drawer-section"><h4>Route</h4>' +
      '<div class="drawer-kv"><span>From</span><b>' + branchBadge(esc, byId[t.from_branch_id], t.from_branch_id, branches) + '</b></div>' +
      '<div class="drawer-kv"><span>To</span><b>' + branchBadge(esc, byId[t.to_branch_id], t.to_branch_id, branches) + '</b></div>' +
      '<div class="drawer-kv"><span>Status</span><b><span class="badge ' + (STATUS_BADGE[t.status] || 'pending') + '">' + esc(t.status) + '</span>' + (t.has_discrepancy ? ' <span class="badge low">Discrepancy</span>' : '') + '</b></div>' +
    '</div>' +
    '<div class="drawer-section"><h4>Items</h4>' +
      '<div class="table-scroll table-mini"><table><tr><th>SKU</th><th>Requested</th><th>Sent</th><th>Received</th><th>Disc.</th></tr>' +
        items.map((i) => '<tr><td data-label="SKU">' + esc(i.sku) + (i.products && i.products.item_name ? '<div class="muted" style="font-size:10px;">' + esc(i.products.item_name) + '</div>' : '') + '</td>' +
          '<td data-label="Requested">' + i.requested_qty + '</td><td data-label="Sent">' + (i.sent_qty ?? '—') + '</td><td data-label="Received">' + (i.received_qty ?? '—') + '</td>' +
          '<td data-label="Disc.">' + (i.discrepancy_qty ? '<span class="badge low">' + i.discrepancy_qty + '</span>' : '—') + '</td></tr>').join('') +
      '</table></div>' +
    '</div>' +
    '<div class="drawer-section"><h4>Timeline</h4>' +
      kv('Requested', esc(t.requester ? t.requester.full_name : '—') + ' · ' + fmtDateTime(t.requested_at)) +
      kv('Approved', t.approved_at ? esc(t.approver ? t.approver.full_name : '—') + ' · ' + fmtDateTime(t.approved_at) : '') +
      kv('Shipped', t.shipped_at ? esc(t.shipper ? t.shipper.full_name : '—') + ' · ' + fmtDateTime(t.shipped_at) : '') +
      kv('Received', t.received_at ? esc(t.receiver ? t.receiver.full_name : '—') + ' · ' + fmtDateTime(t.received_at) : '') +
      kv('Rejected', t.rejected_at ? esc(t.rejecter ? t.rejecter.full_name : '—') + ' · ' + fmtDateTime(t.rejected_at) : '') +
      kv('Reason', t.rejection_reason ? esc(t.rejection_reason) : '') +
      kv('Cancelled', t.cancelled_at ? esc(t.canceller ? t.canceller.full_name : '—') + ' · ' + fmtDateTime(t.cancelled_at) : '') +
      kv('Notes', t.notes ? esc(t.notes) : '') +
    '</div>' +
    (actions ? '<div class="drawer-section"><h4>Actions</h4>' + actions + '</div>' : '');
  }

  // Workflow sub-forms rendered INSIDE the drawer body (spec 279/282); Cancel returns
  // to the unchanged details, a successful save to the refreshed ones.
  function qtyFormHtml(t, action) {
    const label = action === 'ship' ? 'Sent' : 'Received';
    return '<form id="tr-qty-form" style="display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;">' +
      '<div class="drawer-section"><h4>' + (action === 'ship' ? 'Confirm quantities being shipped' : 'Confirm quantities received') + '</h4>' +
        (t.inventory_transfer_items || []).map((i, idx) =>
          '<div class="field"><label>' + esc(i.sku) + (i.products && i.products.item_name ? ' — ' + esc(i.products.item_name) : '') + ' <span class="muted">(requested ' + i.requested_qty + (i.sent_qty != null ? ', sent ' + i.sent_qty : '') + ')</span></label>' +
          '<input type="number" name="q' + idx + '" min="0" required value="' + (action === 'ship' ? i.requested_qty : (i.sent_qty ?? i.requested_qty)) + '" aria-label="' + label + ' qty for ' + esc(i.sku) + '"></div>').join('') +
      '</div>' +
      '<div class="drawer-section" style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn" type="submit">Confirm ' + (action === 'ship' ? 'Ship' : 'Receive') + '</button>' +
        '<button class="btn secondary" type="button" data-act="cancel-edit">Cancel</button>' +
      '</div>' +
    '</form>';
  }
  function reasonFormHtml(action) {
    return '<form id="tr-reason-form" style="display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;">' +
      '<div class="drawer-section"><h4>' + (action === 'reject' ? 'Reject this transfer' : 'Cancel this transfer') + '</h4>' +
        '<div class="field"><label>Reason</label><input type="text" name="reason" placeholder="Why?"></div>' +
      '</div>' +
      '<div class="drawer-section" style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn" type="submit">Confirm ' + (action === 'reject' ? 'Reject' : 'Cancel Transfer') + '</button>' +
        '<button class="btn secondary" type="button" data-act="cancel-edit">Back</button>' +
      '</div>' +
    '</form>';
  }
  function editFormHtml(t) {
    return '<form id="tr-edit-form" style="display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;">' +
      '<div class="drawer-section"><h4>Route</h4>' +
        '<div class="field"><label>From Branch *</label><select name="fromBranchId" required>' + branchOptionsHtml(t.from_branch_id) + '</select></div>' +
        '<div class="field"><label>To Branch *</label><select name="toBranchId" required>' + branchOptionsHtml(t.to_branch_id) + '</select></div>' +
      '</div>' +
      '<div class="drawer-section"><h4>Items</h4>' +
        '<div id="tr-edit-lines"></div>' +
        '<button type="button" class="btn small secondary" id="tr-edit-add-line" style="align-self:flex-start;margin-top:4px;">+ Add another item</button>' +
      '</div>' +
      '<div class="drawer-section" style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn" type="submit">Save Changes</button>' +
        '<button class="btn secondary" type="button" data-act="cancel-edit">Cancel</button>' +
      '</div>' +
    '</form>';
  }

  function wireDetailBody(container, t) {
    const done = async (msg) => { toast('tr-msg', msg || 'Updated.', false); await load(); };
    const fail = (err) => toast('tr-msg', String(err.message || err), true);
    const swapTo = (html) => { container.innerHTML = html; container.querySelector('[data-act="cancel-edit"]')?.addEventListener('click', () => openDetail(t.id)); };

    container.querySelector('[data-act="approve"]')?.addEventListener('click', async () => { try { await approveTransfer(t.id); done('Approved.'); } catch (err) { fail(err); } });
    container.querySelector('[data-act="prepare"]')?.addEventListener('click', async () => { try { await startPreparingTransfer(t.id); done('Marked as preparing.'); } catch (err) { fail(err); } });
    container.querySelector('[data-act="delete"]')?.addEventListener('click', async () => {
      if (!confirm('Permanently delete this transfer? This reverses the stock it moved and cannot be undone (blocked automatically if that would take any SKU negative).')) return;
      try { await deleteTransfer(t.id); closeDetailDrawer(); done('Deleted.'); } catch (err) { fail(err); }
    });
    ['reject', 'cancel'].forEach((action) => container.querySelector('[data-act="' + action + '"]')?.addEventListener('click', () => {
      swapTo(reasonFormHtml(action));
      container.querySelector('#tr-reason-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const reason = ev.target.reason.value.trim();
        try {
          if (action === 'reject') await rejectTransfer(t.id, reason); else await cancelTransfer(t.id, reason);
          done(action === 'reject' ? 'Rejected.' : 'Cancelled.');
        } catch (err) { fail(err); }
      });
    }));
    ['ship', 'receive'].forEach((action) => container.querySelector('[data-act="' + action + '"]')?.addEventListener('click', () => {
      swapTo(qtyFormHtml(t, action));
      container.querySelector('#tr-qty-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const items = (t.inventory_transfer_items || []).map((i, idx) => ({ sku: i.sku, sentQty: Number(f['q' + idx].value), receivedQty: Number(f['q' + idx].value) }));
        const save = f.querySelector('button[type=submit]');
        save.disabled = true;
        try {
          if (action === 'ship') await shipTransfer(t.id, items); else await receiveTransfer(t.id, items);
          done(action === 'ship' ? 'Shipped — now In Transit.' : 'Received.');
        } catch (err) { fail(err); save.disabled = false; }
      });
    }));
    container.querySelector('[data-act="edit"]')?.addEventListener('click', () => {
      swapTo(editFormHtml(t));
      const linesBox = container.querySelector('#tr-edit-lines');
      (t.inventory_transfer_items || []).forEach((i) => addLine(linesBox, { sku: i.sku, qty: i.requested_qty }));
      container.querySelector('#tr-edit-add-line').addEventListener('click', () => addLine(linesBox));
      container.querySelector('#tr-edit-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const items = readLines(linesBox);
        if (!items.length) { toast('tr-msg', 'Add at least one item.', true); return; }
        const save = f.querySelector('button[type=submit]');
        save.disabled = true;
        try {
          await editTransferRequest(t.id, Number(f.fromBranchId.value), Number(f.toBranchId.value), items);
          done('Transfer updated.');
        } catch (err) { fail(err); save.disabled = false; }
      });
    });
  }

  ['tr-trace-search'].forEach((id) => document.getElementById(id).addEventListener('input', render));
  ['tr-f-status', 'tr-trace-from', 'tr-trace-to'].forEach((id) => document.getElementById(id).addEventListener('change', render));
  document.getElementById('tr-trace-clear').addEventListener('click', () => {
    document.getElementById('tr-trace-search').value = '';
    document.getElementById('tr-f-status').value = 'all';
    document.getElementById('tr-trace-from').value = '';
    document.getElementById('tr-trace-to').value = '';
    render();
  });

  // A clicked activity notification opens the transfer here in place (spec 321), or
  // via ?open=<id> when arriving from another page.
  window.__kmOpenRecord = (table, id) => { if (table !== 'inventory_transfers') return false; openDetailId = id; openDetail(id); return true; };

  await load();
  const deepLinkId = new URLSearchParams(window.location.search).get('open');
  if (deepLinkId) { openDetailId = deepLinkId; openDetail(deepLinkId); }
  subscribeToChanges(['inventory_transfers', 'inventory_transfer_items'], load);
}
</script>
</body>
</html>
