<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfers — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20261007b">
</head>
<body>
<main id="tf-root"><p class="muted">Loading…</p></main>

<script type="module">
import { initShell } from './js/shell.js?v=20261007b';
import * as api from './js/transfersApi.js?v=20261007b';
import { startTransfersPage } from './js/transfersPage.js?v=20261007b';

// Everyone with a login can open this page; what each person sees and can do inside it follows their role and branch --
// and is enforced by the database, not by this page.
// ?open=<transfer id> opens that transfer's card (used by activity notifications and links from other pages); ?sku=<sku> opens the SKU Trace.
const employee = await initShell('transfers');
if (employee) {
  await startTransfersPage({ root: document.getElementById('tf-root'), api, employee, search: location.search, hash: location.hash });
}
</script>
</body>
</html>
