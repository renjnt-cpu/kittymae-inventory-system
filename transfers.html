<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfers — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="tr-msg"></div>
  <div class="card">
    <h3>Request Transfer</h3>
    <form id="req-form">
      <div class="field"><label>From Branch *</label><select name="fromBranchId" id="from-branch" required></select></div>
      <div class="field"><label>To Branch *</label><select name="toBranchId" id="to-branch" required></select></div>
      <div id="req-lines"></div>
      <button type="button" class="btn small secondary" id="add-line">+ Add Item</button>
      <button class="btn" type="submit">Request Transfer</button>
    </form>
  </div>
  <h2>Transfers</h2>
  <div id="transfer-active"><div class="muted">Loading…</div></div>

  <details class="card" style="margin-top:16px;">
    <summary style="cursor:pointer;font-weight:bold;">Cancelled / Rejected <span class="muted" id="tr-cancelled-count" style="font-weight:normal;"></span></summary>
    <div id="transfer-cancelled" style="margin-top:10px;"></div>
  </details>

  <h3 style="margin-top:20px;">Received — by Branch</h3>
  <div id="transfer-received-by-branch"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import {
  getBranches, listTransfers, createTransferRequest, editTransferRequest, approveTransfer, startPreparingTransfer,
  shipTransfer, receiveTransfer, rejectTransfer, cancelTransfer, subscribeToChanges, searchProducts,
} from './js/api.js';
import { branchBadge, branchOptionStyle } from './js/branchColors.js';

const STATUS_BADGE = {
  Draft: 'pending', Requested: 'pending', Approved: 'pending', Preparing: 'pending',
  'In Transit': 'transit', Received: 'ok', Rejected: 'low', Cancelled: 'low',
};

const employee = await initShell('transfers');
if (employee) {
  const branches = await getBranches();
  const byId = Object.fromEntries(branches.map((b) => [b.id, b.name]));
  let allTransfers = []; // so handleAction's 'edit' case can look up a transfer's own from/to/items by id
  // Requesting is now open to any branch staff again (Ren, 2026-09-16: "since
  // everyone can access now ERP they can also request in transfers") -- reversing the
  // earlier same-day tightening. create_transfer_request() enforces the actual rule
  // server-side: non-Admin/Manager/unscoped-position staff must have their own branch
  // as either end of the transfer. Approve/Reject/Cancel-of-someone-else's-request
  // stay Admin/Manager only, unchanged.

  ['from-branch', 'to-branch'].forEach((id) => {
    document.getElementById(id).innerHTML = branches.map((b) => '<option value="' + b.id + '" style="' + branchOptionStyle(b.id, branches) + '">' + esc(b.name) + '</option>').join('');
  });

  addLine(document.getElementById('req-lines'));
  document.getElementById('add-line').addEventListener('click', () => addLine(document.getElementById('req-lines')));
  // container param lets the Edit-transfer inline form (Admin only, see handleAction's
  // 'edit' case below) reuse the exact same row markup/autocomplete for its own item
  // list instead of duplicating it.
  function addLine(container, prefill) {
    const div = document.createElement('div');
    div.className = 'line-row';
    div.style.cssText = 'display:flex;gap:8px;align-items:flex-end;';
    div.innerHTML = '<div class="field" style="width:200px;position:relative;">' +
        '<label>SKU</label>' +
        '<input type="text" class="line-sku" autocomplete="off" placeholder="Type a SKU or item name…" required value="' + esc(prefill ? prefill.sku : '') + '">' +
        '<div class="line-sku-name muted" style="font-size:11px;"></div>' +
        '<div class="line-sku-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;"></div>' +
      '</div>' +
      '<div class="field" style="width:80px;"><label>Qty</label><input type="number" class="line-qty" min="1" required value="' + (prefill ? prefill.qty : '') + '"></div>' +
      '<button type="button" class="btn small secondary" onclick="this.closest(\'.line-row\').remove()">Remove</button>';
    container.appendChild(div);
    attachSkuAutocomplete(div);
  }

  // Same SKU autocomplete pattern as Layaway/POS Walk-In's item rows (movement.html's
  // original) -- lets whoever's requesting pick a real SKU instead of typing one that
  // might not match anything, without changing what actually gets submitted (still
  // just the .line-sku input's value).
  function attachSkuAutocomplete(row) {
    const skuInput = row.querySelector('.line-sku');
    const skuSuggest = row.querySelector('.line-sku-suggest');
    const skuNamePreview = row.querySelector('.line-sku-name');
    let searchToken = 0, searchTimer = null;
    function hide() { skuSuggest.style.display = 'none'; skuSuggest.innerHTML = ''; }
    function pick(p) {
      skuInput.value = p.sku;
      skuNamePreview.textContent = p.item_name + (p.category || p.product_line ? ' · ' + (p.category || p.product_line) : '');
      hide();
    }
    function renderSuggestions(matches) {
      if (!matches.length) { hide(); return; }
      skuSuggest.innerHTML = matches.map((p) =>
        '<div data-sku="' + esc(p.sku) + '" style="padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;">' +
          '<strong>' + esc(p.sku) + '</strong> — ' + esc(p.item_name) +
          (p.category || p.product_line ? '<div class="muted" style="font-size:11px;">' + esc(p.category || p.product_line) + '</div>' : '') +
        '</div>'
      ).join('');
      skuSuggest.style.display = '';
      skuSuggest.querySelectorAll('[data-sku]').forEach((el, i) => {
        el.addEventListener('mousedown', (ev) => { ev.preventDefault(); pick(matches[i]); });
      });
    }
    skuInput.addEventListener('input', () => {
      skuNamePreview.textContent = '';
      const q = skuInput.value.trim();
      clearTimeout(searchTimer);
      if (!q) { hide(); return; }
      searchTimer = setTimeout(async () => {
        const token = ++searchToken;
        try {
          const results = await searchProducts(q);
          if (token !== searchToken) return;
          renderSuggestions(results);
          const exact = results.find((p) => p.sku.toLowerCase() === q.toLowerCase());
          if (exact) skuNamePreview.textContent = exact.item_name + (exact.category || exact.product_line ? ' · ' + (exact.category || exact.product_line) : '');
        } catch (err) { /* a failed lookup shouldn't block typing a SKU by hand */ }
      }, 200);
    });
  }

  document.getElementById('req-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const items = Array.from(document.querySelectorAll('#req-lines .line-row')).map((row) => ({
      sku: row.querySelector('.line-sku').value.trim(),
      qty: Number(row.querySelector('.line-qty').value),
    }));
    try {
      await createTransferRequest(Number(f.fromBranchId.value), Number(f.toBranchId.value), items);
      toast('tr-msg', 'Transfer requested.', false);
      f.reset();
      document.getElementById('req-lines').innerHTML = '';
      addLine(document.getElementById('req-lines'));
      await loadTransfers();
    } catch (err) {
      toast('tr-msg', String(err.message || err), true);
    }
  });

  await loadTransfers();
  subscribeToChanges(['inventory_transfers', 'inventory_transfer_items'], loadTransfers);

  // Three buckets instead of one flat list (Ren, 2026-09-16: "make a folder to those
  // cancel request. other folder per branch for received") -- Active covers every
  // in-progress status, Cancelled/Rejected is one collapsed folder, and Received gets
  // its own folder per receiving branch so "what has branch X gotten over time" is a
  // one-click answer instead of scrolling a mixed list. The 3 buckets are a full,
  // non-overlapping partition of every status in the CHECK constraint.
  async function loadTransfers() {
    const activeBox = document.getElementById('transfer-active');
    activeBox.innerHTML = '<div class="muted">Loading…</div>';
    try {
      allTransfers = await listTransfers();
      const active = allTransfers.filter((t) => !['Received', 'Rejected', 'Cancelled'].includes(t.status));
      const cancelled = allTransfers.filter((t) => ['Rejected', 'Cancelled'].includes(t.status));
      const received = allTransfers.filter((t) => t.status === 'Received');

      activeBox.innerHTML = active.length ? active.map(renderTransfer).join('') : '<p class="muted">No active transfers.</p>';

      document.getElementById('tr-cancelled-count').textContent = '(' + cancelled.length + ')';
      document.getElementById('transfer-cancelled').innerHTML = cancelled.length
        ? cancelled.map(renderTransfer).join('')
        : '<p class="muted">None.</p>';

      const byBranch = {};
      received.forEach((t) => { (byBranch[t.to_branch_id] = byBranch[t.to_branch_id] || []).push(t); });
      const branchIds = Object.keys(byBranch).map(Number).sort((a, b) => (byId[a] || '').localeCompare(byId[b] || ''));
      const branchBox = document.getElementById('transfer-received-by-branch');
      branchBox.innerHTML = branchIds.length
        ? branchIds.map((bid) =>
            '<details class="card" style="margin-top:10px;">' +
              '<summary style="cursor:pointer;font-weight:bold;">' + esc(byId[bid] || 'Unknown Branch') + ' <span class="muted" style="font-weight:normal;">(' + byBranch[bid].length + ')</span></summary>' +
              '<div style="margin-top:10px;">' + byBranch[bid].map(renderTransfer).join('') + '</div>' +
            '</details>'
          ).join('')
        : '<p class="muted">No received transfers yet.</p>';

      wireActions();
    } catch (err) {
      activeBox.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  function renderTransfer(t) {
    const canActOnFrom = employee.role === 'Admin' || employee.role === 'Manager' ||
      (employee.role === 'Branch Supervisor' && employee.branch_id === t.from_branch_id);
    const canActOnTo = employee.role === 'Admin' || employee.role === 'Manager' ||
      (employee.role === 'Branch Supervisor' && employee.branch_id === t.to_branch_id);
    const isAdminManager = employee.role === 'Admin' || employee.role === 'Manager';
    // Maker-checker: whoever requested this transfer can't also approve it -- a
    // different Admin/Manager has to (see approve_transfer()'s own server-side check,
    // which this UI gate just mirrors so the button isn't shown only to fail).
    // Approval is Admin/Manager-only now -- Branch Supervisor lost it along with
    // request access (Ren: "only 2 admin can process... preparing and approved").
    const isRequester = t.requested_by === employee.id;
    const canApprove = !isRequester && isAdminManager;
    const canShip = !isRequester && canActOnFrom;

    let actions = '';
    if (t.status === 'Requested') {
      if (canApprove) actions += btn('Approve', 'approve', t.id);
      else if (isRequester) actions += '<span class="muted" style="font-size:11px;">Awaiting approval from someone else</span> ';
      // Edit is deliberately narrower than everything else here -- Admin only (Ren,
      // 2026-09-16: "add edit transfer only me can edit"), matching
      // edit_transfer_request's own server-side gate, and only while still
      // Requested -- once approved/prepared/shipped, cancel and re-request instead.
      if (employee.role === 'Admin') actions += btn('Edit', 'edit', t.id, true);
      if (isAdminManager) actions += btn('Reject', 'reject', t.id, true);
    }
    if (t.status === 'Approved' && canActOnFrom) actions += btn('Start Preparing', 'prepare', t.id);
    if ((t.status === 'Approved' || t.status === 'Preparing')) {
      if (canShip) actions += btn('Ship', 'ship', t.id);
      else if (isRequester) actions += '<span class="muted" style="font-size:11px;">Awaiting shipping from someone else</span> ';
    }
    if (t.status === 'In Transit' && canActOnTo) actions += btn('Receive', 'receive', t.id);
    if (['Draft', 'Requested', 'Approved', 'Preparing'].includes(t.status) && isAdminManager) actions += btn('Cancel', 'cancel', t.id, true);

    const items = t.inventory_transfer_items.map((i) =>
      '<tr><td data-label="SKU">' + esc(i.sku) + '</td><td data-label="Requested">' + i.requested_qty + '</td><td data-label="Sent">' + (i.sent_qty ?? '—') + '</td><td data-label="Received">' + (i.received_qty ?? '—') +
      '</td><td data-label="Discrepancy">' + (i.discrepancy_qty ? '<span class="badge low">' + i.discrepancy_qty + '</span>' : '—') + '</td></tr>'
    ).join('');

    return '<div class="card" data-transfer-id="' + t.id + '">' +
      '<h3>' + branchBadge(esc, byId[t.from_branch_id], t.from_branch_id, branches) + ' → ' + branchBadge(esc, byId[t.to_branch_id], t.to_branch_id, branches) +
      ' &nbsp; <span class="badge ' + (STATUS_BADGE[t.status] || 'pending') + '">' + esc(t.status) + '</span>' +
      (t.has_discrepancy ? ' <span class="badge low">DISCREPANCY</span>' : '') + '</h3>' +
      '<p class="muted" style="margin:-6px 0 8px;font-size:12px;">Prepared by ' + esc(t.requester ? t.requester.full_name : '—') +
        (t.approver ? ' · Approved by ' + esc(t.approver.full_name) : '') + '</p>' +
      '<div class="table-scroll"><table><tr><th>SKU</th><th>Requested</th><th>Sent</th><th>Received</th><th>Discrepancy</th></tr>' + items + '</table></div>' +
      '<div class="tr-actions" style="margin-top:8px;">' + actions + '</div>' +
      '<div class="tr-inline" style="margin-top:8px;"></div>' +
      '</div>';
  }
  function btn(label, action, id, secondary) {
    return '<button class="btn small' + (secondary ? ' secondary' : '') + '" data-action="' + action + '" data-id="' + id + '">' + label + '</button> ';
  }

  function wireActions() {
    document.querySelectorAll('[data-action]').forEach((el) => el.addEventListener('click', () => handleAction(el.dataset.action, el.dataset.id)));
  }

  async function handleAction(action, transferId) {
    const card = document.querySelector('[data-transfer-id="' + transferId + '"]');
    const inline = card.querySelector('.tr-inline');
    try {
      if (action === 'approve') { await approveTransfer(transferId); return refresh(); }
      if (action === 'prepare') { await startPreparingTransfer(transferId); return refresh(); }
      if (action === 'reject') { await rejectTransfer(transferId, prompt('Reason for rejecting?') || ''); return refresh(); }
      if (action === 'cancel') { await cancelTransfer(transferId, prompt('Reason for cancelling?') || ''); return refresh(); }
      if (action === 'edit') {
        const t = allTransfers.find((x) => x.id === transferId);
        if (!t) return;
        inline.innerHTML = '';
        const form = document.createElement('form');
        form.id = 'edit-transfer-form';
        form.innerHTML =
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<div class="field"><label>From Branch *</label><select name="fromBranchId" required>' +
              branches.map((b) => '<option value="' + b.id + '" style="' + branchOptionStyle(b.id, branches) + '"' + (b.id === t.from_branch_id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
            '</select></div>' +
            '<div class="field"><label>To Branch *</label><select name="toBranchId" required>' +
              branches.map((b) => '<option value="' + b.id + '" style="' + branchOptionStyle(b.id, branches) + '"' + (b.id === t.to_branch_id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
            '</select></div>' +
          '</div>' +
          '<div class="edit-transfer-lines" style="margin-top:8px;"></div>';
        inline.appendChild(form);
        const linesBox = form.querySelector('.edit-transfer-lines');
        t.inventory_transfer_items.forEach((i) => addLine(linesBox, { sku: i.sku, qty: i.requested_qty }));
        const btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:6px;margin-top:8px;';
        btnRow.innerHTML =
          '<button type="button" class="btn small secondary" id="edit-add-line">+ Add Item</button>' +
          '<button class="btn small" type="submit">Save Changes</button>' +
          '<button type="button" class="btn small secondary" id="edit-cancel">Cancel</button>';
        form.appendChild(btnRow);
        form.querySelector('#edit-add-line').addEventListener('click', () => addLine(linesBox));
        form.querySelector('#edit-cancel').addEventListener('click', () => { inline.innerHTML = ''; });
        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const items = Array.from(linesBox.querySelectorAll('.line-row')).map((row) => ({
            sku: row.querySelector('.line-sku').value.trim(),
            qty: Number(row.querySelector('.line-qty').value),
          }));
          try {
            await editTransferRequest(transferId, Number(form.fromBranchId.value), Number(form.toBranchId.value), items);
            inline.innerHTML = '';
            refresh();
          } catch (err) {
            toast('tr-msg', String(err.message || err), true);
          }
        });
      }
      if (action === 'ship' || action === 'receive') {
        const rows = Array.from(card.querySelectorAll('tbody tr, table tr')).slice(1); // skip header row
        const skus = Array.from(card.querySelectorAll('table td:first-child')).map((td) => td.textContent);
        const requestedOrSent = Array.from(card.querySelectorAll('table td:nth-child(' + (action === 'ship' ? 2 : 3) + ')')).map((td) => Number(td.textContent));
        inline.innerHTML = '<form id="qty-form">' +
          skus.map((sku, i) => '<div class="field" style="width:120px;"><label>' + esc(sku) + '</label><input type="number" name="' + esc(sku) + '" value="' + (requestedOrSent[i] || 0) + '" min="0" required></div>').join('') +
          '<button class="btn small" type="submit">Confirm ' + (action === 'ship' ? 'Ship' : 'Receive') + '</button></form>';
        inline.querySelector('#qty-form').addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const f = ev.target;
          const items = skus.map((sku) => ({ sku, sentQty: Number(f[sku].value), receivedQty: Number(f[sku].value) }));
          if (action === 'ship') await shipTransfer(transferId, items);
          else await receiveTransfer(transferId, items);
          refresh();
        });
      }
    } catch (err) {
      toast('tr-msg', String(err.message || err), true);
    }
  }
  function refresh() { toast('tr-msg', 'Updated.', false); loadTransfers(); }
}
</script>
</body>
</html>
