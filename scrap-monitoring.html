<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap Monitoring — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20261025a">
<link rel="stylesheet" href="css/sm.css?v=20261025a">
</head>
<body>
<main id="sm-root"><p class="muted">Loading…</p></main>

<script type="module">
import { initShell } from './js/shell.js?v=20261025a';
import * as api from './js/smApi.js?v=20261025a';
import { startSmPage } from './js/smPage.js?v=20261025a';

// Scrap Monitoring (Ren, 2026-10-24): one place to see the scrap every branch has recorded in the POS (Branches > Scrap) -- what is still held and for how long, what was sold or disposed
// of, who bought it and what they still owe -- without retyping any of it. The branches keep recording scrap in the POS exactly as before; this page reads those records and adds the sale,
// disposal, payment, approval and audit layer on top. What each person sees and may do is decided by the scrap_monitor.* keys (Position Access Matrix) and enforced by the database
// (migrations 253-256), not by this page.
const employee = await initShell('scrap-monitoring');
if (employee) {
  await startSmPage({ root: document.getElementById('sm-root'), api, employee, search: location.search, hash: location.hash });
}
</script>
</body>
</html>
