<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBC Monitoring — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css?v=20260925g">
</head>
<body>
<main>
  <div id="lbc-msg"></div>
  <!-- Same Form Drawer / Detail Drawer flow as POS, Pull Out Item, Refunds (Ren,
       2026-09-25: "make it the same design of POS plus sign once click show the
       details") -- primary action at the top, Summary tiles, Search & Filters, then
       the records; the Add form and every shipment's full details + actions live in
       a right-side drawer instead of always-visible on the page. -->
  <div class="module-topbar"><div></div><div style="text-align:right;">
    <button type="button" class="btn" id="lbc-new-btn">+ Add Shipment</button>
  </div></div>
  <div class="tiles" id="lbc-tiles"></div>
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="min-width:200px;"><label>Search</label><input type="text" id="f-search" placeholder="Order ID, customer, tracking #, remittance #…"></div>
      <div class="field"><label>Status</label><select id="f-status"><option value="all">All</option></select></div>
      <div class="field"><label>Remitted</label><select id="f-remitted"><option value="all">All</option><option value="yes">Yes</option><option value="no">No</option></select></div>
      <div class="field"><label>Payment Type</label><select id="f-payment-type"><option value="all">All</option></select></div>
      <div class="field"><label>From</label><input type="date" id="f-from"></div>
      <div class="field"><label>To</label><input type="date" id="f-to"></div>
      <span id="lbc-sort-slot"></span>
      <button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>
    </div>
  </div>
  <div id="lbc-active"></div>
  <div id="lbc-list"><div class="muted">Loading…</div></div>

  <details class="card exp" style="margin-top:16px;">
    <summary><span class="exp-arrow" aria-hidden="true">▸</span>SF Paid <span class="exp-count" id="lbc-sfpaid-count"></span></summary>
    <div class="exp-body" id="lbc-sfpaid-list"></div>
  </details>

  <details class="card exp" style="margin-top:10px;">
    <summary><span class="exp-arrow" aria-hidden="true">▸</span>Remitted <span class="exp-count" id="lbc-remitted-count"></span></summary>
    <div class="exp-body" id="lbc-remitted-list"></div>
  </details>

  <div class="drawer-backdrop" id="lbc-form-backdrop"></div>
  <div class="drawer" id="lbc-form-drawer">
    <div class="drawer-header"><h3>Add Shipment</h3><button type="button" class="drawer-close" id="lbc-form-close" aria-label="Close">✕</button></div>
    <div class="drawer-body">
      <p class="muted" style="margin-top:0;">A parcel shipped via LBC for an online order.</p>
      <form id="lbc-form" style="display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;">
        <div class="drawer-section">
          <h4>Order</h4>
          <div class="field"><label>Order ID *</label><input type="text" name="orderId" required></div>
          <div class="field"><label>Customer Name *</label><input type="text" name="customerName" required></div>
          <div class="field"><label>Branch</label><select name="branchId" id="lbc-form-branch"></select></div>
        </div>
        <div class="drawer-section">
          <h4>Shipment</h4>
          <div class="field"><label>Tracking Number</label><input type="text" name="trackingNumber"></div>
          <div class="field"><label>Ship Date</label><input type="date" name="shipDate"></div>
          <div class="field"><label>Payment Type</label><select name="paymentType" id="lbc-form-payment-type"></select></div>
          <div class="field"><label>COD Amount (PHP)</label><input type="number" name="codAmount" step="0.01" min="0"></div>
          <div class="field"><label>Notes</label><input type="text" name="notes"></div>
        </div>
      </form>
    </div>
    <div class="drawer-footer">
      <button class="btn" type="submit" form="lbc-form" id="lbc-submit-btn">Add Shipment</button>
      <button type="button" class="btn secondary" id="lbc-form-cancel">Cancel</button>
    </div>
  </div>
  <div class="drawer-backdrop" id="lbc-detail-backdrop"></div>
  <div class="drawer" id="lbc-detail-drawer">
    <div class="drawer-header"><div><h3 id="lbc-detail-title">Shipment Details</h3><div class="muted" id="lbc-detail-sub"></div></div><button type="button" class="drawer-close" id="lbc-detail-close" aria-label="Close">✕</button></div>
    <div class="drawer-body" id="lbc-detail-body"></div>
  </div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js?v=20260925g';
import { getBranches, listLbcShipments, createLbcShipment, updateLbcShipment, setLbcStatus, setLbcRemitted, deleteLbcShipment, subscribeToChanges } from './js/api.js?v=20260925g';
import { branchBadge, branchOptionStyle } from './js/branchColors.js?v=20260925g';
import { activeFiltersHtml, emptyStateHtml, wireProxyButtons, sortControlHtml, wireSortControl, applySort, byText, byNumber, byDate, localDateStr } from './js/uiKit.js?v=20260925g';

// Global Filter + Sort rules (Ren, 2026-09-21, section 14: LBC Monitoring is explicitly
// named in the spec).
const LBC_SORT_FIELDS = [
  { key: 'ship_date', label: 'Ship Date' }, { key: 'order_id', label: 'Order ID' }, { key: 'customer_name', label: 'Customer' },
  { key: 'tracking_number', label: 'Tracking #' }, { key: 'cod_amount', label: 'COD Amount' }, { key: 'status', label: 'Status' },
];
const LBC_SORT_COMPARATORS = {
  ship_date: byDate('ship_date'), order_id: byText('order_id'), customer_name: byText('customer_name'),
  tracking_number: byText('tracking_number'), cod_amount: byNumber('cod_amount'), status: byText('status'),
};

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const STATUSES = ['Shipped', 'In Transit', 'Delivered', 'Returned to Sender'];
const STATUS_BADGE = { Shipped: 'pending', 'In Transit': 'transit', Delivered: 'ok', 'Returned to Sender': 'low' };
const STATUS_OPTIONS = (selected) => STATUSES.map((s) => '<option' + (s === selected ? ' selected' : '') + '>' + s + '</option>').join('');
// Ren, 2026-09-25: "add dropdown if COD AND SF PAID" -- "SF PAID" mirrors the shorthand
// already used in Pancake's own order notes (fully paid, nothing to collect on delivery).
const PAYMENT_TYPES = ['COD', 'SF PAID'];
const PAYMENT_TYPE_OPTIONS = (selected) => '<option value="">—</option>' + PAYMENT_TYPES.map((p) => '<option' + (p === selected ? ' selected' : '') + '>' + p + '</option>').join('');
const tile = (num, label) => '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';

const employee = await initShell('lbc');
if (employee) {
  // Ren, 2026-09-25: "give access to admin assistant, inventory staff, auditor, and both
  // supervisor" -- "both supervisor" is the Operations Supervisor / Inventory Supervisor
  // pair already used together everywhere else in this app (POSITION_MANAGERS), not the
  // Branch Supervisor role already covered above.
  const LBC_ACCESS_POSITIONS = ['Admin Assistant', 'Inventory Staff', 'Auditor', 'Operations Supervisor', 'Inventory Supervisor'];
  const hasAccess = ['Admin', 'Manager', 'Branch Supervisor'].includes(employee.role) ||
    LBC_ACCESS_POSITIONS.includes(employee.position) || (employee.extra_page_access || []).includes('lbc');

  if (!hasAccess) {
    document.querySelector('main').innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">LBC Monitoring is restricted to Admin, Manager, Branch Supervisor, Admin Assistant, Inventory Staff, Auditor, Operations Supervisor, Inventory Supervisor, or individually granted accounts.</p></div></div>';
  } else {
    const canDelete = ['Admin', 'Manager'].includes(employee.role);
    const branches = await getBranches();
    const branchOptions = (selected) => '<option value="">—</option>' + branches.map((b) =>
      '<option value="' + b.id + '"' + (b.id === selected ? ' selected' : '') + ' style="' + branchOptionStyle(b.id, branches) + '">' + esc(b.name) + '</option>'
    ).join('');
    document.getElementById('lbc-form-branch').innerHTML = branchOptions();
    document.getElementById('lbc-form-payment-type').innerHTML = PAYMENT_TYPE_OPTIONS();
    document.getElementById('f-status').innerHTML += STATUS_OPTIONS();
    document.getElementById('f-payment-type').innerHTML += PAYMENT_TYPES.map((p) => '<option>' + p + '</option>').join('');
    const sort = { field: 'ship_date', dir: 'desc' };
    document.getElementById('lbc-sort-slot').outerHTML = sortControlHtml(LBC_SORT_FIELDS, sort, 'lbc-sort-field', 'lbc-sort-dir');
    wireSortControl('lbc-sort-field', 'lbc-sort-dir', sort, render);

    // ---- form drawer ----
    const form = document.getElementById('lbc-form');
    form.shipDate.value = localDateStr();
    function openFormDrawer() {
      document.getElementById('lbc-form-backdrop').classList.add('open');
      document.getElementById('lbc-form-drawer').classList.add('open');
    }
    function closeFormDrawer() {
      document.getElementById('lbc-form-backdrop').classList.remove('open');
      document.getElementById('lbc-form-drawer').classList.remove('open');
    }
    document.getElementById('lbc-new-btn').addEventListener('click', openFormDrawer);
    document.getElementById('lbc-form-close').addEventListener('click', closeFormDrawer);
    document.getElementById('lbc-form-cancel').addEventListener('click', closeFormDrawer);
    document.getElementById('lbc-form-backdrop').addEventListener('click', closeFormDrawer);

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      const btn = document.getElementById('lbc-submit-btn');
      btn.disabled = true;
      try {
        const newId = await createLbcShipment({
          orderId: f.orderId.value.trim(), customerName: f.customerName.value.trim(),
          trackingNumber: f.trackingNumber.value.trim(), branchId: f.branchId.value ? Number(f.branchId.value) : null,
          shipDate: f.shipDate.value, codAmount: f.codAmount.value ? Number(f.codAmount.value) : null,
          paymentType: f.paymentType.value, notes: f.notes.value.trim(),
        });
        toast('lbc-msg', 'Shipment added.', false);
        f.reset();
        f.shipDate.value = localDateStr();
        closeFormDrawer();
        await load();
        // Same drawer system now shows the saved record right after adding it.
        if (newId != null) { openDetailId = newId; openDetail(newId); }
      } catch (err) {
        toast('lbc-msg', String(err.message || err), true);
      } finally {
        btn.disabled = false;
      }
    });

    // ---- detail drawer ----
    function closeDetailDrawer() {
      document.getElementById('lbc-detail-backdrop').classList.remove('open');
      document.getElementById('lbc-detail-drawer').classList.remove('open');
    }
    document.getElementById('lbc-detail-close').addEventListener('click', closeDetailDrawer);
    document.getElementById('lbc-detail-backdrop').addEventListener('click', closeDetailDrawer);
    let openDetailId = null;
    function openDetail(id) {
      const r = allRows.find((x) => String(x.id) === String(id));
      if (!r) return;
      document.getElementById('lbc-detail-title').textContent = r.order_id + ' — ' + r.customer_name;
      document.getElementById('lbc-detail-sub').textContent = r.status + (r.tracking_number ? ' · ' + r.tracking_number : '');
      const body = document.getElementById('lbc-detail-body');
      body.innerHTML = renderDetailBody(r);
      wireDetailBody(body, r);
      document.getElementById('lbc-detail-backdrop').classList.add('open');
      document.getElementById('lbc-detail-drawer').classList.add('open');
    }
    function refreshDetailIfOpen(id) {
      if (!document.getElementById('lbc-detail-drawer').classList.contains('open')) return;
      if (!allRows.find((x) => String(x.id) === String(id))) { closeDetailDrawer(); return; }
      openDetail(id);
    }

    let allRows = [];
    await load();
    subscribeToChanges('lbc_shipments', load);

    document.getElementById('f-search').addEventListener('input', render);
    document.getElementById('f-status').addEventListener('change', render);
    document.getElementById('f-remitted').addEventListener('change', render);
    document.getElementById('f-payment-type').addEventListener('change', render);
    document.getElementById('f-from').addEventListener('change', render);
    document.getElementById('f-to').addEventListener('change', render);
    document.getElementById('f-clear').addEventListener('click', () => {
      document.getElementById('f-search').value = '';
      document.getElementById('f-status').value = 'all';
      document.getElementById('f-remitted').value = 'all';
      document.getElementById('f-payment-type').value = 'all';
      document.getElementById('f-from').value = '';
      document.getElementById('f-to').value = '';
      render();
    });

    async function load() {
      const list = document.getElementById('lbc-list');
      try {
        allRows = await listLbcShipments();
        render();
        if (openDetailId != null) refreshDetailIfOpen(openDetailId);
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    function currentFilters() {
      return {
        q: document.getElementById('f-search').value.trim().toLowerCase(),
        status: document.getElementById('f-status').value,
        remitted: document.getElementById('f-remitted').value,
        paymentType: document.getElementById('f-payment-type').value,
        from: document.getElementById('f-from').value,
        to: document.getElementById('f-to').value,
      };
    }

    function render() {
      const f = currentFilters();
      let rows = allRows;
      if (f.q) rows = rows.filter((r) =>
        r.order_id.toLowerCase().includes(f.q) || r.customer_name.toLowerCase().includes(f.q) ||
        (r.tracking_number || '').toLowerCase().includes(f.q) || (r.remittance_number || '').toLowerCase().includes(f.q));
      if (f.status !== 'all') rows = rows.filter((r) => r.status === f.status);
      if (f.paymentType !== 'all') rows = rows.filter((r) => r.payment_type === f.paymentType);
      if (f.remitted !== 'all') rows = rows.filter((r) => r.remitted === (f.remitted === 'yes'));
      if (f.from) rows = rows.filter((r) => r.ship_date >= f.from);
      if (f.to) rows = rows.filter((r) => r.ship_date <= f.to);
      const hasFilters = !!(f.q || f.status !== 'all' || f.paymentType !== 'all' || f.remitted !== 'all' || f.from || f.to);

      const counts = STATUSES.reduce((acc, s) => { acc[s] = rows.filter((r) => r.status === s).length; return acc; }, {});
      // SF Paid shipments have nothing to collect on delivery, so they never count toward
      // outstanding COD (Ren, 2026-09-25: "no need to input remittance number").
      const outstanding = rows.filter((r) => r.status === 'Delivered' && !r.remitted && r.payment_type !== 'SF PAID').reduce((s, r) => s + Number(r.cod_amount || 0), 0);
      document.getElementById('lbc-tiles').innerHTML =
        tile(counts['Shipped'], 'Shipped') + tile(counts['In Transit'], 'In Transit') + tile(counts['Delivered'], 'Delivered') +
        tile(counts['Returned to Sender'], 'Returned') + tile(money(outstanding), 'COD Not Yet Remitted');
      const activeEl = document.getElementById('lbc-active');
      activeEl.innerHTML = activeFiltersHtml([
        { label: 'Search', value: esc(f.q) }, { label: 'Status', value: esc(f.status) }, { label: 'Payment Type', value: esc(f.paymentType) },
        { label: 'Remitted', value: f.remitted === 'all' ? '' : (f.remitted === 'yes' ? 'Yes' : 'No') },
        { label: 'From', value: esc(f.from) }, { label: 'To', value: esc(f.to) },
      ], 'f-clear');
      wireProxyButtons(activeEl);

      // Remitted shipments move out of the main list into their own folder below (Ren,
      // 2026-09-25: "once remitted move it to the remitted folder"); Search already
      // matches remittance_number above, so searching one surfaces it there as proof.
      // SF Paid shipments are pulled out first, ahead of the remitted/active split --
      // they never need a remittance number at all (Ren, 2026-09-25: "separate folder
      // once SF paid since no need to input remittance number").
      const sfPaidRows = rows.filter((r) => r.payment_type === 'SF PAID');
      const remaining = rows.filter((r) => r.payment_type !== 'SF PAID');
      const active = remaining.filter((r) => !r.remitted);
      const remittedRows = remaining.filter((r) => r.remitted);

      const rowHtml = (r) => {
        const remittedCell = r.payment_type === 'SF PAID'
          ? '<span class="muted">N/A</span>'
          : (r.status === 'Delivered' ? '<span class="badge ' + (r.remitted ? 'ok' : 'low') + '">' + (r.remitted ? 'Remitted' : 'Not yet') + '</span>' : '<span class="muted">—</span>');
        return '<tr' + (r.status === 'Returned to Sender' ? ' style="background:#fdecea;"' : '') + '>' +
          '<td data-label="Order ID / Customer">' + esc(r.order_id) + '<div class="muted" style="font-size:10px;">' + esc(r.customer_name) + '</div></td>' +
          '<td data-label="Tracking # / Branch" style="font-size:11px;">' + esc(r.tracking_number || '—') + '<div class="muted">' + (r.branches ? branchBadge(esc, r.branches.name, r.branch_id, branches) : '') + '</div></td>' +
          '<td data-label="Ship Date">' + (r.ship_date || '—') + '</td>' +
          '<td data-label="COD Amount">' + money(r.cod_amount) + (r.payment_type ? '<div class="muted" style="font-size:10px;">' + esc(r.payment_type) + '</div>' : '') + '</td>' +
          '<td data-label="Status"><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></td>' +
          '<td data-label="Remitted">' + remittedCell + '</td>' +
          '<td class="full-row"><button type="button" class="btn small secondary" data-act="view-details" data-id="' + r.id + '">View Details</button></td>' +
        '</tr>';
      };
      const tableHtml = (rowsForTable) => {
        let totalCod = 0, totalRemitted = 0;
        rowsForTable.forEach((r) => { totalCod += Number(r.cod_amount || 0); if (r.remitted) totalRemitted += Number(r.cod_amount || 0); });
        return '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
          '<thead><tr><th>Order ID / Customer</th><th>Tracking # / Branch</th><th>Ship Date</th><th>COD Amount</th><th>Status</th><th>Remitted</th><th></th></tr></thead>' +
          '<tbody>' + rowsForTable.map(rowHtml).join('') + '</tbody>' +
          '<tfoot><tr style="font-weight:bold;background:#f7f7f7;">' +
            '<td colspan="3">Qty: ' + rowsForTable.length + '</td>' +
            '<td>' + money(totalCod) + '<div class="muted" style="font-size:10px;font-weight:normal;">' + money(totalRemitted) + ' remitted</div></td>' +
            '<td colspan="3"></td>' +
          '</tr></tfoot>' +
          '</table></div>';
      };

      const activeSorted = applySort(active, sort, LBC_SORT_COMPARATORS);
      const list = document.getElementById('lbc-list');
      list.innerHTML = !activeSorted.length
        ? emptyStateHtml({ message: hasFilters ? 'No shipments match these filters.' : 'No shipments yet.', hasFilters, clearId: 'f-clear', createLabel: '+ Add Shipment', createId: 'lbc-new-btn' })
        : tableHtml(activeSorted);
      wireProxyButtons(list);

      const sfPaidSorted = applySort(sfPaidRows, sort, LBC_SORT_COMPARATORS);
      document.getElementById('lbc-sfpaid-count').textContent = '(' + sfPaidSorted.length + ')';
      const sfPaidList = document.getElementById('lbc-sfpaid-list');
      sfPaidList.innerHTML = !sfPaidSorted.length
        ? emptyStateHtml({ message: hasFilters ? 'No SF Paid shipments match these filters.' : 'No SF Paid shipments yet.', hasFilters, clearId: 'f-clear' })
        : tableHtml(sfPaidSorted);
      wireProxyButtons(sfPaidList);

      const remittedSorted = applySort(remittedRows, sort, LBC_SORT_COMPARATORS);
      document.getElementById('lbc-remitted-count').textContent = '(' + remittedSorted.length + ')';
      const remittedList = document.getElementById('lbc-remitted-list');
      remittedList.innerHTML = !remittedSorted.length
        ? emptyStateHtml({ message: hasFilters ? 'No remitted shipments match these filters.' : 'No remitted shipments yet.', hasFilters, clearId: 'f-clear' })
        : tableHtml(remittedSorted);
      wireProxyButtons(remittedList);

      document.querySelectorAll('[data-act="view-details"]').forEach((btn) => btn.addEventListener('click', () => { openDetailId = btn.dataset.id; openDetail(openDetailId); }));
    }

    // ---- detail drawer body ----
    const kv = (label, value) => value ? '<div class="drawer-kv"><span>' + label + '</span><b>' + value + '</b></div>' : '';
    function renderDetailBody(r) {
      const nextStatus = { Shipped: 'In Transit', 'In Transit': 'Delivered' }[r.status];
      return '<div class="drawer-section"><h4>Order</h4>' +
        '<div class="drawer-kv"><span>Order ID</span><b>' + esc(r.order_id) + '</b></div>' +
        '<div class="drawer-kv"><span>Customer</span><b>' + esc(r.customer_name) + '</b></div>' +
        '<div class="drawer-kv"><span>Branch</span><b>' + (r.branches ? branchBadge(esc, r.branches.name, r.branch_id, branches) : '—') + '</b></div>' +
      '</div>' +
      '<div class="drawer-section"><h4>Shipment</h4>' +
        '<div class="drawer-kv"><span>Tracking #</span><b>' + esc(r.tracking_number || '—') + '</b></div>' +
        '<div class="drawer-kv"><span>Ship Date</span><b>' + (r.ship_date || '—') + '</b></div>' +
        '<div class="drawer-kv"><span>Payment Type</span><b>' + esc(r.payment_type || '—') + '</b></div>' +
        '<div class="drawer-kv"><span>COD Amount</span><b>' + money(r.cod_amount) + '</b></div>' +
        '<div class="drawer-kv"><span>Status</span><b><span class="badge ' + (STATUS_BADGE[r.status] || 'pending') + '">' + esc(r.status) + '</span></b></div>' +
        kv('Notes', esc(r.notes || '')) +
        '<div class="drawer-kv"><span>Added By</span><b>' + (r.creator ? esc(r.creator.full_name) : '—') + '</b></div>' +
      '</div>' +
      '<div class="drawer-section"><h4>Remittance</h4>' +
        (r.payment_type === 'SF PAID'
          ? '<div class="drawer-kv"><span>Remitted</span><b><span class="badge ok">N/A — Shipping Fee Paid</span></b></div>'
          : '<div class="drawer-kv"><span>Remitted</span><b><span class="badge ' + (r.remitted ? 'ok' : 'low') + '">' + (r.remitted ? 'Yes' : 'Not yet') + '</span></b></div>' +
            (r.remitted ? '<div class="drawer-kv"><span>Remittance #</span><b>' + esc(r.remittance_number || '—') + '</b></div>' : '') +
            (r.remitted_date ? '<div class="drawer-kv"><span>Remitted Date</span><b>' + r.remitted_date + '</b></div>' : '')) +
      '</div>' +
      '<div class="drawer-section"><h4>Actions</h4>' +
        (nextStatus ? '<button type="button" class="btn small" data-act="advance" data-next="' + nextStatus + '">Mark ' + nextStatus + '</button> ' : '') +
        (r.status !== 'Returned to Sender' && r.status !== 'Delivered' ? '<button type="button" class="btn small secondary" data-act="rts">RTS</button> ' : '') +
        (r.status === 'Delivered' && r.payment_type !== 'SF PAID' ? '<button type="button" class="btn small secondary" data-act="toggle-remit">' + (r.remitted ? 'Unmark Remit' : 'Mark Remitted') + '</button> ' : '') +
        '<button type="button" class="btn small secondary" data-act="edit-toggle">Edit</button> ' +
        (canDelete ? '<button type="button" class="btn small secondary" data-act="delete">Delete</button>' : '') +
      '</div>' +
      '<div id="lbc-edit-section" style="display:none;"></div>';
    }

    function editFormHtml(r) {
      return '<div class="drawer-section"><h4>Edit</h4>' +
        '<form id="lbc-edit-form" style="display:flex;flex-direction:column;gap:8px;">' +
          '<div class="field"><label>Order ID</label><input type="text" name="orderId" value="' + esc(r.order_id) + '" required></div>' +
          '<div class="field"><label>Customer</label><input type="text" name="customerName" value="' + esc(r.customer_name) + '" required></div>' +
          '<div class="field"><label>Tracking #</label><input type="text" name="trackingNumber" value="' + esc(r.tracking_number || '') + '"></div>' +
          '<div class="field"><label>Branch</label><select name="branchId">' + branchOptions(r.branch_id) + '</select></div>' +
          '<div class="field"><label>Ship Date</label><input type="date" name="shipDate" value="' + (r.ship_date || '') + '"></div>' +
          '<div class="field"><label>Payment Type</label><select name="paymentType" id="lbc-edit-payment-type">' + PAYMENT_TYPE_OPTIONS(r.payment_type) + '</select></div>' +
          '<div class="field"><label>COD Amount</label><input type="number" name="codAmount" step="0.01" min="0" value="' + (r.cod_amount ?? '') + '"></div>' +
          '<div class="field"><label>Status</label><select name="status">' + STATUS_OPTIONS(r.status) + '</select></div>' +
          '<div class="field" id="lbc-edit-remittance-field" style="' + (r.payment_type === 'SF PAID' ? 'display:none;' : '') + '"><label>Remittance Number</label><input type="text" name="remittanceNumber" value="' + esc(r.remittance_number || '') + '" placeholder="Leave blank = not remitted"></div>' +
          '<div class="field"><label>Notes</label><input type="text" name="notes" value="' + esc(r.notes || '') + '"></div>' +
          '<div style="display:flex;gap:6px;"><button class="btn small" type="submit">Save</button><button class="btn small secondary" type="button" data-act="edit-cancel">Cancel</button></div>' +
        '</form>' +
      '</div>';
    }

    function wireDetailBody(container, r) {
      const done = async (msg) => { toast('lbc-msg', msg, false); await load(); };
      const fail = (err) => toast('lbc-msg', String(err.message || err), true);

      container.querySelector('[data-act="advance"]')?.addEventListener('click', async (ev) => {
        try { await setLbcStatus(r.id, ev.target.dataset.next); await done('Updated.'); } catch (err) { fail(err); }
      });
      container.querySelector('[data-act="rts"]')?.addEventListener('click', async () => {
        try { await setLbcStatus(r.id, 'Returned to Sender'); await done('Marked returned to sender.'); } catch (err) { fail(err); }
      });
      container.querySelector('[data-act="toggle-remit"]')?.addEventListener('click', async () => {
        try {
          if (r.remitted) {
            if (!confirm('Unmark this shipment as remitted? This clears its remittance number too.')) return;
            await setLbcRemitted(r.id, null);
          } else {
            const remittanceNumber = prompt('Remittance Number from LBC for tracking # ' + (r.tracking_number || '(none on file)') + ':', '');
            if (remittanceNumber === null) return; // cancelled
            if (!remittanceNumber.trim()) { toast('lbc-msg', 'A remittance number is required to mark this remitted.', true); return; }
            await setLbcRemitted(r.id, remittanceNumber.trim());
          }
          await done('Updated.');
        } catch (err) { fail(err); }
      });
      container.querySelector('[data-act="delete"]')?.addEventListener('click', async () => {
        if (!confirm('Delete this shipment?')) return;
        try { await deleteLbcShipment(r.id); closeDetailDrawer(); await done('Deleted.'); } catch (err) { fail(err); }
      });
      container.querySelector('[data-act="edit-toggle"]')?.addEventListener('click', () => {
        const section = container.querySelector('#lbc-edit-section');
        section.innerHTML = editFormHtml(r);
        section.style.display = '';
        section.querySelector('[data-act="edit-cancel"]').addEventListener('click', () => { section.style.display = 'none'; section.innerHTML = ''; });
        // SF Paid never needs a remittance number -- hide the field live as the dropdown
        // changes, not just on initial render (Ren, 2026-09-25).
        section.querySelector('#lbc-edit-payment-type').addEventListener('change', (ev) => {
          const field = section.querySelector('#lbc-edit-remittance-field');
          field.style.display = ev.target.value === 'SF PAID' ? 'none' : '';
          if (ev.target.value === 'SF PAID') field.querySelector('input').value = '';
        });
        section.querySelector('#lbc-edit-form').addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const f = ev.target;
          // Remitted is no longer its own field to keep in sync -- a Remittance Number
          // present IS what "remitted" means (Ren, 2026-09-25: "once input the
          // remittance number considered as remitted"), same rule the quick Mark
          // Remitted prompt already follows.
          const remittanceNumber = f.remittanceNumber.value.trim();
          const saveBtn = f.querySelector('button[type=submit]');
          saveBtn.disabled = true;
          try {
            await updateLbcShipment(r.id, {
              orderId: f.orderId.value.trim(), customerName: f.customerName.value.trim(),
              trackingNumber: f.trackingNumber.value.trim(), branchId: f.branchId.value ? Number(f.branchId.value) : null,
              shipDate: f.shipDate.value || null, codAmount: f.codAmount.value ? Number(f.codAmount.value) : null,
              paymentType: f.paymentType.value,
              status: f.status.value, remitted: !!remittanceNumber,
              remittedDate: remittanceNumber ? (r.remitted_date || localDateStr()) : null,
              remittanceNumber,
              notes: f.notes.value.trim(),
            });
            toast('lbc-msg', 'Shipment updated.', false);
            await load();
            refreshDetailIfOpen(r.id);
          } catch (err) {
            fail(err);
            saveBtn.disabled = false;
          }
        });
      });
    }
  }
}
</script>
</body>
</html>
