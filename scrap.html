<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="scrap-msg"></div>
  <div id="scrap-root"></div>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { getBranches, listScrapEntries, getScrapBalances, createScrapEntry, deleteScrapEntry } from './js/api.js';

const weight = (n) => n === null || n === undefined ? '—' : Number(n).toLocaleString('en-PH', { minimumFractionDigits: 3 }) + 'g';
const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });

const employee = await initShell('scrap');
if (employee) {
  const root = document.getElementById('scrap-root');

  if (!['Admin', 'Manager', 'Branch Supervisor'].includes(employee.role)) {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">Scrap monitoring is restricted to Admin, Manager, or Branch Supervisor accounts.</p></div></div>';
  } else {
    const isScoped = employee.role === 'Branch Supervisor';
    const branches = await getBranches();
    const branchById = Object.fromEntries(branches.map((b) => [b.id, b.name]));
    const branchOptions = (selected) => branches.map((b) =>
      '<option value="' + b.id + '"' + (b.id === selected ? ' selected' : '') + '>' + esc(b.name) + '</option>'
    ).join('');
    // null = All Branches (Admin/Manager only — Branch Supervisor is always locked to their own).
    let selectedBranch = isScoped ? employee.branch_id : null;

    root.innerHTML =
      '<div class="card">' +
        '<h3>Branch</h3>' +
        '<div id="branch-buttons" style="display:flex;gap:8px;flex-wrap:wrap;"></div>' +
      '</div>' +
      '<div class="layout-2col">' +
        '<div class="layout-2col-side">' +
          '<div class="card">' +
            '<h3>Add Scrap Entry</h3>' +
            '<form id="scrap-form" style="flex-direction:column;align-items:stretch;">' +
              '<div class="field"><label>Branch *</label><select name="branchId" required>' + branchOptions(isScoped ? employee.branch_id : null) + '</select></div>' +
              '<div class="field"><label>Date</label><input type="date" name="entryDate" value="' + new Date().toISOString().slice(0, 10) + '"></div>' +
              '<div class="field"><label>Type *</label><select name="entryType"><option value="In">In (bought from customer)</option><option value="Out">Out (sold to refiner)</option></select></div>' +
              '<div class="field"><label>Metal *</label><select name="metalType" required><option>Gold</option><option>Silver</option></select></div>' +
              '<div class="field"><label>Karat / Purity</label><input type="text" name="karat" placeholder="e.g. 18K, 925"></div>' +
              '<div class="field"><label>Weight (grams) *</label><input type="number" name="weightGrams" step="0.001" min="0" required></div>' +
              '<div class="field"><label>Price per Gram (PHP)</label><input type="number" name="pricePerGram" step="0.01" min="0"></div>' +
              '<div class="field"><label>Total Amount (PHP)</label><input type="number" name="totalAmount" step="0.01" min="0"></div>' +
              '<div class="field"><label>Source</label><input type="text" name="source" placeholder="Walk-in, buyback, refiner name…"></div>' +
              '<div class="field"><label>Notes</label><input type="text" name="notes"></div>' +
              '<button class="btn" type="submit">Add Entry</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="layout-2col-main">' +
          '<h3>Current Balance <span class="muted" style="font-weight:normal;">— weight on hand</span></h3>' +
          '<div id="scrap-balance" class="card"><div class="muted">Loading…</div></div>' +
          '<div class="card">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
              '<div class="field" style="min-width:200px;"><label>Search</label><input type="text" id="f-search" placeholder="Source, notes…"></div>' +
              '<div class="field"><label>Metal</label><select id="f-metal"><option value="all">All</option><option>Gold</option><option>Silver</option></select></div>' +
              '<div class="field"><label>Type</label><select id="f-type"><option value="all">All</option><option>In</option><option>Out</option></select></div>' +
              '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
            '</div>' +
          '</div>' +
          '<div id="scrap-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
      '</div>';

    const branchForm = document.getElementById('scrap-form');
    renderBranchButtons();
    syncFormBranch();

    document.getElementById('scrap-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await createScrapEntry({
          branchId: Number(f.branchId.value),
          entryDate: f.entryDate.value, entryType: f.entryType.value, metalType: f.metalType.value,
          karat: f.karat.value.trim(), weightGrams: Number(f.weightGrams.value),
          pricePerGram: f.pricePerGram.value ? Number(f.pricePerGram.value) : null,
          totalAmount: f.totalAmount.value ? Number(f.totalAmount.value) : null,
          source: f.source.value.trim(), notes: f.notes.value.trim(),
        });
        toast('scrap-msg', 'Entry added.', false);
        f.reset();
        f.entryDate.value = new Date().toISOString().slice(0, 10);
        syncFormBranch();
        await load();
      } catch (err) {
        toast('scrap-msg', String(err.message || err), true);
      }
    });

    let allEntries = [];
    await load();

    document.getElementById('f-search').addEventListener('input', render);
    document.getElementById('f-metal').addEventListener('change', render);
    document.getElementById('f-type').addEventListener('change', render);
    document.getElementById('f-clear').addEventListener('click', () => {
      document.getElementById('f-search').value = '';
      document.getElementById('f-metal').value = 'all';
      document.getElementById('f-type').value = 'all';
      render();
    });

    function renderBranchButtons() {
      const box = document.getElementById('branch-buttons');
      const options = isScoped ? branches.filter((b) => b.id === employee.branch_id) : [{ id: null, name: 'All Branches' }, ...branches];
      box.innerHTML = options.map((b) =>
        '<button type="button" class="btn ' + (b.id === selectedBranch ? '' : 'secondary') + '" data-id="' + b.id + '">' + esc(b.name) + '</button>'
      ).join('');
      box.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', async () => {
        selectedBranch = btn.dataset.id === 'null' ? null : Number(btn.dataset.id);
        renderBranchButtons();
        syncFormBranch();
        await load();
      }));
    }

    /** Add-form's branch always follows the active tab — picking "All Branches" leaves
     * it free to choose; picking one branch locks the form to that branch. */
    function syncFormBranch() {
      const sel = branchForm.branchId;
      if (selectedBranch !== null) { sel.value = String(selectedBranch); sel.disabled = true; }
      else { sel.disabled = isScoped; if (isScoped) sel.value = String(employee.branch_id); }
    }

    async function load() {
      const list = document.getElementById('scrap-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        const [entries, balances] = await Promise.all([listScrapEntries(), getScrapBalances()]);
        allEntries = entries;
        renderBalance(balances);
        render();
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    function renderBalance(balances) {
      const box = document.getElementById('scrap-balance');
      const rows = selectedBranch === null ? balances : balances.filter((b) => b.branch_id === selectedBranch);
      if (!rows.length) { box.innerHTML = '<p class="muted">No scrap recorded yet.</p>'; return; }
      box.innerHTML = '<div class="table-scroll"><table><tr>' + (selectedBranch === null ? '<th>Branch</th>' : '') + '<th>Metal</th><th>Balance</th></tr>' +
        rows.map((b) => '<tr>' + (selectedBranch === null ? '<td data-label="Branch">' + esc(branchById[b.branch_id] || '') + '</td>' : '') + '<td data-label="Metal">' + esc(b.metal_type) + '</td><td data-label="Balance">' + weight(b.balance_grams) + '</td></tr>').join('') +
        '</table></div>';
    }

    function render() {
      let rows = selectedBranch === null ? allEntries : allEntries.filter((r) => r.branch_id === selectedBranch);
      const fSearch = document.getElementById('f-search').value.trim().toLowerCase();
      const fMetal = document.getElementById('f-metal').value;
      const fType = document.getElementById('f-type').value;

      if (fSearch) rows = rows.filter((r) => (r.source || '').toLowerCase().includes(fSearch) || (r.notes || '').toLowerCase().includes(fSearch));
      if (fMetal !== 'all') rows = rows.filter((r) => r.metal_type === fMetal);
      if (fType !== 'all') rows = rows.filter((r) => r.entry_type === fType);

      const list = document.getElementById('scrap-list');
      if (!rows.length) { list.innerHTML = '<p class="muted">No scrap entries for this filter.</p>'; return; }
      list.innerHTML = '<div class="table-scroll"><table><tr>' + (selectedBranch === null ? '<th>Branch</th>' : '') + '<th>Date</th><th>Type</th><th>Metal</th><th>Karat</th><th>Weight</th><th>Price/g</th><th>Total</th><th>Source</th><th>Notes</th><th></th></tr>' +
        rows.map((r) =>
          '<tr>' +
            (selectedBranch === null ? '<td data-label="Branch">' + esc(r.branches?.name || '') + '</td>' : '') +
            '<td data-label="Date">' + (r.entry_date || '—') + '</td>' +
            '<td data-label="Type"><span class="badge ' + (r.entry_type === 'In' ? 'ok' : 'pending') + '">' + esc(r.entry_type) + '</span></td>' +
            '<td data-label="Metal">' + esc(r.metal_type) + '</td>' +
            '<td data-label="Karat">' + esc(r.karat || '') + '</td>' +
            '<td data-label="Weight">' + weight(r.weight_grams) +
              (r.creator ? '<div class="muted" style="font-size:10px;margin-top:2px;">Added by ' + esc(r.creator.full_name) + '</div>' : '') +
            '</td>' +
            '<td data-label="Price/g">' + money(r.price_per_gram) + '</td>' +
            '<td data-label="Total">' + money(r.total_amount) + '</td>' +
            '<td data-label="Source">' + esc(r.source || '') + '</td>' +
            '<td data-label="Notes">' + esc(r.notes || '') + '</td>' +
            '<td data-label="Actions" style="white-space:nowrap;"><button class="btn small secondary" data-id="' + r.id + '" data-act="delete">Delete</button></td>' +
          '</tr>'
        ).join('') + '</table></div>';

      list.querySelectorAll('[data-act="delete"]').forEach((btn) => btn.addEventListener('click', async () => {
        if (!confirm('Delete this scrap entry?')) return;
        try { await deleteScrapEntry(btn.dataset.id); toast('scrap-msg', 'Deleted.', false); await load(); }
        catch (err) { toast('scrap-msg', String(err.message || err), true); }
      }));
    }
  }
}
</script>
</body>
</html>
