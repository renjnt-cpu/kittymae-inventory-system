<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Out Item — Kittymae Jewels System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="po-msg"></div>
  <div class="tiles" id="po-tiles"></div>
  <!-- Summary -> Search -> active-filter strip -> form -> records (MASTER UI rules 2/4/28) -->
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="po-f-search" placeholder="SKU, item, branch, reason, who…"></div>
      <button type="button" class="btn small secondary" id="po-f-clear">Clear Filters</button>
    </div>
  </div>
  <div id="po-active"></div>
  <div class="card">
    <h3 style="margin-top:0;">Pull Out an Item</h3>
    <p class="muted" style="margin-top:-4px;">For a piece that's temporarily leaving the shelf — sent for cleaning/repair, borrowed for display — and expected back in stock later. This is not a sale and not a data-entry correction.</p>
    <form id="po-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field"><label>Branch *</label><select name="branchId" id="po-branch" required></select></div>
      <div class="field" style="flex:2;min-width:180px;position:relative;">
        <label>SKU *</label>
        <input type="text" id="po-sku" autocomplete="off" placeholder="Type a SKU or item name…" required>
        <div id="po-sku-name" class="muted" style="font-size:11px;"></div>
        <div id="po-sku-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;"></div>
      </div>
      <div class="field" style="width:70px;"><label>Qty *</label><input type="number" name="qty" min="1" value="1" required></div>
      <div class="field" style="width:150px;"><label>Expected Return</label><input type="date" name="expectedReturnDate"></div>
      <div class="field" style="flex:1;min-width:180px;"><label>Reason *</label><input type="text" name="reason" required placeholder="e.g. Sent for cleaning"></div>
      <div class="field" style="flex:1;min-width:150px;"><label>Notes</label><input type="text" name="notes"></div>
      <button class="btn" type="submit">Pull Out</button>
    </form>
  </div>

  <h2>Currently Out</h2>
  <div id="po-out-list"><div class="muted">Loading…</div></div>

  <details class="card" style="margin-top:16px;">
    <summary style="cursor:pointer;font-weight:bold;">Returned <span class="muted" id="po-returned-count" style="font-weight:normal;"></span></summary>
    <div id="po-returned-list" style="margin-top:10px;"></div>
  </details>
</main>

<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { getBranches, searchProducts, listPullOuts, createPullOut, returnPullOut, subscribeToChanges } from './js/api.js';
import { activeFiltersHtml, emptyStateHtml, wireProxyButtons } from './js/uiKit.js';

const fmtDate = (s) => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-PH', { dateStyle: 'medium' }) : '—';
const fmtDateTime = (s) => s ? new Date(s).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const tile = (num, label) => '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
const todayStr = () => new Date().toISOString().slice(0, 10);

const employee = await initShell('pull-out');
if (employee) {
  // Matches return_pull_out()'s own server-side gate exactly (Ren, 2026-09-21:
  // "Admin/Manager only, like Correction") -- returning an item stays Admin/Manager,
  // separate from who can CREATE one below.
  const isAdminManager = ['Admin', 'Manager'].includes(employee.role);
  // Matches create_pull_out()'s own server-side gate: inventory.pull_out.create
  // (Ren, 2026-09-21, spec 289-302 -- Supervisor/Auditor/Inventory Staff/Owner, via
  // HR position mapping, not hardcoded role check). Adjustable anytime from the
  // Position Access Matrix without a code change.
  const canCreate = employee.permissions.includes('inventory.pull_out.create');
  const branches = await getBranches();
  document.getElementById('po-branch').innerHTML = branches.map((b) =>
    '<option value="' + b.id + '"' + (b.id === employee.branch_id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
  ).join('');

  const form = document.getElementById('po-form');
  if (!canCreate) {
    form.closest('.card').innerHTML = '<h3 style="margin-top:0;">Pull Out an Item</h3><p class="muted">Your role/position isn\'t authorized to pull out an item. Ask an Admin if you think this is wrong.</p>';
  }

  let all = [];
  async function load() {
    try {
      all = await listPullOuts();
      render();
    } catch (err) {
      document.getElementById('po-out-list').innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  function rowHtml(r, showReturnAction) {
    const overdue = r.status === 'Out' && r.expected_return_date && r.expected_return_date < todayStr();
    return '<tr' + (overdue ? ' style="background:#fdecea;"' : '') + '>' +
      '<td data-label="SKU">' + esc(r.sku) + '</td>' +
      '<td data-label="Item" class="full-row">' + esc(r.products?.item_name || '—') + '</td>' +
      '<td data-label="Branch">' + esc(r.branches?.name || '—') + '</td>' +
      '<td data-label="Qty">' + r.qty + '</td>' +
      '<td data-label="Reason" class="full-row">' + esc(r.reason) + (r.notes ? '<div class="muted" style="font-size:10px;">Note: ' + esc(r.notes) + '</div>' : '') + '</td>' +
      '<td data-label="Pulled By">' + esc(r.puller?.full_name || '—') + '<div class="muted" style="font-size:10px;">' + fmtDateTime(r.pulled_at) + '</div></td>' +
      '<td data-label="Expected Return">' + (r.expected_return_date ? fmtDate(r.expected_return_date) + (overdue ? ' <span class="badge low">Overdue</span>' : '') : '—') + '</td>' +
      (showReturnAction
        ? '<td class="full-row">' + (isAdminManager ? '<button type="button" class="btn small secondary" data-act="return" data-id="' + r.id + '">Mark Returned</button>' : '') + '</td>'
        : '<td data-label="Returned By" class="full-row">' + esc(r.returner?.full_name || '—') + '<div class="muted" style="font-size:10px;">' + fmtDateTime(r.returned_at) + '</div></td>') +
    '</tr>';
  }

  function render() {
    // One search drives the tiles, both lists and the "Returned" count together
    // (MASTER UI rules 6/19/20).
    const q = document.getElementById('po-f-search').value.trim().toLowerCase();
    const matches = (r) => !q || [r.sku, r.products?.item_name, r.branches?.name, r.reason, r.notes, r.puller?.full_name, r.returner?.full_name]
      .some((v) => (v || '').toLowerCase().includes(q));
    const rows = all.filter(matches);
    const out = rows.filter((r) => r.status === 'Out');
    const returned = rows.filter((r) => r.status === 'Returned');
    const overdueCount = out.filter((r) => r.expected_return_date && r.expected_return_date < todayStr()).length;

    document.getElementById('po-tiles').innerHTML =
      tile(out.length, 'Currently Out') + tile(out.reduce((s, r) => s + r.qty, 0), 'Qty Out') + tile(overdueCount, 'Overdue');
    const activeEl = document.getElementById('po-active');
    activeEl.innerHTML = activeFiltersHtml([{ label: 'Search', value: esc(q) }], 'po-f-clear');
    wireProxyButtons(activeEl);

    const outList = document.getElementById('po-out-list');
    outList.innerHTML = !out.length
      ? emptyStateHtml({ message: q ? 'No pulled-out items match this search.' : 'Nothing currently pulled out.', hasFilters: !!q, clearId: 'po-f-clear' })
      : '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
        '<thead><tr><th>SKU</th><th>Item</th><th>Branch</th><th>Qty</th><th>Reason</th><th>Pulled By</th><th>Expected Return</th><th></th></tr></thead>' +
        '<tbody>' + out.map((r) => rowHtml(r, true)).join('') + '</tbody></table></div>';
    wireProxyButtons(outList);

    document.getElementById('po-returned-count').textContent = '(' + returned.length + ')';
    const returnedList = document.getElementById('po-returned-list');
    returnedList.innerHTML = !returned.length
      ? emptyStateHtml({ message: q ? 'No returned items match this search.' : 'No returned items yet.', hasFilters: !!q, clearId: 'po-f-clear' })
      : '<div class="table-scroll table-2col"><table style="table-layout:fixed;overflow-wrap:break-word;">' +
        '<thead><tr><th>SKU</th><th>Item</th><th>Branch</th><th>Qty</th><th>Reason</th><th>Pulled By</th><th>Expected Return</th><th>Returned By</th></tr></thead>' +
        '<tbody>' + returned.map((r) => rowHtml(r, false)).join('') + '</tbody></table></div>';
    wireProxyButtons(returnedList);

    document.querySelectorAll('[data-act="return"]').forEach((btn) => btn.addEventListener('click', async () => {
      if (!confirm('Mark this item as returned to stock?')) return;
      try {
        await returnPullOut(Number(btn.dataset.id));
        toast('po-msg', 'Marked returned — back in Available stock.', false);
        await load();
      } catch (err) {
        toast('po-msg', String(err.message || err), true);
      }
    }));
  }

  // SKU autocomplete -- same pattern as layawayTab.js's attachSkuAutocomplete.
  const skuInput = document.getElementById('po-sku');
  const skuSuggest = document.getElementById('po-sku-suggest');
  const skuNamePreview = document.getElementById('po-sku-name');
  let pickedSku = null;
  let searchTimer = null, searchToken = 0;
  function hideSuggest() { skuSuggest.style.display = 'none'; skuSuggest.innerHTML = ''; }
  skuInput.addEventListener('input', () => {
    pickedSku = null;
    skuNamePreview.textContent = '';
    const q = skuInput.value.trim();
    clearTimeout(searchTimer);
    if (!q) { hideSuggest(); return; }
    const token = ++searchToken;
    searchTimer = setTimeout(async () => {
      try {
        const results = await searchProducts(q);
        if (token !== searchToken) return;
        if (!results.length) { hideSuggest(); return; }
        skuSuggest.innerHTML = results.slice(0, 8).map((p) =>
          '<div class="po-sku-opt" data-sku="' + esc(p.sku) + '" data-name="' + esc(p.item_name) + '" style="padding:6px 8px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:12px;">' +
            esc(p.sku) + ' — ' + esc(p.item_name) +
          '</div>'
        ).join('');
        skuSuggest.style.display = '';
        skuSuggest.querySelectorAll('.po-sku-opt').forEach((el) => el.addEventListener('mousedown', (ev) => {
          ev.preventDefault();
          skuInput.value = el.dataset.sku;
          pickedSku = el.dataset.sku;
          skuNamePreview.textContent = el.dataset.name;
          hideSuggest();
        }));
      } catch (err) { /* non-critical -- leave suggestions empty rather than block typing */ }
    }, 200);
  });
  skuInput.addEventListener('blur', () => setTimeout(hideSuggest, 150));

  if (canCreate) form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const btn = f.querySelector('button[type=submit]');
    const sku = pickedSku || skuInput.value.trim();
    if (!sku) { toast('po-msg', 'Pick a SKU from the suggestions.', true); return; }
    const qty = Number(f.qty.value);
    const reason = f.reason.value.trim();
    if (!qty || qty <= 0) { toast('po-msg', 'Qty must be a positive number.', true); return; }
    if (!reason) { toast('po-msg', 'Reason is required.', true); return; }
    btn.disabled = true;
    try {
      await createPullOut({
        sku, branchId: Number(f.branchId.value), qty, reason,
        expectedReturnDate: f.expectedReturnDate.value || null, notes: f.notes.value.trim(),
      });
      toast('po-msg', 'Item pulled out.', false);
      f.reset();
      pickedSku = null;
      skuNamePreview.textContent = '';
      document.getElementById('po-branch').value = employee.branch_id || branches[0].id;
      await load();
    } catch (err) {
      toast('po-msg', String(err.message || err), true);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('po-f-search').addEventListener('input', render);
  document.getElementById('po-f-clear').addEventListener('click', () => {
    document.getElementById('po-f-search').value = '';
    render();
  });

  await load();
  subscribeToChanges('pull_out_records', load);
}
</script>
</body>
</html>
