<script type="module">
import { initShell, toast, esc } from './js/shell.js';
import { listTransactions, listAccounts, createAccount, updateAccountNumber, createTransaction, importTransactions, updateTransactionReconciliation, deleteTransaction, subscribeToChanges } from './js/api.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });

// ---- CSV parsing (GCash/Bank statement export) ----
// Handles RFC4180 quoting (commas/newlines inside quoted fields) since a
// Description like "Transfer from 09xxx to 09xxx, ref: ..." can legitimately
// contain a comma.
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip, \n below ends the row */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// GCash's own export (and most bank statements) lead with a few title/date-range
// rows before the real header -- scan for the row that actually has Description +
// Reference columns rather than assuming row 0 is the header.
function findHeaderRow(rows) {
  for (let i = 0; i < rows.length; i++) {
    const lower = rows[i].map((c) => c.trim().toLowerCase());
    if (lower.some((c) => c.includes('description')) && lower.some((c) => c.includes('reference'))) return i;
  }
  return -1;
}

function colIndex(headerRow, patterns) {
  const lower = headerRow.map((c) => c.trim().toLowerCase());
  for (const p of patterns) {
    const idx = lower.findIndex((c) => c === p);
    if (idx !== -1) return idx;
  }
  for (const p of patterns) {
    const idx = lower.findIndex((c) => c.includes(p));
    if (idx !== -1) return idx;
  }
  return -1;
}

function parseAmount(s) {
  if (!s || !s.trim()) return null;
  const n = Number(s.replace(/,/g, '').trim());
  return Number.isFinite(n) ? n : null;
}

function parseDatetime(s) {
  s = (s || '').trim();
  if (!s) return null;
  const m = s.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return m[1] + 'T' + String(m[2]).padStart(2, '0') + ':' + m[3] + ':' + (m[4] || '00');
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString();
}

/** Parses a GCash/bank statement CSV into row objects ready for importTransactions().
 * FB Name / Customer / Order ID columns are optional -- present if the uploaded file
 * is an already-partially-reconciled master sheet, absent for a raw GCash export. */
function parseStatementCsv(text) {
  const rows = parseCSV(text);
  const headerIdx = findHeaderRow(rows);
  if (headerIdx === -1) throw new Error('Could not find the header row -- expected columns like Date and Time, Description, Reference No., Debit, Credit, Balance.');
  const header = rows[headerIdx];
  const idx = {
    datetime: colIndex(header, ['date and time', 'date/time', 'date']),
    description: colIndex(header, ['description']),
    reference: colIndex(header, ['reference no.', 'reference number', 'reference']),
    debit: colIndex(header, ['debit']),
    credit: colIndex(header, ['credit']),
    balance: colIndex(header, ['balance']),
    fbName: colIndex(header, ['fb name', 'facebook name']),
    customerName: colIndex(header, ['customer']),
    orderId: colIndex(header, ['order id', 'order']),
  };
  if (idx.datetime === -1 || idx.description === -1) {
    throw new Error('Could not find Date and Time / Description columns in the file header.');
  }
  const parsed = [];
  let skipped = 0;
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r.some((c) => c && c.trim())) continue;
    const datetime = parseDatetime(r[idx.datetime]);
    const description = (r[idx.description] || '').trim();
    if (!datetime && !description) { skipped++; continue; }
    parsed.push({
      datetime: datetime || new Date().toISOString(),
      description: description || null,
      referenceNumber: idx.reference !== -1 ? (r[idx.reference] || '').trim() || null : null,
      debit: idx.debit !== -1 ? parseAmount(r[idx.debit]) : null,
      credit: idx.credit !== -1 ? parseAmount(r[idx.credit]) : null,
      balance: idx.balance !== -1 ? parseAmount(r[idx.balance]) : null,
      fbName: idx.fbName !== -1 ? (r[idx.fbName] || '').trim() || null : null,
      customerName: idx.customerName !== -1 ? (r[idx.customerName] || '').trim() || null : null,
      orderId: idx.orderId !== -1 ? (r[idx.orderId] || '').trim() || null : null,
    });
  }
  return { parsed, skipped };
}

// ---- .docx parsing (GCash's PDF statement converted to Word) ----
// Real samples show this format is genuinely inconsistent: the first page's rows land
// in a <w:tbl> inside a floating text box, a row in the middle can land as a plain
// tab-separated paragraph (Debit/Credit collapsed into one tab stop, losing which one
// it was), and later rows land in an ordinary body-level <w:tbl>. Rather than trust
// column position for Debit vs Credit (unreliable across these three shapes), this
// walks every row -- from any table anywhere in the document, or from a non-table
// paragraph containing tab stops -- and infers debit/credit from whether the running
// balance went down or up, seeded from the "STARTING BALANCE" figure GCash always
// prints at the top of the statement.
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

function docxCellText(el) {
  const ts = el.getElementsByTagNameNS(W_NS, 't');
  let s = '';
  for (const t of ts) s += t.textContent;
  return s.trim();
}

async function parseDocxStatement(file) {
  if (typeof JSZip === 'undefined') throw new Error('Word file support failed to load -- try again in a moment.');
  const zip = await JSZip.loadAsync(file);
  const docXmlFile = zip.file('word/document.xml');
  if (!docXmlFile) throw new Error('This does not look like a Word (.docx) file -- word/document.xml was not found inside it.');
  const xmlText = await docXmlFile.async('text');
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');

  const candidateRows = [];

  // Single depth-first walk in true document order -- rows must be collected in the
  // order they actually occur, not "every table row, then every paragraph row",
  // otherwise a tab-separated row sitting between two tables gets compared against
  // the wrong prior balance when inferring debit vs credit.
  function walkForRows(node) {
    for (const child of node.childNodes) {
      if (child.nodeType !== 1) continue;
      // mc:AlternateContent provides the SAME content twice -- mc:Choice for modern
      // Word, mc:Fallback (legacy VML) for old versions. Skip Fallback entirely or
      // every row inside it gets processed a second time.
      if (child.localName === 'Fallback') continue;
      if (child.localName === 'tbl') {
        const trs = child.getElementsByTagNameNS(W_NS, 'tr');
        for (const tr of trs) {
          const tcs = Array.from(tr.childNodes).filter((n) => n.localName === 'tc');
          candidateRows.push(tcs.map(docxCellText));
        }
        continue; // cells' own paragraphs never contain a loose transaction row
      }
      if (child.localName === 'p') {
        if (child.getElementsByTagNameNS(W_NS, 'tbl').length > 0) {
          walkForRows(child); // a floating table anchored inside this paragraph's runs
          continue;
        }
        if (child.getElementsByTagNameNS(W_NS, 'tab').length > 0) {
          const segments = [''];
          for (const rNode of child.childNodes) {
            if (rNode.localName !== 'r') continue;
            for (const rChild of rNode.childNodes) {
              if (rChild.localName === 'tab') segments.push('');
              else if (rChild.localName === 't') segments[segments.length - 1] += rChild.textContent;
            }
          }
          candidateRows.push(segments.map((s) => s.trim()));
        }
        continue;
      }
      walkForRows(child);
    }
  }
  const body = doc.getElementsByTagNameNS(W_NS, 'body')[0];
  if (body) walkForRows(body);

  // Seed the running balance from "STARTING BALANCE ... 35,929.58" wherever it appears.
  const flatText = xmlText.replace(/<[^>]+>/g, ' ');
  const startMatch = flatText.match(/STARTING\s*BALANCE[^0-9-]*([\d,]+\.\d{2})/i);
  let runningBalance = startMatch ? parseAmount(startMatch[1]) : null;

  const DATE_RE = /^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i;
  const parsed = [];
  for (const cells of candidateRows) {
    if (!cells.length) continue;
    const m = cells[0].match(DATE_RE);
    if (!m) continue; // header / STARTING BALANCE / ENDING BALANCE / Total rows all fail this

    let hour = parseInt(m[2], 10);
    const isPM = (m[4] || '').toUpperCase() === 'PM';
    if (isPM && hour < 12) hour += 12;
    if (!isPM && hour === 12) hour = 0;
    const datetime = m[1] + 'T' + String(hour).padStart(2, '0') + ':' + m[3] + ':00';

    let lastIdx = cells.length - 1;
    while (lastIdx > 0 && !cells[lastIdx]) lastIdx--;
    const balance = parseAmount(cells[lastIdx]);

    let amount = null;
    for (let i = lastIdx - 1; i >= 3; i--) {
      const v = parseAmount(cells[i]);
      if (v !== null) { amount = v; break; }
    }

    let debit = null, credit = null;
    if (amount !== null && balance !== null && runningBalance !== null) {
      if (balance < runningBalance - 0.001) debit = amount;
      else if (balance > runningBalance + 0.001) credit = amount;
    }
    if (balance !== null) runningBalance = balance;

    parsed.push({
      datetime, description: cells[1] || null, referenceNumber: cells[2] || null,
      debit, credit, balance,
    });
  }
  // Only the first chunk of the document (title/account-holder details before the
  // transaction table starts) is used for account auto-detection -- searching the
  // whole document risks a reference number or amount deep in the table coincidentally
  // matching a stored account number.
  return { parsed, skipped: 0, headerText: flatText.slice(0, 3000) };
}

function normalizeDigits(s) { return (s || '').replace(/\D/g, ''); }

// GCash's own export never states the account holder's number anywhere -- the only
// place it appears is inside a transaction's own Description, e.g. "Transfer from
// 09267352377 to 09267277179". Whichever end is the OWN account depends on direction:
// a credit means the second number received it (that's the own account), a debit means
// the first number sent it. The number that wins this way across the file is the
// account's own number.
function extractOwnerNumber(rows) {
  const tally = {};
  const re = /transfer from (\d{10,11}) to (\d{10,11})/i;
  for (const r of rows) {
    const m = (r.description || '').match(re);
    if (!m) continue;
    let candidate = null;
    if (r.credit != null) candidate = m[2];
    else if (r.debit != null) candidate = m[1];
    if (!candidate) continue;
    tally[candidate] = (tally[candidate] || 0) + 1;
  }
  let best = null, bestCount = 0;
  for (const num in tally) { if (tally[num] > bestCount) { best = num; bestCount = tally[num]; } }
  return best;
}

// Auto-detects which account a statement belongs to, so Import doesn't always require
// picking the account by hand. Only acts when exactly one account matches -- ambiguous
// or absent matches fall back to the existing manual dropdown, no guessing.
function detectAccountId(headerText, parsedRows, accounts) {
  const candidates = accounts.filter((a) => a.number);
  if (!candidates.length) return null;
  // A person can hold the same mobile number on both GCash and Maya -- the file's own
  // title ("GCash Transaction History" / a Maya export) breaks that tie safely instead
  // of leaving a genuine ambiguity unresolved.
  const typeHint = headerText && /gcash/i.test(headerText) ? 'GCash'
    : headerText && /\bmaya\b/i.test(headerText) ? 'Maya' : null;
  function matchByNumber(digits) {
    let found = candidates.filter((a) => normalizeDigits(a.number) === digits);
    if (found.length > 1 && typeHint) found = found.filter((a) => a.type === typeHint);
    return found.length === 1 ? found[0].id : null;
  }
  const ownerNumber = extractOwnerNumber(parsedRows);
  if (ownerNumber) {
    const id = matchByNumber(ownerNumber);
    if (id) return id;
  }
  // Fallback for formats that DO print an explicit number/name near the top (some bank
  // exports do, even though GCash's own export doesn't).
  if (headerText) {
    const mobileMatches = headerText.match(/09\d{2}[\s.-]?\d{3}[\s.-]?\d{4}/g) || [];
    for (const raw of mobileMatches) {
      const id = matchByNumber(normalizeDigits(raw));
      if (id) return id;
    }
    const headerDigits = normalizeDigits(headerText);
    let found2 = candidates.filter((a) => headerDigits.includes(normalizeDigits(a.number)));
    if (found2.length > 1 && typeHint) found2 = found2.filter((a) => a.type === typeHint);
    if (found2.length === 1) return found2[0].id;
  }
  return null;
}

const employee = await initShell('transactions');
if (employee) {
  const root = document.getElementById('transactions-root');
  const canManage = ['Admin', 'Manager'].includes(employee.role);
  const canReconcile = canManage || employee.position === 'Admin Assistant';

  if (!canReconcile) {
    root.innerHTML = '<div class="center-screen"><div><h2>No access</h2><p class="muted">Transactions is restricted to Admin, Manager, and Admin Assistant accounts.</p></div></div>';
  } else {
    let allAccounts = await listAccounts();
    const accountOptions = () => allAccounts.map((a) => '<option value="' + a.id + '">' + esc(a.name) + ' (' + esc(a.type) + ')</option>').join('');
    const accountLabel = (t) => t.accounts ? t.accounts.name : '—';
    // Each account gets its own consistent color derived from its name (not its type) --
    // otherwise all 4 GCash accounts render identically and look like one combined
    // account instead of 4 separate ones.
    const ACCOUNT_PALETTE = [
      { bg: '#e3edfd', fg: '#1a56b0' }, { bg: '#eaf6ec', fg: '#1e7d34' },
      { bg: '#fdecea', fg: '#b0301a' }, { bg: '#fff4e0', fg: '#a15c00' },
      { bg: '#f3e8fd', fg: '#6b21a8' }, { bg: '#e0f7fa', fg: '#00707a' },
      { bg: '#fce4ec', fg: '#ad1457' }, { bg: '#eef2ff', fg: '#3730a3' },
    ];
    function accountColorStyle(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      const c = ACCOUNT_PALETTE[hash % ACCOUNT_PALETTE.length];
      return 'background:' + c.bg + ';color:' + c.fg + ';';
    }

    root.innerHTML =
      '<div class="layout-2col">' +
        (canManage ?
          '<div class="layout-2col-side">' +
            '<div class="card">' +
              '<h3>Add Transaction</h3>' +
              '<p class="muted" style="margin-top:-4px;">A single manual entry — always money received.</p>' +
              '<form id="tx-form" style="flex-direction:column;align-items:stretch;">' +
                '<div class="field"><label>Account *</label><select name="accountId" required>' + accountOptions() + '</select></div>' +
                '<div class="field"><label>Date &amp; Time</label><input type="datetime-local" name="transactionDatetime"></div>' +
                '<div class="field"><label>Amount (PHP) *</label><input type="number" name="amount" step="0.01" min="0.01" required></div>' +
                '<div class="field"><label>Reference Number</label><input type="text" name="referenceNumber" placeholder="GCash ref # / bank ref"></div>' +
                '<div class="field"><label>FB Name</label><input type="text" name="fbName"></div>' +
                '<div class="field"><label>Customer Name</label><input type="text" name="customerName"></div>' +
                '<div class="field"><label>Order ID</label><input type="text" name="orderId"></div>' +
                '<div class="field"><label>Notes</label><input type="text" name="notes"></div>' +
                '<button class="btn" type="submit">Add Transaction</button>' +
              '</form>' +
            '</div>' +
            '<div class="card">' +
              '<h3>Import Statement (CSV or Word)</h3>' +
              '<p class="muted" style="margin-top:-4px;">Upload the exact GCash/bank statement export — Date and Time, Description, Reference No., Debit, Credit, Balance. A .docx statement (converted from PDF) also works — Debit vs Credit is inferred from the running balance, so double-check a few rows after importing.</p>' +
              '<div class="field"><label>Account *</label><select id="import-account">' + accountOptions() + '</select></div>' +
              '<div class="field"><label>File</label><input type="file" id="import-file" accept=".csv,.docx"></div>' +
              '<button class="btn small secondary" type="button" id="import-parse">Parse File</button>' +
              '<div id="import-preview" style="margin-top:8px;"></div>' +
            '</div>' +
            (employee.role === 'Admin' ?
              '<div class="card">' +
                '<h3>Add Account</h3>' +
                '<p class="muted" style="margin-top:-4px;">Add another account to the list above.</p>' +
                '<form id="account-form" style="flex-direction:column;align-items:stretch;">' +
                  '<div class="field"><label>Name *</label><input type="text" name="name" placeholder="e.g. GCash - Juan" required></div>' +
                  '<div class="field"><label>Type *</label><select name="type" required><option>GCash</option><option>BDO</option><option>BPI</option><option>Maya</option><option>Palawan Pay</option><option>PS Bank</option><option>Union Bank</option></select></div>' +
                  '<div class="field"><label>Mobile / Account Number</label><input type="text" name="number" placeholder="e.g. 09171234567"></div>' +
                  '<button class="btn small secondary" type="submit">Add Account</button>' +
                '</form>' +
              '</div>' +
              '<div class="card">' +
                '<h3>Account Numbers</h3>' +
                '<p class="muted" style="margin-top:-4px;">Set each account\'s real GCash mobile number or bank account number — Import Statement uses this to auto-detect which account a file belongs to.</p>' +
                '<div id="account-numbers"></div>' +
              '</div>'
            : '') +
          '</div>'
        : '') +
        '<div class="layout-2col-main">' +
          '<div class="tiles" id="tx-tiles"></div>' +
          '<div class="card">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
              '<div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="Description, reference, FB name, customer, order ID…"></div>' +
              '<div class="field"><label>Account</label><select id="f-account"><option value="all">All</option>' + accountOptions() + '</select></div>' +
              '<div class="field"><label>From</label><input type="datetime-local" id="f-from"></div>' +
              '<div class="field"><label>To</label><input type="datetime-local" id="f-to"></div>' +
              '<div class="field"><label><input type="checkbox" id="f-unreconciled" style="width:auto;"> Missing Order ID only</label></div>' +
              '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
            '</div>' +
          '</div>' +
          '<div id="tx-list"><div class="muted">Loading…</div></div>' +
        '</div>' +
      '</div>';

    let parsedRows = null, parsedSkipped = 0;

    if (canManage) {
      document.getElementById('tx-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        try {
          await createTransaction({
            accountId: Number(f.accountId.value),
            transactionDatetime: f.transactionDatetime.value ? new Date(f.transactionDatetime.value).toISOString() : null,
            amount: Number(f.amount.value), referenceNumber: f.referenceNumber.value.trim(),
            fbName: f.fbName.value.trim(), customerName: f.customerName.value.trim(), orderId: f.orderId.value.trim(),
            notes: f.notes.value.trim(),
          });
          toast('tx-msg', 'Transaction added.', false);
          f.reset();
          await load();
        } catch (err) {
          toast('tx-msg', String(err.message || err), true);
        }
      });

      const accountForm = document.getElementById('account-form');
      if (accountForm) accountForm.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        try {
          await createAccount({ name: f.name.value.trim(), type: f.type.value, number: f.number.value.trim() });
          toast('tx-msg', 'Account added.', false);
          f.reset();
          await refreshAccounts();
        } catch (err) {
          toast('tx-msg', String(err.message || err), true);
        }
      });

      async function refreshAccounts() {
        allAccounts = await listAccounts();
        document.querySelectorAll('#f-account, select[name="accountId"], #import-account').forEach((sel) => {
          const isFilter = sel.id === 'f-account';
          sel.innerHTML = (isFilter ? '<option value="all">All</option>' : '') + accountOptions();
        });
        renderAccountNumbers();
      }

      function renderAccountNumbers() {
        const el = document.getElementById('account-numbers');
        if (!el) return;
        el.innerHTML = allAccounts.map((a) =>
          '<form class="account-number-form" data-id="' + a.id + '" style="display:flex;gap:6px;align-items:center;padding:4px 0;">' +
            '<span style="flex:1;font-size:13px;">' + esc(a.name) + '</span>' +
            '<input type="text" name="number" value="' + esc(a.number || '') + '" placeholder="09XXXXXXXXX" style="width:140px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">' +
            '<button class="btn small secondary" type="submit">Save</button>' +
          '</form>'
        ).join('');
        el.querySelectorAll('.account-number-form').forEach((f) => f.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          try {
            await updateAccountNumber(f.dataset.id, f.number.value.trim());
            toast('tx-msg', 'Saved.', false);
            allAccounts = await listAccounts();
          } catch (err) {
            toast('tx-msg', String(err.message || err), true);
          }
        }));
      }
      if (employee.role === 'Admin') renderAccountNumbers();

      document.getElementById('import-parse').addEventListener('click', async () => {
        const fileInput = document.getElementById('import-file');
        const preview = document.getElementById('import-preview');
        const file = fileInput.files[0];
        if (!file) { toast('tx-msg', 'Choose a file first.', true); return; }
        try {
          const isDocx = file.name.toLowerCase().endsWith('.docx');
          let parsed, skipped, headerText;
          if (isDocx) {
            ({ parsed, skipped, headerText } = await parseDocxStatement(file));
          } else {
            const text = await file.text();
            ({ parsed, skipped } = parseStatementCsv(text));
            // The account-holder's mobile/account number is printed in the title rows
            // above the transaction table, not in any individual row.
            headerText = text.slice(0, 2000);
          }
          parsedRows = parsed;
          parsedSkipped = skipped;
          const creditCount = parsed.filter((r) => r.credit != null).length;
          const debitCount = parsed.filter((r) => r.debit != null).length;
          const unclear = parsed.filter((r) => r.credit == null && r.debit == null).length;

          let detectNote = '';
          const detectedId = detectAccountId(headerText, parsed, allAccounts);
          if (detectedId) {
            document.getElementById('import-account').value = String(detectedId);
            const acc = allAccounts.find((a) => a.id === detectedId);
            detectNote = '<p class="msg ok">Detected account from the file: <b>' + esc(acc.name) + '</b> — auto-selected above, double-check before importing.</p>';
          }

          preview.innerHTML = detectNote +
            '<p class="muted">Parsed ' + parsed.length + ' row(s) — ' + creditCount + ' credit, ' + debitCount + ' debit' +
            (unclear ? ', ' + unclear + ' unclear (check these after import)' : '') +
            (skipped ? ', ' + skipped + ' skipped (blank)' : '') + '.</p>' +
            (isDocx ? '<p class="muted" style="font-size:11px;">Debit/Credit inferred from the balance for Word imports — worth spot-checking a few rows.</p>' : '') +
            '<button class="btn small" type="button" id="import-confirm">Import ' + parsed.length + ' Row(s)</button>';
          document.getElementById('import-confirm').addEventListener('click', async () => {
            try {
              const count = await importTransactions(Number(document.getElementById('import-account').value), parsedRows);
              toast('tx-msg', 'Imported ' + count + ' transaction(s).', false);
              preview.innerHTML = '';
              fileInput.value = '';
              parsedRows = null;
              await load();
            } catch (err) {
              toast('tx-msg', String(err.message || err), true);
            }
          });
        } catch (err) {
          // Shown inline (not just the top-of-page toast, which auto-dismisses after
          // 5s and is easy to miss while scrolled down next to this button).
          preview.innerHTML = '<p class="msg error">' + esc(err.message || err) + '</p>';
          toast('tx-msg', String(err.message || err), true);
        }
      });
    }

    let allTx = [];
    await load();
    subscribeToChanges('transactions', load);

    ['f-search', 'f-account', 'f-from', 'f-to', 'f-unreconciled'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener(id === 'f-search' ? 'input' : 'change', render);
    });
    document.getElementById('f-clear').addEventListener('click', () => {
      document.getElementById('f-search').value = '';
      document.getElementById('f-account').value = 'all';
      document.getElementById('f-from').value = '';
      document.getElementById('f-to').value = '';
      document.getElementById('f-unreconciled').checked = false;
      render();
    });

    async function load() {
      const list = document.getElementById('tx-list');
      list.innerHTML = '<div class="muted">Loading…</div>';
      try {
        allTx = await listTransactions();
        render();
      } catch (err) {
        list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }

    function render() {
      let rows = allTx;
      const fSearch = document.getElementById('f-search').value.trim().toLowerCase();
      const fAccount = document.getElementById('f-account').value;
      const fFrom = document.getElementById('f-from').value;
      const fTo = document.getElementById('f-to').value;
      const fUnreconciled = document.getElementById('f-unreconciled').checked;
      if (fSearch) rows = rows.filter((t) =>
        (t.description || '').toLowerCase().includes(fSearch) ||
        (t.reference_number || '').toLowerCase().includes(fSearch) ||
        (t.fb_name || '').toLowerCase().includes(fSearch) ||
        (t.customer_name || '').toLowerCase().includes(fSearch) ||
        (t.order_id || '').toLowerCase().includes(fSearch) ||
        (t.accounts && t.accounts.name.toLowerCase().includes(fSearch)));
      if (fAccount !== 'all') rows = rows.filter((t) => String(t.account_id) === fAccount);
      // datetime-local gives "2026-09-01T14:30"; the DB gives "2026-09-01 13:51:00" --
      // normalize both to "YYYY-MM-DDTHH:MM" so the comparison covers time, not just date.
      if (fFrom) rows = rows.filter((t) => t.transaction_datetime && t.transaction_datetime.replace(' ', 'T').slice(0, 16) >= fFrom);
      if (fTo) rows = rows.filter((t) => t.transaction_datetime && t.transaction_datetime.replace(' ', 'T').slice(0, 16) <= fTo);
      if (fUnreconciled) rows = rows.filter((t) => t.credit != null && !t.order_id);

      const totalCredit = rows.reduce((s, t) => s + Number(t.credit || 0), 0);
      const totalDebit = rows.reduce((s, t) => s + Number(t.debit || 0), 0);
      const missingOrderId = rows.filter((t) => t.credit != null && !t.order_id).length;
      document.getElementById('tx-tiles').innerHTML =
        tile(money(totalCredit), 'Total Credit') + tile(money(totalDebit), 'Total Debit') +
        tile(String(missingOrderId), 'Missing Order ID') + tile(String(rows.length), 'Count');

      const list = document.getElementById('tx-list');
      if (!rows.length) { list.innerHTML = '<p class="muted">No transactions for this filter.</p>'; return; }

      // Every field shows directly in its own row -- no click-to-expand -- since a
      // second click just to reveal data already needed on screen wastes the time of
      // whoever is reconciling dozens of these. Wide, so it scrolls horizontally as one
      // table (same shape as the bank's own statement export), not per-row.
      const inputStyle = 'padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;width:100%;box-sizing:border-box;';
      function txRowHtml(t) {
        const when = t.transaction_datetime ? t.transaction_datetime.replace('T', ' ').slice(0, 16) : '—';
        const missing = t.credit != null && !t.order_id;
        const amountLbl = t.credit != null
          ? '<span style="color:var(--ok);">+' + money(t.credit) + '</span>'
          : (t.debit != null ? '<span class="muted">-' + money(t.debit) + '</span>' : '—');
        return '<tr data-id="' + t.id + '"' + (missing ? ' style="background:#fdecea;"' : '') + '>' +
          '<td style="white-space:nowrap;">' + when + '</td>' +
          '<td>' + esc(t.description || '—') +
            (t.notes || t.creator ? '<div class="muted" style="font-size:10px;">' + esc(t.source) + (t.creator ? ' · ' + esc(t.creator.full_name) : '') + (t.notes ? ' · ' + esc(t.notes) : '') + '</div>' : '') +
          '</td>' +
          '<td style="white-space:nowrap;">' + esc(t.reference_number || '—') + '</td>' +
          '<td style="white-space:nowrap;text-align:right;">' + amountLbl + '</td>' +
          '<td><input type="text" name="fbName" value="' + esc(t.fb_name || '') + '" placeholder="FB Name" style="' + inputStyle + 'min-width:90px;"></td>' +
          '<td><input type="text" name="customerName" value="' + esc(t.customer_name || '') + '" placeholder="Customer Name" style="' + inputStyle + 'min-width:110px;"></td>' +
          '<td><input type="text" name="orderId" value="' + esc(t.order_id || '') + '" placeholder="Order ID" style="' + inputStyle + 'min-width:80px;">' +
            (missing ? '<div class="badge low" style="margin-top:2px;">No Order ID</div>' : '') +
          '</td>' +
          '<td style="white-space:nowrap;">' +
            '<button class="btn small" type="button" data-act="save" data-id="' + t.id + '">Save</button>' +
            (canManage ? ' <button class="btn small secondary" type="button" data-act="delete" data-id="' + t.id + '">Delete</button>' : '') +
          '</td>' +
        '</tr>';
      }
      const theadHtml = '<thead><tr>' +
        '<th>Date &amp; Time</th><th>Description</th><th>Ref No.</th><th>Amount</th>' +
        '<th>FB Name</th><th>Customer Name</th><th>Order ID</th><th></th>' +
      '</tr></thead>';

      if (fAccount !== 'all') {
        list.innerHTML = '<div class="table-scroll"><table>' + theadHtml + '<tbody>' + rows.map(txRowHtml).join('') + '</tbody></table></div>';
      } else {
        const groups = {};
        const order = [];
        rows.forEach((t) => {
          const key = t.account_id;
          if (!groups[key]) { groups[key] = []; order.push(key); }
          groups[key].push(t);
        });
        order.sort((a, b) => (accountLabel(groups[a][0]) > accountLabel(groups[b][0]) ? 1 : -1));
        list.innerHTML = order.map((key) => {
          const groupRows = groups[key];
          const groupCredit = groupRows.reduce((s, t) => s + Number(t.credit || 0), 0);
          const groupDebit = groupRows.reduce((s, t) => s + Number(t.debit || 0), 0);
          const label = accountLabel(groupRows[0]);
          return '<h4 style="margin:16px 0 4px;cursor:pointer;display:inline-block;padding:2px 8px;border-radius:10px;' + accountColorStyle(label) + '" data-filter-account="' + key + '" title="Show only ' + esc(label) + '">' + esc(label) +
            ' <span class="muted" style="font-weight:normal;font-size:12px;">— ' + groupRows.length + ' txn, +' + money(groupCredit) + ' / -' + money(groupDebit) + '</span></h4>' +
            '<div class="table-scroll"><table>' + theadHtml + '<tbody>' + groupRows.map(txRowHtml).join('') + '</tbody></table></div>';
        }).join('');
      }

      list.querySelectorAll('[data-filter-account]').forEach((el) => el.addEventListener('click', () => {
        document.getElementById('f-account').value = String(el.dataset.filterAccount);
        render();
      }));

      list.querySelectorAll('[data-act="save"]').forEach((btn) => btn.addEventListener('click', async () => {
        const tr = btn.closest('tr');
        try {
          await updateTransactionReconciliation(btn.dataset.id, {
            fbName: tr.querySelector('[name="fbName"]').value.trim(),
            customerName: tr.querySelector('[name="customerName"]').value.trim(),
            orderId: tr.querySelector('[name="orderId"]').value.trim(),
          });
          toast('tx-msg', 'Saved.', false);
          await load();
        } catch (err) {
          toast('tx-msg', String(err.message || err), true);
        }
      }));

      if (canManage) {
        list.querySelectorAll('[data-act="delete"]').forEach((btn) => btn.addEventListener('click', async () => {
          if (!confirm('Delete this transaction?')) return;
          try { await deleteTransaction(btn.dataset.id); toast('tx-msg', 'Deleted.', false); await load(); }
          catch (err) { toast('tx-msg', String(err.message || err), true); }
        }));
      }
    }

    function tile(num, label) { return '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>'; }
  }
}
</script>
</body>
</html>
